apiVersion: v2
name: mea
description: >-
  The modernized Spring-to-Quarkus system (strangler proxy + six extracted
  bounded contexts + GraphQL gateway, with Postgres and KRaft Kafka) deployed to
  OpenShift. The OpenShift counterpart to deploy/k8s/ — same topology, but using
  Routes for ingress, the internal image registry for images, and SCCs instead of
  pinned UIDs. See the book's OpenShift appendix.
type: application
version: 1.0.0
appVersion: "1.0"
keywords:
  - quarkus
  - camel
  - strangler-fig
  - openshift
maintainers:
  - name: patterncatalyst
