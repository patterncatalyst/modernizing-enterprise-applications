# Dev-only Postgres credential — the Helm port of deploy/k8s/base/app-secret.yaml.
# Republishes the repo's existing demo credential as a Secret the Deployments
# secretKeyRef instead of hardcoding again. PRODUCTION: replace with a
# SealedSecret (encrypted at rest in git) or an ExternalSecret (synced from a
# secret manager) — a plaintext Secret manifest is never how real creds ship.
apiVersion: v1
kind: Secret
metadata:
  name: mea-postgres-app
  labels:
    {{- include "mea.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
