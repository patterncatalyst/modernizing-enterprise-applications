{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.route }}
---
# OpenShift Route — the platform-native ingress. Replaces the port-forward /
# NodePort dance the deploy/k8s/base manifests leave to the reader: the cluster's
# router (the `ingress` cluster operator) gives this Service a real external
# hostname, <name>-<namespace>.apps-crc.testing on CRC. Edge TLS terminates at
# the router; plain HTTP is redirected to HTTPS.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "mea.labels" $root | nindent 4 }}
spec:
  to:
    kind: Service
    name: {{ $name }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
{{- end }}
