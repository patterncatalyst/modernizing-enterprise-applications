{{- $root := . -}}
{{- $dns := include "mea.dns" . -}}
{{- range $name, $svc := .Values.services }}
{{- $res := index $root.Values.resources $svc.size }}
---
# {{ $name }} — {{ if $svc.route }}externally exposed via Route; {{ end }}{{ if $svc.db }}owns schema via {{ $svc.db }}; {{ end }}{{ if $svc.kafka }}Kafka consumer (graceful shutdown); {{ end }}{{ $svc.probe }} health probe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "mea.labels" $root | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: mea
    spec:
      {{- if $svc.kafka }}
      # Kafka consumer: allow in-flight records to commit before SIGKILL.
      terminationGracePeriodSeconds: 45
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $root.Values.image.registry }}/{{ $name }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
            {{- if $svc.grpcPort }}
            - name: grpc
              containerPort: {{ $svc.grpcPort }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: mea-app-config
          {{- if $svc.db }}
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              valueFrom:
                configMapKeyRef:
                  name: mea-app-config
                  key: {{ $svc.db }}
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mea-postgres-app
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mea-postgres-app
                  key: password
          {{- end }}
          {{- if $svc.kafka }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          {{- end }}
          {{- if eq $svc.probe "http" }}
          startupProbe:
            httpGet: { path: /q/health/started, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /q/health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /q/health/live, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          {{- else }}
          # No quarkus-smallrye-health on the classpath → TCP probe proves the
          # HTTP listener is up, not that routing/business health is good.
          startupProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          {{- end }}
          resources:
            requests:
              cpu: {{ $res.requests.cpu }}
              memory: {{ $res.requests.memory }}
            limits:
              cpu: {{ $res.limits.cpu }}
              memory: {{ $res.limits.memory }}
          # No runAsUser: OpenShift's restricted-v2 SCC assigns a UID from the
          # namespace range, and the UBI9 OpenJDK image runs fine as any UID
          # (group 0, g+rwx on /deployments). This is the key change from the
          # deploy/k8s/base manifests, which pinned runAsUser: 185.
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
{{- end }}
