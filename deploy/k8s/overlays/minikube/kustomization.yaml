apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ch.30 SEAM: uncommented. Istio's namespace-scoped CRs (PeerAuthentication,
# Telemetry) and the LGTM observability backend are sibling overlays
# composed on top of ../../base here, the same way
# ~/Dev/datamesh-reference-arch-quarkus/k8s/istio is a sibling overlay (not
# nested inside base). The IstioOperator install itself
# (deploy/k8s/istio/istio-install.yaml) is NOT in this list -- it's applied
# separately via `istioctl install -f`, not `kubectl apply -k`.
resources:
  - ../../base
  - ../../istio
  - ../../observability

# Images: built with `podman build -t mea/<svc>:latest`, then sideloaded
# into minikube's containerd via `podman save | minikube image load
# <tarball>` -- this cluster runs --container-runtime=containerd, and
# `minikube podman-env` refuses to wire up for anything but the `crio`
# runtime ("the podman-env command is only compatible with the 'crio'
# runtime"), so the README's `eval $(minikube podman-env)` direct-build path
# doesn't apply here; save+load is the alternative minikube documents.
# podman's save/load round-trip always qualifies an unqualified repo name
# with the implicit `localhost/` prefix (confirmed via `crictl images` on
# the mea node after loading), so `newName` below retargets each image
# reference to match what's actually sitting in containerd's local store --
# without it, the kubelet's `mea/<svc>:latest` reference gets normalized to
# `docker.io/mea/<svc>:latest` and attempts (and fails) a real registry
# pull. `newTag` still pins the tag.
images:
  - name: mea/strangler-proxy
    newName: localhost/mea/strangler-proxy
    newTag: latest
  - name: mea/review-service
    newName: localhost/mea/review-service
    newTag: latest
  - name: mea/notification-service
    newName: localhost/mea/notification-service
    newTag: latest
  - name: mea/inventory-service
    newName: localhost/mea/inventory-service
    newTag: latest
  - name: mea/payment-service
    newName: localhost/mea/payment-service
    newTag: latest
  - name: mea/shipping-service
    newName: localhost/mea/shipping-service
    newTag: latest
  - name: mea/order-service
    newName: localhost/mea/order-service
    newTag: latest
  - name: mea/graphql-gateway
    newName: localhost/mea/graphql-gateway
    newTag: latest

# strangler-proxy is the system's single REST edge router (every client
# request enters here, see strangler-proxy.yaml) -- the one Service this
# overlay exposes off-cluster, via NodePort instead of base's ClusterIP.
# Every other Service stays ClusterIP-only (ClusterIP's default), reachable
# only from inside the cluster, matching the real topology: nothing but the
# edge router is meant to be dialed directly from outside.
patches:
  - target:
      kind: Service
      name: strangler-proxy
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort

  # ch.30 mesh opt-in: a pod-template LABEL (not annotation) on each of the
  # 8 app Deployments -- Istio's sidecar-injection MutatingWebhookConfiguration's
  # objectSelector matches sidecar.istio.io/inject In ["true"] against the
  # admitted object's LABELS, never its annotations (verified live against a
  # cluster in ~/Dev/datamesh-reference-arch-quarkus/k8s/istio -- the
  # annotation form silently injects nothing in an unlabeled namespace, which
  # `mea` deliberately stays, same as that repo's `datamesh`). Deliberately
  # NOT applied to postgres/kafka (deploy/k8s/base/infra/*-statefulset.yaml)
  # -- meshing a CloudNativePG/Strimzi-style stateful workload's own TLS
  # collides with the injected sidecar's mTLS wrapping (lgtm-minikube-stack
  # known-issues.md, Issue 2).
  - target:
      kind: Deployment
      name: strangler-proxy
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/sidecar.istio.io~1inject
        value: "true"
  - target:
      kind: Deployment
      name: review-service
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/sidecar.istio.io~1inject
        value: "true"
  - target:
      kind: Deployment
      name: notification-service
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/sidecar.istio.io~1inject
        value: "true"
  - target:
      kind: Deployment
      name: inventory-service
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/sidecar.istio.io~1inject
        value: "true"
  - target:
      kind: Deployment
      name: payment-service
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/sidecar.istio.io~1inject
        value: "true"
  - target:
      kind: Deployment
      name: shipping-service
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/sidecar.istio.io~1inject
        value: "true"
  - target:
      kind: Deployment
      name: order-service
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/sidecar.istio.io~1inject
        value: "true"
  - target:
      kind: Deployment
      name: graphql-gateway
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/sidecar.istio.io~1inject
        value: "true"
