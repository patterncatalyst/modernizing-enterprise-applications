apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ch.30 SEAM: uncommented. Istio's namespace-scoped CRs (PeerAuthentication,
# Telemetry) and the LGTM observability backend are sibling overlays
# composed on top of ../../base here, the same way
# ~/Dev/datamesh-reference-arch-quarkus/k8s/istio is a sibling overlay (not
# nested inside base). The IstioOperator install itself
# (deploy/k8s/istio/istio-install.yaml) is NOT in this list -- it's applied
# separately via `istioctl install -f`, not `kubectl apply -k`.
resources:
  - ../../base
  - ../../istio
  - ../../observability

# Images (DRQ-085): built on the host with Docker Engine (`docker build -t
# mea/<svc>:1.0`) and copied into the profile's containerd with `minikube -p
# mea image load mea/<svc>:1.0` -- deploy/k8s/scripts/build-images.sh does
# both. The cluster runs --driver=docker --container-runtime=containerd, so
# there is no shared image store and no registry: the kubelet must use the
# loaded image or fail loudly, hence imagePullPolicy: Never on every app
# Deployment below (ErrImageNeverPull names a missing load instead of a
# confusing pull from docker.io/mea/...). The tag is a fixed `1.0` rather
# than `latest`; rebuild + reload + `kubectl rollout restart` to pick up a
# new build. (The podman save/load round-trip this overlay used before
# qualified names as localhost/mea/...; Docker-built images load as
# docker.io/mea/..., which is what the bare `mea/<svc>` reference
# normalizes to, so no newName is needed.)
images:
  - name: mea/strangler-proxy
    newTag: "1.0"
  - name: mea/review-service
    newTag: "1.0"
  - name: mea/notification-service
    newTag: "1.0"
  - name: mea/inventory-service
    newTag: "1.0"
  - name: mea/payment-service
    newTag: "1.0"
  - name: mea/shipping-service
    newTag: "1.0"
  - name: mea/order-service
    newTag: "1.0"
  - name: mea/graphql-gateway
    newTag: "1.0"

# strangler-proxy is the system's single REST edge router (every client
# request enters here, see strangler-proxy.yaml) -- the one Service this
# overlay exposes off-cluster, via NodePort instead of base's ClusterIP.
# Every other Service stays ClusterIP-only (ClusterIP's default), reachable
# only from inside the cluster, matching the real topology: nothing but the
# edge router is meant to be dialed directly from outside.
patches:
  - target:
      kind: Service
      name: strangler-proxy
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      # Fixed NodePort, published to the host at profile creation
      # (deploy/k8s/scripts/setup-profile.sh: --ports=127.0.0.1:30888:30888),
      # so http://127.0.0.1:30888 reaches the edge router directly. No
      # port-forward, no tunnel, no `minikube service`.
      - op: add
        path: /spec/ports/0/nodePort
        value: 30888

  # ch.30 mesh opt-in: a pod-template LABEL (not annotation) on each of the
  # 8 app Deployments -- Istio's sidecar-injection MutatingWebhookConfiguration's
  # objectSelector matches sidecar.istio.io/inject In ["true"] against the
  # admitted object's LABELS, never its annotations (verified live against a
  # cluster in ~/Dev/datamesh-reference-arch-quarkus/k8s/istio -- the
  # annotation form silently injects nothing in an unlabeled namespace, which
  # `mea` deliberately stays, same as that repo's `datamesh`). Deliberately
  # NOT applied to postgres/kafka (deploy/k8s/base/infra/*-statefulset.yaml)
  # -- meshing a CloudNativePG/Strimzi-style stateful workload's own TLS
  # collides with the injected sidecar's mTLS wrapping (lgtm-minikube-stack
  # known-issues.md, Issue 2).
  - target:
      kind: Deployment
      name: strangler-proxy
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/sidecar.istio.io~1inject
        value: "true"
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: review-service
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/sidecar.istio.io~1inject
        value: "true"
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: notification-service
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/sidecar.istio.io~1inject
        value: "true"
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: inventory-service
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/sidecar.istio.io~1inject
        value: "true"
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: payment-service
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/sidecar.istio.io~1inject
        value: "true"
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: shipping-service
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/sidecar.istio.io~1inject
        value: "true"
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: order-service
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/sidecar.istio.io~1inject
        value: "true"
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: graphql-gateway
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/sidecar.istio.io~1inject
        value: "true"
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
