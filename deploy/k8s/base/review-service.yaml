# review-service -- stayed in the monolith's SHARED `public` Postgres schema
# (ch.15 Phase A, DRQ-029): reads/writes the existing `reviews` table plus
# read-only `customers`/`inventory_items` projections. UNLIKE the other five
# DB-backed services, its quarkus.datasource.jdbc.url carries NO
# currentSchema param (examples/02-review-service/.../application.properties)
# -- REVIEW_SERVICE_JDBC_URL in mea-app-config matches that real config
# exactly (no `?currentSchema=...` suffix).
#
# Health: review-service's pom.xml carries NO quarkus-smallrye-health
# (confirmed: examples/02-review-service/pom.xml). Same deviation as
# strangler-proxy -- tcpSocket probes on the HTTP port instead of httpGet
# /q/health/*. Adding quarkus-smallrye-health to
# examples/02-review-service/pom.xml (ch.27's six-of-eight note) would
# upgrade these to httpGet; out of scope for this manifests-only step.
#
# Not a Kafka consumer -- no graceful-shutdown preStop/terminationGrace
# needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
  namespace: mea
  labels:
    app.kubernetes.io/name: review-service
    app.kubernetes.io/part-of: mea
    app.kubernetes.io/component: bounded-context
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: review-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: review-service
        app.kubernetes.io/part-of: mea
        app.kubernetes.io/component: bounded-context
    spec:
      containers:
        - name: review-service
          image: mea/review-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: mea-app-config
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              valueFrom:
                configMapKeyRef:
                  name: mea-app-config
                  key: REVIEW_SERVICE_JDBC_URL
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mea-postgres-app
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mea-postgres-app
                  key: password
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 185
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: review-service
  namespace: mea
  labels:
    app.kubernetes.io/name: review-service
    app.kubernetes.io/part-of: mea
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: review-service
  ports:
    - name: http
      port: 8081
      targetPort: http
