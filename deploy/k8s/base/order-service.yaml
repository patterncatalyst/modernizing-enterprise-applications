# order-service -- owns its own `order_service` Postgres schema (ch.26,
# DRQ-073): placeOrder writes order.placed to its own transactional outbox
# (relayed by OrderOutboxRelay); the four OrderSagaListener reactions
# (payment-captured/payment-declined/shipment-dispatched/shipment-failed,
# own consumer group) drive the rest of the lifecycle. Also a gRPC CLIENT
# (RemoteInventoryClient, @GrpcClient("inventory")) to inventory-service's
# gRPC server -- quarkus.grpc.clients.inventory.host/port are HARDCODED to
# localhost/9004 in application.properties, so QUARKUS_GRPC_CLIENTS_
# INVENTORY_HOST/PORT (ordinal-override, see mea-app-config) is what
# actually redirects this to the in-cluster inventory-service Service.
# Health: quarkus-smallrye-health is on the classpath
# (examples/07-order-service/pom.xml), so /q/health/{started,ready,live}
# are real httpGet targets.
#
# Graceful shutdown: same Kafka-consumer discipline as the other saga/outbox
# services (terminationGracePeriodSeconds: 45 + 10s preStop sleep) -- this
# service has FOUR incoming channels plus its outbox's outgoing channel, the
# widest fan-in of any service here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: mea
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: mea
    app.kubernetes.io/component: bounded-context
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        app.kubernetes.io/part-of: mea
        app.kubernetes.io/component: bounded-context
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: order-service
          image: mea/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8087
          envFrom:
            - configMapRef:
                name: mea-app-config
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              valueFrom:
                configMapKeyRef:
                  name: mea-app-config
                  key: ORDER_SERVICE_JDBC_URL
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mea-postgres-app
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mea-postgres-app
                  key: password
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 150m
              memory: 320Mi
            limits:
              cpu: 750m
              memory: 640Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 185
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: mea
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: mea
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: order-service
  ports:
    - name: http
      port: 8087
      targetPort: http
