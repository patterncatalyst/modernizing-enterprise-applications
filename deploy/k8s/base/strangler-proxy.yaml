# strangler-proxy — the Camel edge router for all six extracted bounded
# contexts (order-plan.md S10 / DRQ-070: the strangler fig has completed,
# this is the system's permanent REST edge router, not a transitional
# component). Clients talk to this Service; it dispatches on URI path
# prefix to one of the six STRANGLER_*_BASE_URL targets in mea-app-config
# -- never a header- or request-derived value (build-plan.md secure-by-
# default discipline for a dynamic-URI Camel route).
#
# Health: strangler-proxy's pom.xml carries NO quarkus-smallrye-health
# (confirmed: examples/01-strangler-proxy/pom.xml). /q/health/* would 404,
# so httpGet probes would never succeed and the Deployment would never go
# Ready. Probes below use tcpSocket on the HTTP port instead -- proves the
# Vert.x HTTP listener is up, not that routing actually works. Adding
# quarkus-smallrye-health to examples/01-strangler-proxy/pom.xml (ch.27's
# "six of eight services carry quarkus-smallrye-health" note -- review-
# service and strangler-proxy are the two without it) would upgrade this
# to httpGet /q/health/{started,ready,live}; that pom.xml change is outside
# this manifests-only step.
#
# Not a Kafka consumer -- no graceful-shutdown preStop/terminationGrace
# needed (contrast the five Kafka-consuming services' manifests).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: strangler-proxy
  namespace: mea
  labels:
    app.kubernetes.io/name: strangler-proxy
    app.kubernetes.io/part-of: mea
    app.kubernetes.io/component: edge-router
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: strangler-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strangler-proxy
        app.kubernetes.io/part-of: mea
        app.kubernetes.io/component: edge-router
    spec:
      containers:
        - name: strangler-proxy
          image: mea/strangler-proxy:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8888
          envFrom:
            - configMapRef:
                name: mea-app-config
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 185
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: strangler-proxy
  namespace: mea
  labels:
    app.kubernetes.io/name: strangler-proxy
    app.kubernetes.io/part-of: mea
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: strangler-proxy
  ports:
    - name: http
      port: 8888
      targetPort: http
