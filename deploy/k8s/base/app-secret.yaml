# app-secret.yaml — DB credentials for the shared `monolith` Postgres server.
#
# DEV-ONLY, PLAINTEXT-IN-GIT Secret. Every service's application.properties
# already hardcodes these exact values (quarkus.datasource.username=monolith /
# quarkus.datasource.password=monolith_dev_only — see e.g.
# examples/02-review-service/src/main/resources/application.properties and
# every %prod.quarkus.datasource.* block in examples/03..07), and
# compose.yaml/.env.example pin the identical POSTGRES_USER/POSTGRES_PASSWORD
# for the podman-stack Postgres — so this Secret does not introduce a new
# credential, it only republishes the repo's existing dev-only demo
# credential as a Kubernetes object the Deployments can secretKeyRef instead
# of hardcoding a second time.
#
# PRODUCTION: this plaintext Secret manifest is never how real credentials
# reach a cluster. A production overlay would replace this resource with a
# SealedSecret (bitnami-labs/sealed-secrets — encrypted at rest in git,
# decrypted only by the in-cluster controller) or an ExternalSecret
# (external-secrets.io, synced from Vault/Bitwarden/cloud secret manager) —
# deferred along with the rest of the production hardening pass (ch.30/
# demo-only scope note in deploy/k8s/base/infra/*.yaml and deploy/k8s/README.md).
apiVersion: v1
kind: Secret
metadata:
  name: mea-postgres-app
  namespace: mea
  labels:
    app.kubernetes.io/part-of: mea
type: Opaque
stringData:
  username: "monolith"
  password: "monolith_dev_only"
