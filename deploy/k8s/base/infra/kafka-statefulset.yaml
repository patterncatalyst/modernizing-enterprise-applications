# kafka-statefulset.yaml -- single-broker KRaft-mode Kafka (no ZooKeeper),
# mirroring compose.yaml's `kafka` service: same image family/tag
# (apache/kafka:3.8.0, .env.example KAFKA_IMAGE_TAG), the same KRaft
# broker+controller-combined-role env block, and the same topic defaults
# (KAFKA_AUTO_CREATE_TOPICS_ENABLE=true, 3 partitions, replication factor 1
# -- a single-broker cluster can't replicate beyond 1 anyway). Two
# differences from compose.yaml, both because there is only ONE network
# here (no separate host-vs-container-network split the way podman compose
# needs one): (1) a single PLAINTEXT listener (no DOCKER:9094 listener --
# every client, in-cluster or not, reaches this broker the same way, via the
# `kafka` Service); (2) KAFKA_ADVERTISED_LISTENERS/KAFKA_CONTROLLER_QUORUM_
# VOTERS point at the `kafka` Service DNS name instead of compose's
# `localhost`/`kafka` container-network alias.
#
# Connect/CDC (Debezium, infra/debezium/*), Apicurio Schema Registry, and the
# LGTM observability stack are DEFERRED to ch.30/demo-only scope -- this
# manifest brings up the broker only, same split documented in
# postgres-statefulset.yaml.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: mea
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: mea
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: plaintext
    - name: controller
      port: 9093
      targetPort: controller
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: mea
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: mea
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: mea
    spec:
      containers:
        - name: kafka
          image: docker.io/apache/kafka:3.8.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: plaintext
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka.mea.svc.cluster.local:9093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka.mea.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "1"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # Matches .env.example's tracked default (KAFKA_CLUSTER_ID) --
            # any base64-ish string works; only change it if kafka-data is
            # destroyed and a fresh cluster identity is needed.
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # The apache/kafka official image already runs as a non-root
          # "appuser" (uid 1000) by default -- unlike postgres, no fsGroup
          # override is needed for it to write its own data dir.
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
