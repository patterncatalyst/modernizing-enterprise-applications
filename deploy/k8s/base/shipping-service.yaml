# shipping-service -- owns its own `shipping` Postgres schema (r07/ch.24,
# DRQ-063/DRQ-059): a Camel Saga EIP route consumes `payment.captured`,
# enriches via a REST call to order-service (order.service.base-url=
# ${ORDER_SERVICE_BASE_URL:...}, see mea-app-config), dispatches, and emits
# shipment.dispatched|shipment.failed via its own transactional outbox.
# Health: quarkus-smallrye-health is on the classpath
# (examples/06-shipping-service/pom.xml), so /q/health/{started,ready,live}
# are real httpGet targets.
#
# Graceful shutdown: same Kafka-consumer discipline as the other saga/outbox
# services (terminationGracePeriodSeconds: 45 + 10s preStop sleep).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-service
  namespace: mea
  labels:
    app.kubernetes.io/name: shipping-service
    app.kubernetes.io/part-of: mea
    app.kubernetes.io/component: bounded-context
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shipping-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipping-service
        app.kubernetes.io/part-of: mea
        app.kubernetes.io/component: bounded-context
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: shipping-service
          image: mea/shipping-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8088
          envFrom:
            - configMapRef:
                name: mea-app-config
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              valueFrom:
                configMapKeyRef:
                  name: mea-app-config
                  key: SHIPPING_SERVICE_JDBC_URL
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mea-postgres-app
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mea-postgres-app
                  key: password
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 150m
              memory: 320Mi
            limits:
              cpu: 750m
              memory: 640Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 185
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: shipping-service
  namespace: mea
  labels:
    app.kubernetes.io/name: shipping-service
    app.kubernetes.io/part-of: mea
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shipping-service
  ports:
    - name: http
      port: 8088
      targetPort: http
