# inventory-service -- owns its own `inventory` Postgres schema (r05/ch.19,
# DRQ-039/DRQ-040/DRQ-044): a WRITABLE CDC-fed replica of the monolith's
# former public.inventory_items, kept current by a Debezium CDC consumer on
# `mea.public.inventory_items` (dedicated group id inventory-service-cdc).
# ALSO hosts a gRPC SERVER (InventoryGrpcServiceImpl, use-separate-server=
# true) on port 9004 -- order-service's RemoteInventoryClient and
# graphql-gateway's GetStock client both dial this Service on that port
# (see mea-app-config's INVENTORY_GRPC_HOST/PORT and
# QUARKUS_GRPC_CLIENTS_INVENTORY_HOST/PORT keys). Health: quarkus-smallrye-
# health is on the classpath (examples/04-inventory-service/pom.xml), so
# /q/health/{started,ready,live} are real httpGet targets.
#
# Graceful shutdown: same Kafka-consumer discipline as notification-service
# (terminationGracePeriodSeconds: 45 + 10s preStop sleep) -- this service's
# CDC consumer needs the same clean LeaveGroupRequest window.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: mea
  labels:
    app.kubernetes.io/name: inventory-service
    app.kubernetes.io/part-of: mea
    app.kubernetes.io/component: bounded-context
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-service
        app.kubernetes.io/part-of: mea
        app.kubernetes.io/component: bounded-context
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: inventory-service
          image: mea/inventory-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
            - name: grpc
              containerPort: 9004
          envFrom:
            - configMapRef:
                name: mea-app-config
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              valueFrom:
                configMapKeyRef:
                  name: mea-app-config
                  key: INVENTORY_SERVICE_JDBC_URL
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mea-postgres-app
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mea-postgres-app
                  key: password
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 150m
              memory: 320Mi
            limits:
              cpu: 750m
              memory: 640Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 185
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: mea
  labels:
    app.kubernetes.io/name: inventory-service
    app.kubernetes.io/part-of: mea
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: inventory-service
  ports:
    - name: http
      port: 8084
      targetPort: http
    - name: grpc
      port: 9004
      targetPort: grpc
