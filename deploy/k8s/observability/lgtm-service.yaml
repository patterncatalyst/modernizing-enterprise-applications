# lgtm-service.yaml — ch.30 (additive)
#
# `lgtm` (ClusterIP): the in-cluster DNS name every app/mesh-provider config
# points at -- lgtm.mea.svc.cluster.local -- carrying all 6 signal ports.
# This is what examples/{04,07,08}'s quarkus.otel.exporter.otlp.traces.endpoint
# and deploy/k8s/istio/istio-install.yaml's `otel` extensionProvider both
# target.
#
# `lgtm-grafana` (NodePort): host-reachable access to the Grafana UI only,
# mirroring compose.yaml's host port-mapping convention for this service
# (strangler-proxy is the only other NodePort in this tree, per
# deploy/k8s/overlays/minikube/kustomization.yaml).
apiVersion: v1
kind: Service
metadata:
  name: lgtm
  namespace: mea
  labels:
    app.kubernetes.io/name: lgtm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lgtm
  ports:
    # Named "grpc-otlp", not "otlp-grpc": Istio's port-protocol auto-detection
    # keys off the port name's prefix (the segment before the first "-")
    # being exactly one of its recognized tokens (grpc, http, http2, tcp,
    # tls, ...). "otlp-grpc" doesn't match ("otlp" isn't a recognized
    # prefix), so Envoy silently treated this as opaque TCP -- no HTTP/2
    # cluster options -- and Istio's own OTLP/gRPC trace-export client
    # (meshConfig.extensionProviders' `otel` provider, deploy/k8s/istio/
    # istio-install.yaml) failed 100% of its export calls as a result
    # (confirmed live: cluster outbound|4317||lgtm.mea.svc.cluster.local
    # showed rq_total==rq_error, rq_success=0 before this rename).
    - name: grpc-otlp
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: grafana
      port: 3000
      targetPort: 3000
    - name: prometheus
      port: 9090
      targetPort: 9090
    - name: loki
      port: 3100
      targetPort: 3100
    - name: tempo
      port: 3200
      targetPort: 3200
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm-grafana
  namespace: mea
  labels:
    app.kubernetes.io/name: lgtm
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: lgtm
  ports:
    - name: grafana
      port: 3000
      targetPort: 3000
