<text x="590.0" y="32" font-size="18" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.15 — Review service: the two-phase migration template</text>
<text x="590.0" y="60" font-size="12" fill="#555555" text-anchor="middle">Phase A de-risks the extraction fast; Phase B is where the &quot;why Quarkus&quot; case gets made with numbers.</text>
