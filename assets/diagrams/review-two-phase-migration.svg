<text x="850" y="345" font-size="12.5" fill="#1d1d1d" text-anchor="start" font-weight="700">RSS</text>
<text x="70" y="377" font-size="12.5" fill="#333333" text-anchor="start">Phase A — JVM (spring-compat)</text>
