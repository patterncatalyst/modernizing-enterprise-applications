<text x="620" y="441" font-size="12.5" fill="#333333" text-anchor="start">0.048–0.049 s</text>
<text x="850" y="441" font-size="12.5" fill="#333333" text-anchor="start">~73 MB</text>
<text x="40" y="480" font-size="12" fill="#2f5f3d" text-anchor="start" font-weight="700">~30x faster startup, ~4.2x less resident memory: JVM -&gt; native, same idiomatic code (closed-world reflection gotcha: ApiError needed @RegisterForReflection; see MIGRATION.md).</text>
