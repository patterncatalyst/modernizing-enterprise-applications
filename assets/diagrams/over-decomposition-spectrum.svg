<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5f3d"/></marker></defs>
<rect x="470" y="110" width="520" height="300" rx="12" fill="#eaf4ec" stroke="#ddd"/>
<text x="482" y="130" font-size="12" font-weight="700" fill="#1d1d1d">right-sized: services aligned to bounded contexts</text>
<rect x="60" y="170" width="180" height="150" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="150.0" y="228.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">1 monolith</text>
<text x="150.0" y="245.0" font-size="11.5" fill="#555555" text-anchor="middle">one deploy, one DB</text>
<text x="150.0" y="260.0" font-size="11.5" fill="#555555" text-anchor="middle">ch.08-10</text>
<text x="150.0" y="275.0" font-size="11.5" fill="#555555" text-anchor="middle">too coupled to change safely</text>
<rect x="270" y="170" width="170" height="150" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="355.0" y="228.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">modular monolith</text>
<text x="355.0" y="245.0" font-size="11.5" fill="#555555" text-anchor="middle">modules, one deploy</text>
<text x="355.0" y="260.0" font-size="11.5" fill="#555555" text-anchor="middle">a valid destination</text>
<text x="355.0" y="275.0" font-size="11.5" fill="#555555" text-anchor="middle">— not this book&#x27;s</text>
<rect x="500" y="170" width="230" height="170" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="615.0" y="230.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">6 context services</text>
<text x="615.0" y="247.5" font-size="11.5" fill="#555555" text-anchor="middle">order · inventory · payment</text>
<text x="615.0" y="262.5" font-size="11.5" fill="#555555" text-anchor="middle">shipping · notification · review</text>
<text x="615.0" y="277.5" font-size="11.5" fill="#555555" text-anchor="middle">+ graphql-gateway</text>
<text x="615.0" y="292.5" font-size="11.5" fill="#555555" text-anchor="middle">&lt;- this project (ch.26)</text>
<rect x="760" y="170" width="200" height="170" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="860.0" y="238.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">finer-grained</text>
<text x="860.0" y="255.0" font-size="11.5" fill="#555555" text-anchor="middle">split a context further</text>
<text x="860.0" y="270.0" font-size="11.5" fill="#555555" text-anchor="middle">only when a real seam</text>
<text x="860.0" y="285.0" font-size="11.5" fill="#555555" text-anchor="middle">inside it demands it</text>
<rect x="1010" y="170" width="190" height="150" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1105.0" y="228.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">nanoservice sprawl</text>
<text x="1105.0" y="245.0" font-size="11.5" fill="#555555" text-anchor="middle">a service per class</text>
<text x="1105.0" y="260.0" font-size="11.5" fill="#555555" text-anchor="middle">distributed monolith:</text>
<text x="1105.0" y="275.0" font-size="11.5" fill="#555555" text-anchor="middle">chatty, co-deployed, worse</text>
<path d="M60,440 L1200,440" fill="none" stroke="#2f5f3d" stroke-width="2" marker-end="url(#am)"/>
<text x="636.0" y="434.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">more, smaller services  -&gt;</text>
<text x="636.0" y="434.0" font-size="11" fill="#2f5f3d" text-anchor="middle">more, smaller services  -&gt;</text>
<text x="720.0" y="40" font-size="16" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.32 — the over-decomposition spectrum: where this project deliberately stopped</text>
<text x="720.0" y="62" font-size="11" fill="#555555" text-anchor="middle">the goal is context-aligned services, not maximal splitting — past the sweet spot is the distributed monolith</text>
<text x="150" y="470" font-size="11" fill="#777777" text-anchor="middle">too coupled</text>
<text x="1105" y="470" font-size="11" fill="#777777" text-anchor="middle">too chatty</text>
<text x="720.0" y="504" font-size="10" fill="#777777" text-anchor="middle">Six services came from six bounded contexts found by event storming (ch.11-13) — the seams were discovered, not invented to hit a count.</text>
</svg>