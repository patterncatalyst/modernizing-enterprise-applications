<text x="720.0" y="32" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.21 — CQRS: write model, event, read model(s)</text>
<text x="50" y="522" font-size="11" fill="#555555" text-anchor="start">The write side stays a conventional, invariant-enforcing aggregate — no event-sourcing machinery anywhere near it.</text>
<text x="900" y="522" font-size="11" fill="#555555" text-anchor="start">A CQRS read model is eventually consistent and, because it&#x27;s derived data, rebuildable by replaying</text>
<text x="900" y="538" font-size="11" fill="#555555" text-anchor="start">order.placed within retention.</text>
<text x="50" y="590" font-size="10" fill="#777777" text-anchor="start">Sourced from _docs/21-event-sourcing-and-cqrs.md (&quot;CQRS: one model for writing, maybe several for reading&quot;, &quot;notification-service is already a CQRS read model&quot;).</text>
<text x="50" y="606" font-size="10" fill="#777777" text-anchor="start">Code: examples/00-monolith/.../order/OrderService.java#placeOrder; examples/03-notification-service/.../{Notification,NotificationService,OrderPlacedConsumer}.java.</text>
