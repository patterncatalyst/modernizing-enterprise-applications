<text x="750.0" y="32" font-size="16" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.01 — Toolchain and repo layout: what you install, and where it lands</text>
<text x="750.0" y="52" font-size="11.5" fill="#555555" text-anchor="middle">SDKMAN-managed JDK/Maven/CLI tooling and the docker compose stack both build and back the examples/ tree checked into this repository</text>
<text x="20" y="632" font-size="10.5" fill="#555555" text-anchor="start">Required for every chapter: JDK 25 (Temurin) and Maven 3.9.x, or each project&#x27;s own ./mvnw. The Quarkus CLI and Camel CLI are optional conveniences scoped to Part 5 onward.</text>
<text x="20" y="648" font-size="10.5" fill="#555555" text-anchor="start">One engine for every path: Docker Engine runs the compose stack, Testcontainers/Dev Services and minikube, so the image tags compose.yaml pins are the ones every path runs.</text>
<text x="20" y="684" font-size="10" fill="#777777" text-anchor="start">Sourced from _docs/01-prerequisites.md (&quot;What you need, and where it comes from&quot;, &quot;Bring up the infrastructure stack&quot;, &quot;Finding your way around the repository&quot;), compose.yaml, .env.example, scripts/stack-up.sh.</text>
