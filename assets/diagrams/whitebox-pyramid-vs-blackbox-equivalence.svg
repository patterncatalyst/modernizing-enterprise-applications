<text x="1257.2903225806451" y="404.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">re-pointed, zero assertions edited</text>
<text x="1257.2903225806451" y="404.0" font-size="11" fill="#2f5f3d" text-anchor="middle">re-pointed, zero assertions edited</text>
<text x="780.0" y="32" font-size="16" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.10 — same system, two kinds of test: white-box pyramid vs. black-box equivalence suite</text>
<text x="780.0" y="56" font-size="12" fill="#555555" text-anchor="middle">the pyramid knows Java class names; the equivalence suite only knows baseUrl and HTTP</text>
<text x="110" y="575" font-size="10.5" fill="#555555" text-anchor="start">A white-box test can&#x27;t compile against code that doesn&#x27;t share the monolith&#x27;s class names,</text>
<text x="110" y="591" font-size="10.5" fill="#555555" text-anchor="start">let alone its database rows — it proves the implementation, not the behavior, is correct.</text>
<text x="940" y="575" font-size="10.5" fill="#555555" text-anchor="start">Every request targets baseUrl, not a hardcoded host — the same collection, unedited, can point</text>
<text x="940" y="591" font-size="10.5" fill="#555555" text-anchor="start">at the monolith today or a Quarkus service tomorrow, with not one assertion changed in between.</text>
<text x="20" y="728" font-size="10" fill="#777777" text-anchor="start">Sourced from _docs/10-testing-the-monolith.md (&quot;From a pyramid to a contract: why the equivalence suite is different&quot;).</text>
<text x="20" y="744" font-size="10" fill="#777777" text-anchor="start">Collection: tooling/newman/mea.postman_collection.json.</text>
</svg>