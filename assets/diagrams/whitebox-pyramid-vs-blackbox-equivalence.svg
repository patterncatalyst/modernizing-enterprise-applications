<text x="1170.0" y="190.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Newman — mea.postman_collection.json</text>
<text x="1170.0" y="207.5" font-size="11.5" fill="#555555" text-anchor="middle">4 scenario folders — smoke, happy-path, OOS, declined</text>
<text x="1170.0" y="222.5" font-size="11.5" fill="#555555" text-anchor="middle">+ Review Context Contract (forward reference)</text>
