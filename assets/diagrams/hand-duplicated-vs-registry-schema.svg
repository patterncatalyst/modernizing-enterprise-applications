<text x="851.5" y="543.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">order-service</text>
<text x="851.5" y="560.0" font-size="11.5" fill="#555555" text-anchor="middle">shares the generated record</text>
