<text x="700.0" y="32" font-size="16" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.28 — the same order.placed contract: hand-duplicated today, registry-governed after</text>
<text x="50" y="590" font-size="11" fill="#555555" text-anchor="start">Three independently maintained files, meant to describe one event — nothing enforces that they still agree.</text>
<text x="760" y="610" font-size="11" fill="#555555" text-anchor="start">One registered schema generates the type every side imports — one file to change.</text>
<text x="760" y="626" font-size="11" fill="#555555" text-anchor="start">The registry checks compatibility before it will accept a change.</text>
<text x="40" y="686" font-size="10" fill="#777777" text-anchor="start">Sourced from examples/07-order-service, examples/05-payment-service, examples/03-notification-service (.../OrderPlacedEvent.java) and examples/09-schema-registry-demo/src/main/avro/order-placed-v1.avsc.</text>
