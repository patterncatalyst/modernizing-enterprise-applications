<text x="750.0" y="347.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">8 tables, cross-context FKs</text>
<rect x="40" y="500" width="220" height="170" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="150.0" y="575.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">#1 Shared schema &amp; cross-context FKs</text>
<text x="150.0" y="592.5" font-size="11.5" fill="#555555" text-anchor="middle">V1__init_schema.sql — order_items-&gt;inventory_items, payments/shipments/notifications-&gt;orders, reviews-&gt;customers+inventory_items</text>
<text x="150.0" y="607.5" font-size="11.5" fill="#555555" text-anchor="middle">cures: ch.18 (owned data), ch.19 (CDC)</text>
<rect x="280" y="500" width="220" height="170" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="390.0" y="575.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">#2 God OrderService</text>
<text x="390.0" y="592.5" font-size="11.5" fill="#555555" text-anchor="middle">order/OrderService.java — reaches directly into inventory/payment/shipping/notification</text>
<text x="390.0" y="607.5" font-size="11.5" fill="#555555" text-anchor="middle">cures: ch.26 (hardest, last)</text>
<rect x="520" y="500" width="220" height="170" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="630.0" y="575.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">#3 One ACID txn, five contexts</text>
<text x="630.0" y="592.5" font-size="11.5" fill="#555555" text-anchor="middle">OrderService#placeOrder @Transactional — free rollback across order+inventory+payment+shipping+notification</text>
<text x="630.0" y="607.5" font-size="11.5" fill="#555555" text-anchor="middle">cures: ch.22 (ACID-&gt;ACD), ch.23/24 (sagas)</text>
<rect x="760" y="500" width="220" height="170" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="870.0" y="575.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">#4 Sync notification in checkout txn</text>
<text x="870.0" y="592.5" font-size="11.5" fill="#555555" text-anchor="middle">notification/NotificationService — in-process call inside placeOrder&#x27;s own transaction</text>
<text x="870.0" y="607.5" font-size="11.5" fill="#555555" text-anchor="middle">cures: ch.17 (outbox + async consumer)</text>
<rect x="1000" y="500" width="220" height="170" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="1110.0" y="575.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">#5 No ACL — raw entity leak</text>
<text x="1110.0" y="592.5" font-size="11.5" fill="#555555" text-anchor="middle">inventory/InventoryService#findBySkuOrThrow returns the JPA entity, not a DTO, to order</text>
<text x="1110.0" y="607.5" font-size="11.5" fill="#555555" text-anchor="middle">cures: ch.16 (content-based routing &amp; ACL)</text>
<rect x="1240" y="500" width="220" height="170" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="1350.0" y="575.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">#6 Review tangled in shared security — CURED</text>
<text x="1350.0" y="592.5" font-size="11.5" fill="#555555" text-anchor="middle">security/SecurityConfig&#x27;s one SecurityFilterChain once governed Review despite no runtime dependency</text>
<text x="1350.0" y="607.5" font-size="11.5" fill="#555555" text-anchor="middle">ch.15 — already cut (r02 walking skeleton)</text>
