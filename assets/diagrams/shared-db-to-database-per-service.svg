<text x="800.0" y="32" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.18 -- Shared database to database-per-service: one FK join, before and after</text>
<text x="800.0" y="56" font-size="11.5" fill="#555555" text-anchor="middle">order_items -&gt; inventory_items: a live @ManyToOne today, a point-in-time snapshot plus a CDC event feed after ch.19</text>
<text x="40" y="740" font-size="11" fill="#555555" text-anchor="start">SMELL[ch.18]: order_items.inventory_item_id is one of nine FKs crossing a bounded-context line in this one schema.</text>
<text x="860" y="740" font-size="11" fill="#2f5f3d" text-anchor="start" font-weight="700">Written once at order-placement, frozen forever -- a later SKU rename can no longer relabel a historical order.</text>
<text x="860" y="756" font-size="10.5" fill="#555555" text-anchor="start">A live stock check at checkout still crosses the seam synchronously (gRPC) -- this snapshot is for history, not for &quot;in stock right now.&quot;</text>
