<text x="800.0" y="32" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.19 — The CDC backfill pipeline: WAL to Debezium to Kafka to InventoryCdcConsumer, then the slot&#x27;s retirement</text>
<text x="40" y="288" font-size="10.5" fill="#555555" text-anchor="start">wal_level=logical + pgoutput;</text>
<text x="40" y="301" font-size="10.5" fill="#555555" text-anchor="start">REPLICA IDENTITY FULL = full row.</text>
<text x="290" y="288" font-size="10.5" fill="#555555" text-anchor="start">One slot, one publication,</text>
<text x="290" y="301" font-size="10.5" fill="#555555" text-anchor="start">scoped to inventory_items only.</text>
<text x="540" y="288" font-size="10.5" fill="#555555" text-anchor="start">snapshot.mode=initial:</text>
<text x="540" y="301" font-size="10.5" fill="#555555" text-anchor="start">op=r once, then streaming.</text>
<text x="790" y="288" font-size="10.5" fill="#555555" text-anchor="start">schemas.enable=false -&gt;</text>
<text x="790" y="301" font-size="10.5" fill="#555555" text-anchor="start">flat JSON envelope.</text>
<text x="1040" y="288" font-size="10.5" fill="#555555" text-anchor="start">Hand-parsed JSON;</text>
<text x="1040" y="301" font-size="10.5" fill="#555555" text-anchor="start">ON CONFLICT upsert by id.</text>
<text x="1290" y="288" font-size="10.5" fill="#555555" text-anchor="start">Backfilled once by snapshot,</text>
<text x="1290" y="301" font-size="10.5" fill="#555555" text-anchor="start">kept current until retired.</text>
<text x="40" y="338" font-size="11" fill="#1d1d1d" text-anchor="start" font-weight="700">CDC never sat in the checkout path — it only ever moved data sideways to seed, then keep current, a database the inventory service owns outright.</text>
<text x="100" y="625" font-size="10.5" fill="#555555" text-anchor="start">An un-drained slot would otherwise retain</text>
<text x="100" y="638" font-size="10.5" fill="#555555" text-anchor="start">WAL on the monolith&#x27;s Postgres indefinitely —</text>
<text x="100" y="651" font-size="10.5" fill="#555555" text-anchor="start">a disk-fill risk with no offsetting benefit.</text>
<text x="1120" y="625" font-size="10.5" fill="#555555" text-anchor="start">Once Reserve/Release makes the inventory</text>
<text x="1120" y="638" font-size="10.5" fill="#555555" text-anchor="start">service the sole writer of its own data,</text>
<text x="1120" y="651" font-size="10.5" fill="#555555" text-anchor="start">the connector has nothing left to replicate.</text>
<text x="40" y="740" font-size="10" fill="#777777" text-anchor="start">Sourced from _docs/19-cdc-and-extraction-3-inventory.md; infra/debezium/ (inventory-connector.json, README.md); examples/04-inventory-service/.../InventoryCdcConsumer.java; scripts/retire-debezium.sh.</text>
