<text x="700.0" y="32" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.14 -- the strangler fig&#x27;s four moves, in the order that matters</text>
<text x="700.0" y="56" font-size="12" fill="#555555" text-anchor="middle">retiring out of order is how an &quot;incremental&quot; migration quietly becomes a big-bang rewrite</text>
