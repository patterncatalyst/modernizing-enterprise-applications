<text x="780.0" y="32" font-size="16" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.16 — the ACL pipeline: SKU in, StockDto out, regardless of which backend answered</text>
<text x="50" y="550" font-size="11" fill="#555555" text-anchor="start">Returning the ORIGINAL exchange (not the resource exchange) from aggregate() is what keeps this a merge: headers and properties the caller already set survive; only the body changes.</text>
<text x="50" y="584" font-size="11" fill="#555555" text-anchor="start">InventoryAclRoute is a sketch in this chapter — not wired into examples/01-strangler-proxy/ yet; the ch.19 backend box above is drawn ghost for that reason.</text>
