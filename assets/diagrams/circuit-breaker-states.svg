<text x="610.0" y="600.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">HALF-OPEN</text>
<text x="610.0" y="617.5" font-size="11.5" fill="#555555" text-anchor="middle">a trial call checks</text>
<text x="610.0" y="632.5" font-size="11.5" fill="#555555" text-anchor="middle">whether the dependency has recovered</text>
