<text x="650.0" y="137.5" font-size="11.5" fill="#555555" text-anchor="middle">no @CircuitBreaker in this codebase today</text>
<rect x="60" y="300" width="280" height="140" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="200.0" y="360.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">CLOSED</text>
<text x="200.0" y="377.5" font-size="11.5" fill="#555555" text-anchor="middle">calls flow through normally</text>
<text x="200.0" y="392.5" font-size="11.5" fill="#555555" text-anchor="middle">no short-circuit, full network round-trip</text>
<rect x="900" y="300" width="280" height="140" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="1040.0" y="360.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">OPEN</text>
<text x="1040.0" y="377.5" font-size="11.5" fill="#dddddd" text-anchor="middle">calls fail immediately</text>
<text x="1040.0" y="392.5" font-size="11.5" fill="#dddddd" text-anchor="middle">no network round-trip even attempted</text>
