<text x="40" y="712" font-size="10" fill="#777777" text-anchor="start">Sourced from _docs/03-modernization-as-engineering.md&#x27;s measured metrics table and examples/02-review-service/MIGRATION.md. Bar length is proportional to the value within its own band only — seconds and megabytes are not on a shared scale across the two bands.</text>
