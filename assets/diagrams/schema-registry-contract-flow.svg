<text x="700.0" y="32" font-size="16" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.28 — the registry as contract: auto-register, fetch by schema id, enforce BACKWARD compatibility</text>
<text x="60" y="395" font-size="11" fill="#555555" text-anchor="start">The registry is both the write path&#x27;s destination and the read path&#x27;s lookup — consumer and producer agree only because they ask the same registry.</text>
<text x="60" y="780" font-size="11" fill="#555555" text-anchor="start">v2&#x27;s new field carries a default, so an old reader skips it and still parses the record — backward compatible.</text>
<text x="60" y="796" font-size="11" fill="#555555" text-anchor="start">v3 changes a field&#x27;s type, which an old reader cannot parse at all — the registry rejects the write before it reaches the topic.</text>
<text x="40" y="826" font-size="10" fill="#777777" text-anchor="start">Sourced from examples/09-schema-registry-demo/src/main/java/dev/patterncatalyst/contracts/{OrderAvroProducer,OrderAvroConsumer}.java, application.properties, and src/test/.../SchemaCompatibilityTest.java.</text>
