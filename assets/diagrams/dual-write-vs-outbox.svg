<text x="886.0" y="659.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">at-least-once -&gt; idempotent consume</text>
<text x="886.0" y="659.0" font-size="11" fill="#555" text-anchor="middle">at-least-once -&gt; idempotent consume</text>
<text x="700.0" y="32" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.20 — the dual-write hazard vs. the transactional outbox</text>
<text x="40" y="272" font-size="11" fill="#555555" text-anchor="start">A crash, a client timeout, or a pod reschedule in the gap between the two writes leaves one system updated and the other not — nothing is watching for the mismatch.</text>
<text x="40" y="288" font-size="11" fill="#555555" text-anchor="start">Reversing the order (publish, then save) relocates the same gap; it does not close it. No sequencing of two independent writes to two independent systems closes this gap.</text>
<text x="40" y="755" font-size="11" fill="#555555" text-anchor="start">The second hop (table to broker) is still separate — but now explicit, bounded, and owned by one piece of infrastructure, not hidden inside application code.</text>
<text x="40" y="771" font-size="11" fill="#555555" text-anchor="start">At-least-once delivery out of the relay is only safe because the consumer on the far side is idempotent (check-then-insert, deduped by aggregate id).</text>
<text x="40" y="800" font-size="10" fill="#777777" text-anchor="start">Sourced from _docs/20-outbox-pattern-done-right.md; examples/00-monolith/.../order/OrderService.java, .../common/outbox/{OutboxEvent,OutboxRelay}.java; examples/03-notification-service/.../NotificationService.java.</text>
