<text x="806.0" y="646.5" font-size="11" fill="#2f5f3d" text-anchor="middle">StockDtoTranslatingStrategy.aggregate() -&gt; StockDto</text>
<text x="800.0" y="32" font-size="16" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.16 — one seam, two orthogonal questions: which backend answers, and what is safe to carry back</text>
<text x="800.0" y="390.0" font-size="11.5" fill="#555555" text-anchor="middle">ROUTING AXIS — .choice() on strangler.inventory.enabled decides WHICH backend answers</text>
<text x="60" y="575.0" font-size="11.5" fill="#555555" text-anchor="start">ACL AXIS — enrich() + AggregationStrategy decide WHAT shape is safe to carry back, independent of which side answered</text>
<text x="60" y="880" font-size="10.5" fill="#555555" text-anchor="start">Full property write on both branches: enrich() calls setProperty(stockLookupTarget, monolithBaseUrl+... | inventoryServiceBaseUrl+...).</text>
<text x="60" y="916" font-size="11" fill="#555555" text-anchor="start">A perfectly-routed request down either branch above still corrupts the caller if the vertical axis is missing — that is exactly Smell 5.</text>
<text x="60" y="950" font-size="10" fill="#777777" text-anchor="start">Sourced from _docs/16-content-based-routing-acl.md (&quot;Where content-based routing stops helping&quot;; &quot;The ACL route, sketched&quot;) and examples/01-strangler-proxy/.../StranglerProxyRoute.java (the strangler.review.enabled choice() this router mirrors).</text>
