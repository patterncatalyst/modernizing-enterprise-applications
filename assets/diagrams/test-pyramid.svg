<rect x="320" y="120" width="560" height="150" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="600.0" y="178.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Tier 3 — Integration</text>
<text x="600.0" y="195.0" font-size="11.5" fill="#555555" text-anchor="middle">3 classes — 2 repository ITs + SixContextsSmokeTest</text>
<text x="600.0" y="210.0" font-size="11.5" fill="#555555" text-anchor="middle">real Postgres via Testcontainers, real Hibernate + Flyway</text>
<text x="600.0" y="225.0" font-size="11.5" fill="#555555" text-anchor="middle">proves: works against a real Postgres — slow, few by design</text>
<rect x="220" y="310" width="760" height="150" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="600.0" y="368.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Tier 2 — Slice (@WebMvcTest)</text>
<text x="600.0" y="385.0" font-size="11.5" fill="#555555" text-anchor="middle">5 classes — one @WebMvcTest slice per REST controller</text>
<text x="600.0" y="400.0" font-size="11.5" fill="#555555" text-anchor="middle">service layer mocked, only the web MVC stack boots</text>
<text x="600.0" y="415.0" font-size="11.5" fill="#555555" text-anchor="middle">proves: does this controller bind, validate, and serialize correctly</text>
<rect x="110" y="500" width="980" height="150" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="600.0" y="558.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Tier 1 — Unit (Mockito)</text>
<text x="600.0" y="575.0" font-size="11.5" fill="#555555" text-anchor="middle">3 classes — InventoryServiceTest, OrderServiceTest, PaymentServiceTest</text>
<text x="600.0" y="590.0" font-size="11.5" fill="#555555" text-anchor="middle">no Spring context, no database, no network — every collaborator mocked</text>
<text x="600.0" y="605.0" font-size="11.5" fill="#555555" text-anchor="middle">proves: does this one class&#x27;s logic do the right thing</text>
