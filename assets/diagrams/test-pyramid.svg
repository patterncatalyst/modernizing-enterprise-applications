<text x="606.0" y="474.0" font-size="11" fill="#2f5f3d" text-anchor="middle">one `mvn verify` run exercises all three tiers</text>
<text x="600.0" y="32" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.10 — the monolith&#x27;s test pyramid: three tiers, one `mvn verify`</text>
<text x="600.0" y="56" font-size="12" fill="#555555" text-anchor="middle">11 test classes, 34 @Test methods + 1 parameterized test (4 executions) = 38 executions, every one green</text>
