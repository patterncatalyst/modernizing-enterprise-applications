<text x="190.0" y="190.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">PIECE 1 — the write</text>
<text x="190.0" y="207.5" font-size="11.5" fill="#555555" text-anchor="middle">order row + outbox row,</text>
<text x="190.0" y="222.5" font-size="11.5" fill="#555555" text-anchor="middle">SAME @Transactional</text>
<rect x="380" y="140" width="280" height="120" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="520.0" y="190.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">PIECE 2 — the relay</text>
<text x="520.0" y="207.5" font-size="11.5" fill="#555555" text-anchor="middle">@Scheduled poll, 2000ms,</text>
<text x="520.0" y="222.5" font-size="11.5" fill="#555555" text-anchor="middle">oldest-unpublished-first</text>
<rect x="700" y="140" width="220" height="120" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="810.0" y="190.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">PIECE 3 — the broker</text>
<text x="810.0" y="207.5" font-size="11.5" fill="#dddddd" text-anchor="middle">Kafka topic order.placed,</text>
<text x="810.0" y="222.5" font-size="11.5" fill="#dddddd" text-anchor="middle">keyed by aggregate id</text>
<rect x="960" y="140" width="320" height="120" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="1120.0" y="190.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">PIECE 4 — the consumer</text>
<text x="1120.0" y="207.5" font-size="11.5" fill="#555555" text-anchor="middle">idempotent — check-then-insert,</text>
<text x="1120.0" y="222.5" font-size="11.5" fill="#555555" text-anchor="middle">deduped by order id</text>
<path d="M340.0,200.0 L380.0,200.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="366.0" y="130.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">poll WHERE published_at IS NULL (separate process, after commit)</text>
