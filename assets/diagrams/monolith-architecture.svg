<text x="730.0" y="30" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.08 -- The reference monolith (before): six bounded contexts, one deployable, one shared schema</text>
<text x="730.0" y="56" font-size="12" fill="#555555" text-anchor="middle">one REST API surface, documented by springdoc OpenAPI</text>
<text x="1420" y="420" font-size="10.5" fill="#555555" text-anchor="end">SMELL[ch.22]/[ch.23]/[ch.24]: OrderService#placeOrder wraps inventory + order + payment + shipment + notification in ONE @Transactional spanning five contexts (ACID -&gt; ACD).</text>
<text x="40" y="598" font-size="10.5" fill="#555555" text-anchor="start">SMELL[ch.18]: FK joins cross bounded-context boundaries freely inside the one shared schema -- order_items-&gt;inventory_items, payments/shipments/notifications-&gt;orders, reviews-&gt;customers+inventory_items, orders-&gt;customers.</text>
<text x="40" y="614" font-size="10.5" fill="#555555" text-anchor="start">common.Customer is a shared-kernel entity (not its own bounded context) FK&#x27;d directly from order, notification, and review.</text>
<text x="1260.0" y="95" font-size="11.5" fill="#2f5f3d" text-anchor="middle" font-weight="700">review: first context extracted (ch.15)</text>
<text x="1260.0" y="323" font-size="9.5" fill="#555555" text-anchor="middle">SMELL[ch.15]: REST-only, no runtime collaborator -- yet governed by the</text>
<text x="1260.0" y="335" font-size="9.5" fill="#555555" text-anchor="middle">monolith&#x27;s one global SecurityFilterChain alongside every other context.</text>
<text x="40" y="684" font-size="10.5" fill="#555555" text-anchor="start">SMELL[ch.17]: the order-confirmation notification is sent synchronously, in-process, inside the checkout transaction.</text>
