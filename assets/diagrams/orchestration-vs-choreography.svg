<text x="216.0" y="223.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">emits outcome</text>
<text x="216.0" y="223.0" font-size="11" fill="#555" text-anchor="middle">emits outcome</text>
