<text x="388.79999999999995" y="259.0" font-size="11" fill="#555" text-anchor="middle">@KafkaListener — reacts</text>
<path d="M1160.0,172.1875 L1240.0,154.6875" fill="none" stroke="#2f5f3d" stroke-width="2" marker-end="url(#am)"/>
<text x="1206.0" y="157.4375" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">invokes in order</text>
<text x="1206.0" y="157.4375" font-size="11" fill="#2f5f3d" text-anchor="middle">invokes in order</text>
<path d="M1330.0,160.0 L1330.0,170.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M1330.0,220.0 L1330.0,230.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M1330.0,280.0 L1330.0,290.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M1010.0,260.0 L1010.0,370.0" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="1016.0" y="309.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">emits outcome event only</text>
<text x="1016.0" y="309.0" font-size="11" fill="#555" text-anchor="middle">emits outcome event only</text>
<path d="M780,200 L820,200" fill="none" stroke="#2f5f3d" stroke-width="2" marker-end="url(#am)"/>
<text x="806.0" y="194.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">ch.24</text>
<text x="806.0" y="194.0" font-size="11" fill="#2f5f3d" text-anchor="middle">ch.24</text>
<text x="800.0" y="32" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">orchestration vs. choreography, made concrete on this one codebase</text>
<text x="400" y="650" font-size="11.5" fill="#555555" text-anchor="middle">each service decides, on its own, what its reaction means for the order —</text>
<text x="400" y="666" font-size="11.5" fill="#555555" text-anchor="middle">no single artifact reads top-to-bottom as &quot;the saga&quot;</text>
<text x="1200" y="650" font-size="11.5" fill="#2f5f3d" text-anchor="middle" font-weight="700">ONE visible place owns the sequence top-to-bottom —</text>
<text x="1200" y="666" font-size="11.5" fill="#2f5f3d" text-anchor="middle" font-weight="700">reading the route tells you the whole story</text>
<text x="40" y="800" font-size="10.5" fill="#555555" text-anchor="start">Sourced from examples/05-payment-service/.../{OrderPlacedConsumer,PaymentService}.java, examples/00-monolith/.../order/OrderSagaListener.java (ch.23), and examples/06-shipping-service/.../{ShipmentSagaRoute,ShipmentSagaSteps}.java (ch.24).</text>
</svg>