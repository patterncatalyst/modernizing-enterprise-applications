<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5f3d"/></marker></defs>
<rect x="20" y="60" width="760" height="700" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#1d1d1d">CHOREOGRAPHY — ch.23 payment (no central coordinator)</text>
<rect x="820" y="60" width="760" height="700" rx="12" fill="#eaf4ec" stroke="#ddd"/>
<text x="832" y="80" font-size="12" font-weight="700" fill="#1d1d1d">ORCHESTRATION — ch.24 shipping (one Camel Saga coordinator)</text>
<rect x="60" y="110" width="300" height="70" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="210.0" y="143.0" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Kafka</text>
<text x="210.0" y="160.0" font-size="11.5" fill="#dddddd" text-anchor="middle">order.placed / payment.captured / payment.declined</text>
<rect x="60" y="230" width="300" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="210.0" y="265.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Payment service</text>
<text x="210.0" y="282.5" font-size="11.5" fill="#555555" text-anchor="middle">OrderPlacedConsumer reacts,</text>
<text x="210.0" y="297.5" font-size="11.5" fill="#555555" text-anchor="middle">emits payment.captured/declined</text>
<rect x="420" y="350" width="300" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="570.0" y="385.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Monolith: OrderSagaListener</text>
<text x="570.0" y="402.5" font-size="11.5" fill="#555555" text-anchor="middle">reacts independently,</text>
<text x="570.0" y="417.5" font-size="11.5" fill="#555555" text-anchor="middle">confirms or compensates</text>
<rect x="230" y="500" width="300" height="90" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="380.0" y="535.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">NO COORDINATOR</text>
<text x="380.0" y="552.5" font-size="11.5" fill="#555555" text-anchor="middle">control is EMERGENT — no process</text>
<text x="380.0" y="567.5" font-size="11.5" fill="#555555" text-anchor="middle">owns the sequence top-to-bottom</text>
<rect x="860" y="150" width="300" height="110" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="1010.0" y="195.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Camel Saga EIP coordinator</text>
<text x="1010.0" y="212.5" font-size="11.5" fill="#dddddd" text-anchor="middle">InMemorySagaService</text>
<text x="1010.0" y="227.5" font-size="11.5" fill="#dddddd" text-anchor="middle">.saga() — sequences steps + owns compensation</text>
<rect x="1240" y="110" width="180" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1330.0" y="140.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">① enrich</text>
<rect x="1240" y="170" width="180" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1330.0" y="200.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">② dispatch</text>
<rect x="1240" y="230" width="180" height="50" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="1330.0" y="260.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">③ book-carrier</text>
<rect x="1240" y="290" width="180" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1330.0" y="320.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">④ emit</text>
<rect x="860" y="370" width="300" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1010.0" y="405.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Monolith</text>
<text x="1010.0" y="422.5" font-size="11.5" fill="#555555" text-anchor="middle">reacts only to the OUTCOME</text>
<text x="1010.0" y="437.5" font-size="11.5" fill="#555555" text-anchor="middle">(dispatched/failed) — never picks the next step</text>
<path d="M210.0,180.0 L210.0,230.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="216.0" y="199.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">@Incoming — reacts</text>
<text x="216.0" y="199.0" font-size="11" fill="#555" text-anchor="middle">@Incoming — reacts</text>
