<rect x="20" y="60" width="740" height="560" rx="12" fill="#eaf4ec" stroke="#ddd"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#1d1d1d">CQRS-lite — this book&#x27;s approach, implemented</text>
<rect x="800" y="60" width="740" height="560" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="812" y="80" font-size="12" font-weight="700" fill="#1d1d1d">Full event sourcing — illustrative only, not implemented here</text>
<rect x="140" y="120" width="500" height="110" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="390.0" y="165.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Order aggregate (the write model)</text>
<text x="390.0" y="182.5" font-size="11.5" fill="#555555" text-anchor="middle">OrderService.placeOrder() — mutable rows</text>
<text x="390.0" y="197.5" font-size="11.5" fill="#555555" text-anchor="middle">current state stored directly, Postgres</text>
<rect x="140" y="280" width="500" height="100" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="390.0" y="320.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">order.placed event</text>
<text x="390.0" y="337.5" font-size="11.5" fill="#dddddd" text-anchor="middle">published via outbox (ch.17/20)</text>
<text x="390.0" y="352.5" font-size="11.5" fill="#dddddd" text-anchor="middle">one fact, not the whole history</text>
<rect x="140" y="430" width="500" height="120" rx="9" fill="#eaf4ec" stroke="#3d7a4e" stroke-width="2"/>
<text x="390.0" y="480.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">notification-service read model</text>
<text x="390.0" y="497.5" font-size="11.5" fill="#555555" text-anchor="middle">Notification row = fold of one fact</text>
<text x="390.0" y="512.5" font-size="11.5" fill="#555555" text-anchor="middle">idempotent check-then-insert, own schema</text>
<rect x="880" y="120" width="500" height="110" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1130.0" y="165.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Event log (the write model, illustrative)</text>
<text x="1130.0" y="182.5" font-size="11.5" fill="#555555" text-anchor="middle">OrderPlaced, PaymentCaptured,</text>
<text x="1130.0" y="197.5" font-size="11.5" fill="#555555" text-anchor="middle">ShipmentDispatched, OrderConfirmed</text>
<rect x="880" y="280" width="500" height="100" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1130.0" y="320.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Replay / fold on load</text>
<text x="1130.0" y="337.5" font-size="11.5" fill="#555555" text-anchor="middle">OrderState = reduce(events, OrderState::apply)</text>
<text x="1130.0" y="352.5" font-size="11.5" fill="#555555" text-anchor="middle">ch.21&#x27;s own sketch — no such class exists</text>
<rect x="880" y="430" width="500" height="120" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1130.0" y="480.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Current state = computed, not stored</text>
<text x="1130.0" y="497.5" font-size="11.5" fill="#555555" text-anchor="middle">no mutable row — rebuilt from genesis</text>
<text x="1130.0" y="512.5" font-size="11.5" fill="#555555" text-anchor="middle">or last snapshot, on every read</text>
