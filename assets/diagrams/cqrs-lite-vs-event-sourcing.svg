<text x="396.0" y="399.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">idempotent consume</text>
<text x="396.0" y="399.0" font-size="11" fill="#555" text-anchor="middle">idempotent consume</text>
<path d="M1130.0,230.0 L1130.0,280.0" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="1136.0" y="249.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">replay (illustrative)</text>
<text x="1136.0" y="249.0" font-size="11" fill="#555" text-anchor="middle">replay (illustrative)</text>
<path d="M1130.0,380.0 L1130.0,430.0" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="1136.0" y="399.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">compute on read</text>
<text x="1136.0" y="399.0" font-size="11" fill="#555" text-anchor="middle">compute on read</text>
<text x="780.0" y="32" font-size="16" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.21 — CQRS-lite (what this book builds) vs. full event sourcing (illustrative contrast)</text>
<text x="140" y="570" font-size="11" fill="#555555" text-anchor="start">System of record: the orders table. Rebuildable from order.placed only as far as the topic&#x27;s retention reaches.</text>
<text x="140" y="586" font-size="11" fill="#555555" text-anchor="start">Past that window, the write side&#x27;s own durable storage — not the log — is what the system relies on.</text>
<text x="880" y="570" font-size="11" fill="#555555" text-anchor="start">System of record: the log itself — current state is derived, never stored directly. The log is the only copy of the fact.</text>
<text x="880" y="586" font-size="11" fill="#555555" text-anchor="start">Real costs this book declines to pay here: schema evolution forever (upcasting), a snapshot strategy, team/tooling unfamiliarity.</text>
<text x="20" y="650" font-size="10" fill="#777777" text-anchor="start">Sourced from _docs/21-event-sourcing-and-cqrs.md (&quot;Event sourcing: when the log stops being a side effect&quot;, &quot;Why this book builds CQRS-lite and not event sourcing&quot;).</text>
<text x="20" y="666" font-size="10" fill="#777777" text-anchor="start">Left: examples/03-notification-service/.../{Notification,NotificationService}.java (verified, ch.17). Right: illustrative only — no event store exists in this codebase, by design.</text>
</svg>