<text x="720.0" y="32" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.07 — the shared-table proof: why 49/49 green couldn&#x27;t tell path A from path B</text>
<text x="720.0" y="56" font-size="12" fill="#555555" text-anchor="middle">Review&#x27;s Phase A form still shares the monolith&#x27;s public schema — the one extraction that did not get its own schema yet</text>
<text x="60" y="630" font-size="11" fill="#555555" text-anchor="start">A misrouted request and a correctly routed one return identical bodies, because both read and write the same reviews rows.</text>
<text x="780" y="630" font-size="11" fill="#555555" text-anchor="start">With the monolith down, a 200 from review-service proves the proxy&#x27;s decision reached it —</text>
<text x="780" y="646" font-size="11" fill="#555555" text-anchor="start">not just that two backends happened to agree.</text>
