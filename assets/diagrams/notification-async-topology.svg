<text x="780.0" y="30" font-size="18" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.17 — Extracting Notification: the transactional-outbox + async event-driven pipeline</text>
<text x="650" y="215" font-size="12.5" fill="#1d1d1d" text-anchor="start" font-weight="700">Write side: checkout writes order + outbox atomically; a scheduled relay is the only thing that talks to Kafka</text>
<text x="630" y="478" font-size="12" fill="#1d1d1d" text-anchor="start" font-weight="700">Read + consume side: two independent consumers off the SAME topic — persistence (shared group) and WebSocket push (unique group)</text>
<text x="40" y="940" font-size="11" fill="#555555" text-anchor="start">CURED (r04/S8): SMELL #4&#x27;s synchronous, in-transaction NotificationService call is gone —</text>
<text x="40" y="956" font-size="11" fill="#555555" text-anchor="start">see transactional-outbox-sequence.svg for the old-vs-new contrast.</text>
<text x="40" y="992" font-size="11" fill="#555555" text-anchor="start">The proxy&#x27;s /api/notifications route (read side) + the monolith&#x27;s unconditional outbox write (write side)</text>
<text x="40" y="1008" font-size="11" fill="#555555" text-anchor="start">are the two halves of one cutover; notification.mode=synchronous|outbox has since been removed.</text>
</svg>