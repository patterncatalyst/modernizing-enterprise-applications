<text x="940.0" y="32" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.17 — The transactional-outbox guarantee: before (synchronous, SMELL #4) vs after (atomic outbox write + async relay)</text>
<text x="40" y="272" font-size="11" fill="#555555" text-anchor="start">Any failure anywhere in this chain — including the notification call — rolled back inventory, payment, and shipping together.</text>
<text x="40" y="400" font-size="11" fill="#555555" text-anchor="start">Notification delivery is now OUTSIDE the checkout transaction&#x27;s latency and failure domain: the outbox write can only</text>
<text x="40" y="416" font-size="11" fill="#555555" text-anchor="start">succeed or fail with the rest of the transaction — it never talks to Kafka itself.</text>
<text x="1010" y="822" font-size="10" fill="#555555" text-anchor="start">AT-LEAST-ONCE: a crash between the Kafka ack and the published_at</text>
<text x="1010" y="836" font-size="10" fill="#555555" text-anchor="start">stamp republishes the identical row on the next poll.</text>
<text x="1580" y="822" font-size="10" fill="#555555" text-anchor="start">IDEMPOTENT by design: check-then-insert by orderId makes a</text>
<text x="1580" y="836" font-size="10" fill="#555555" text-anchor="start">redelivered event a safe no-op (DRQ-034 / DRQ-037).</text>
<text x="40" y="955" font-size="11" fill="#555555" text-anchor="start">Same business steps, same transaction boundary for order + outbox — only the LAST write before commit changed (a call -&gt; a row).</text>
</svg>