<text x="700.0" y="32" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.19 -- Reserve/Release: the cross-seam saga-lite that replaces the in-process &quot;free rollback&quot;</text>
<text x="40" y="272" font-size="11" fill="#555555" text-anchor="start">One shared database, one transaction: a payment decline unwound the inventory decrement for free, with no application code written for it.</text>
<text x="40" y="390" font-size="11" fill="#1d1d1d" text-anchor="start" font-weight="700">Once inventory owns its own database, that automatic rollback cannot cross the service boundary -- compensation must be explicit.</text>
<text x="470" y="680" font-size="10.5" fill="#555555" text-anchor="start">DRQ-042 (honest limitation): Release is an UNCONDITIONAL increment with no dedupe key -- a retried Release after an</text>
<text x="470" y="694" font-size="10.5" fill="#555555" text-anchor="start">at-least-once redelivery could over-restore stock; a full fix (idempotency key / saga ledger) is deferred to ch.23.</text>
<text x="40" y="868" font-size="10.5" fill="#555555" text-anchor="start">Sourced from examples/00-monolith/.../order/OrderService.java, .../inventory/RemoteInventoryClient.java, SMELLS.md (smell #3),</text>
<text x="40" y="882" font-size="10.5" fill="#555555" text-anchor="start">examples/04-inventory-service/.../InventoryGrpcServiceImpl.java, and _plans/iterations/inventory-plan.md (DRQ-041/DRQ-042).</text>
