<text x="700.0" y="30" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.19 -- Extracting Inventory: the synchronous gRPC seam (Reserve/Release) + a retired CDC backfill</text>
<text x="300" y="414" font-size="11" fill="#555555" text-anchor="start">The checkout SEAM: gRPC Reserve atomically decrements stock in the inventory service&#x27;s OWN schema; a post-reserve failure</text>
<text x="300" y="428" font-size="11" fill="#555555" text-anchor="start">(insufficient stock on a later line, a payment decline, a shipping failure) triggers the compensating gRPC Release.</text>
<text x="40" y="444" font-size="11" fill="#555555" text-anchor="start">ACL honesty: inventory.proto&#x27;s wire vocabulary (stock_keeping_unit/on_hand_qty/reservation_ok) is deliberately distinct from the</text>
<text x="40" y="458" font-size="11" fill="#555555" text-anchor="start">monolith&#x27;s internal StockDto (sku/priceCents/quantityOnHand) -- RemoteInventoryClient and InventoryGrpcServiceImpl are the ACL&#x27;s two sides.</text>
<text x="50" y="660" font-size="11" fill="#1d1d1d" text-anchor="start" font-weight="700">CDC never sat in the checkout path -- it only ever moved data sideways to seed/sync the inventory service&#x27;s own copy while the monolith was still the writer.</text>
<text x="40" y="712" font-size="10.5" fill="#555555" text-anchor="start">Sourced from examples/04-inventory-service (InventoryGrpcServiceImpl, InventoryCdcConsumer, inventory.proto), examples/00-monolith</text>
<text x="40" y="726" font-size="10.5" fill="#555555" text-anchor="start">(RemoteInventoryClient, OrderService, SMELLS.md #5), examples/01-strangler-proxy (/api/inventory route), infra/debezium/README.md,</text>
<text x="40" y="740" font-size="10.5" fill="#555555" text-anchor="start">and _plans/iterations/inventory-plan.md.</text>
