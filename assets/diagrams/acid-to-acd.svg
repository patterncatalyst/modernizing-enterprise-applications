<text x="700.0" y="32" font-size="16" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.22 — ACID -&gt; ACD: the isolation given up, and what replaces the free rollback</text>
<text x="40" y="272" font-size="11" fill="#555555" text-anchor="start">Atomic + Consistent + Isolated + Durable — all four, free, because there is one process and one database. Any failure anywhere rolls back everything.</text>
<text x="40" y="575" font-size="11" fill="#555555" text-anchor="start">Kept: full LOCAL ACID inside each service&#x27;s own database. Given up: atomicity and isolation ACROSS services — four commits on four DBs, each independent of the other three.</text>
<text x="40" y="591" font-size="11" fill="#555555" text-anchor="start">Atomic (locally) + Consistent (eventually) + Durable survive as ACD. No cross-service isolation is what the chapter&#x27;s title names as gone — not a value judgement, a tradeoff.</text>
<text x="620" y="735" font-size="10.5" fill="#555555" text-anchor="start">Nothing makes this compensating call happen automatically the way Postgres made the monolith&#x27;s rollback automatic — a saga author writes it, names it, and tests it.</text>
<text x="40" y="800" font-size="10" fill="#777777" text-anchor="start">Sourced from _docs/22-acid-to-acd.md; examples/00-monolith/SMELLS.md (SMELL #3); order/OrderService.java#placeOrder&#x27;s @Transactional javadoc. Two-phase commit is rejected (coordinator SPOF, blocking locks, recentralized ownership) — see the chapter&#x27;s own treatment.</text>
