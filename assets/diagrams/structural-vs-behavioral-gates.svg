<text x="700.0" y="32" font-size="17" fill="#1d1d1d" text-anchor="middle" font-weight="700">ch.06 — structural gate vs behavioral gate: two layers, two different classes of mistake</text>
<text x="700.0" y="56" font-size="12" fill="#555555" text-anchor="middle">neither substitutes for the other — knowing which layer is responsible for which kind of defect is most of what it takes to trust a loop this fast</text>
