# compose.yaml — r02 walking-skeleton local infra/observability stack
#
# Owned exclusively by iteration r02, step S3 (_plans/iterations/r02-plan.md).
# PODMAN ONLY (DRQ-001) — run with the podman-compose-v2 plugin:
#
#   podman compose --env-file .env up -d
#   podman compose ps
#   podman compose down            # keep volumes
#   podman compose down -v         # wipe volumes (fresh Kafka/Postgres state)
#
# Never substitute `docker compose` / `docker-compose` for this file or pull
# in lgtm-docker-stack / DataMesh's Docker compose (R5 in build-plan.md §M).
#
# Services:
#   - lgtm      : Grafana + Tempo + Mimir + Loki + an embedded OTel Collector
#                 (config replaced by infra/otelcol/config.yaml)
#   - postgres  : the monolith's database (examples/00-monolith owns the
#                 schema/migrations; this stack only provisions the server)
#   - kafka     : single-broker KRaft-mode Kafka (no ZooKeeper) for the
#                 event-driven extractions from r04 onward
#
# Apicurio is deliberately NOT included here (deferred per r02-plan S3 —
# Review, the r02 extraction, is REST-only and has no schema-registry need).
#
# Image tags are pinned once in .env (gitignored) / .env.example (tracked) —
# see known-issues.md #5 (image tag drift) and decisions.md's version matrix.

services:
  # ─── Observability backend (Grafana + Tempo + Mimir + Loki + Collector) ──
  lgtm:
    image: docker.io/grafana/otel-lgtm:${LGTM_IMAGE_TAG}
    container_name: mea-lgtm
    ports:
      - "3000:3000"   # Grafana UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP (preferred — see otlp-endpoints reference)
      - "9090:9090"   # Mimir / Prometheus remote-write + query
      - "3100:3100"   # Loki
      - "3200:3200"   # Tempo
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./infra/otelcol/config.yaml:/otel-lgtm/otelcol-config.yaml:Z
      - ./infra/grafana/datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/datasources.yaml:Z
    mem_limit: 1g
    # NOTE: the otel-lgtm:0.8.1 image does not ship wget (confirmed during S3
    # bring-up — the skill template's wget-based healthcheck always exits 127
    # in this image). curl IS present; use it instead.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # ─── Postgres — the monolith's database ─────────────────────────────────
  postgres:
    image: docker.io/library/postgres:${POSTGRES_IMAGE_TAG}
    container_name: mea-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    volumes:
      - postgres-data:/var/lib/postgresql/data:Z
      - ./infra/db/init:/docker-entrypoint-initdb.d:Z
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # ─── Kafka (KRaft mode, single broker) ──────────────────────────────────
  kafka:
    image: docker.io/apache/kafka:${KAFKA_IMAGE_TAG}
    container_name: mea-kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"   # PLAINTEXT for clients on the host
      - "9094:9094"                        # PLAINTEXT for clients inside the compose network
    environment:
      # KRaft mode — broker + controller roles combined, single node.
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,DOCKER://0.0.0.0:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,DOCKER://kafka:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_MIN_INSYNC_REPLICAS=1
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - CLUSTER_ID=${KAFKA_CLUSTER_ID}
    volumes:
      - kafka-data:/var/lib/kafka/data:Z
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:

networks:
  default:
    name: mea-observability
