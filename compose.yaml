# compose.yaml — r02 walking-skeleton local infra/observability stack
#
# Owned exclusively by iteration r02, step S3 (_plans/iterations/r02-plan.md).
# DOCKER ENGINE + the `docker compose` v2 plugin (DRQ-077, superseding the
# original podman-only DRQ-001). Docker Engine (docker-ce, context `default`)
# on a Fedora or RHEL host; Docker Desktop is never required:
#
#   docker compose --env-file .env up -d
#   docker compose ps
#   docker compose down            # keep volumes
#   docker compose down -v         # wipe volumes (fresh Kafka/Postgres state)
#
# Never the legacy hyphenated `docker-compose` v1 binary.
#
# Services:
#   - lgtm      : Grafana + Tempo + Mimir + Loki + an embedded OTel Collector
#                 (config replaced by infra/otelcol/config.yaml)
#   - postgres  : ONE shared Postgres SERVER, originally provisioned as "the
#                 monolith's database" (examples/00-monolith owned the public
#                 schema/migrations). Each extracted service now owns its own
#                 schema within this same database/server (e.g. the order
#                 service's `order_service` schema via
#                 `currentSchema=order_service` on its JDBC URL). On a fresh
#                 volume the init scripts also apply the frozen monolith's
#                 Flyway SQL to `public` (review-service, the Debezium
#                 connector and the demos still use those tables; DRQ-077). Reconfigured for LOGICAL replication (r05/ch.19,
#                 step S3) so Debezium can tail the WAL — see `command:`
#                 below.
#   - kafka     : single-broker KRaft-mode Kafka (no ZooKeeper) for the
#                 event-driven extractions from r04 onward
#   - connect   : Kafka Connect running the Debezium Postgres connector
#                 (r05/ch.19 step S3, DRQ-040) — CDC source for the inventory
#                 extraction's initial-snapshot backfill + streaming sync.
#                 REST API on host port ${CONNECT_HOST_PORT:-8086}, NOT 8083
#                 (examples/03-notification-service binds :8083 locally —
#                 see infra/debezium/README.md).
#
# order-plan.md S10 (DRQ-070, the final decommission): the monolith
# (examples/00-monolith) was NEVER one of this file's services — all seven
# application processes (the six extracted services + the strangler-proxy
# edge router) and the monolith itself always ran as plain Java/Quarkus
# processes outside this compose stack (see tooling/newman/README.md and any
# service's CUTOVER.md for the full local-run instructions), with this file
# providing only the shared infra (Postgres/Kafka/Connect/observability).
# There is therefore nothing to "remove" from this file for the monolith's
# decommission — it was never here. What changed: the monolith is no longer
# one of the processes you bring up locally AT ALL (it is frozen-in-repo,
# DRQ-024/DRQ-070); the six extracted services + the edge router
# (examples/01-strangler-proxy) are the entire running topology now. The
# complete, runnable monolith ("before", all six contexts live) is preserved
# as break-glass on the `reference/monolith-before` branch (tag
# `v0-monolith`) — see the project README.md.
#
# Apicurio: ch.28 (DRQ-038 follow-up, DRQ-076) adds the `apicurio` service
# below. It is used ONLY by examples/09-schema-registry-demo, the isolated
# Avro + Apicurio Schema Registry DEMONSTRATOR module — no other service in
# this stack (examples/01 through examples/08) talks to it, and the real
# order.placed JSON event flows (DRQ-038) are unchanged.
#
# Image tags are pinned once in .env (gitignored) / .env.example (tracked) —
# see known-issues.md #5 (image tag drift) and decisions.md's version matrix.

services:
  # ─── Observability backend (Grafana + Tempo + Mimir + Loki + Collector) ──
  lgtm:
    image: docker.io/grafana/otel-lgtm:${LGTM_IMAGE_TAG}
    container_name: mea-lgtm
    ports:
      - "3000:3000"   # Grafana UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP (preferred — see otlp-endpoints reference)
      # Prometheus query + OTLP metrics ingest. Host port 19090, not 9090:
      # Cockpit owns 9090 on Fedora Server and RHEL (DRQ-077). Inside the
      # container (and to anything on the compose network) it is still :9090.
      - "${PROMETHEUS_HOST_PORT:-19090}:9090"
      - "3100:3100"   # Loki
      - "3200:3200"   # Tempo
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./infra/otelcol/config.yaml:/otel-lgtm/otelcol-config.yaml:Z
      # Mounted over the image's own default provisioning filename so ours
      # wins the uid collision (see infra/grafana/datasources.yaml's header).
      - ./infra/grafana/datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/grafana-datasources.yaml:Z
    # 0.36.0 runs Pyroscope and OBI alongside L/G/T/M; 1g was 0.8.1's budget.
    mem_limit: 2g
    # NOTE: the otel-lgtm image does not ship wget (confirmed during S3
    # bring-up — the skill template's wget-based healthcheck always exits 127
    # in this image). curl IS present; use it instead.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # ─── Postgres — the monolith's database ─────────────────────────────────
  postgres:
    image: docker.io/library/postgres:${POSTGRES_IMAGE_TAG}
    container_name: mea-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    # LOGICAL replication (r05/ch.19 step S3, DRQ-040) — required for the
    # Debezium Postgres connector to tail the WAL via pgoutput. Requires a
    # restart of this container to take effect (handled by `docker compose
    # up -d`); the postgres-data volume persists across it, so no data is
    # lost. max_replication_slots/max_wal_senders=4 leaves headroom beyond
    # the single `mea_inventory_slot` this stack currently uses.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    # Postgres 18 images keep PGDATA in a major-version subdirectory
    # (/var/lib/postgresql/18/docker), so the volume mounts at
    # /var/lib/postgresql, not .../data (DRQ-077). A volume left over from
    # the 16-alpine pin is not upgraded in place: `docker compose down -v`.
    volumes:
      - postgres-data:/var/lib/postgresql:Z
      - ./infra/db/init:/docker-entrypoint-initdb.d:Z
      # The frozen monolith's Flyway SQL, applied to `public` by
      # infra/db/init/10-monolith-public-schema.sh on a fresh volume:
      # review-service, the Debezium connector and the demos still use the
      # tables it creates (DRQ-077). Read-only; `z` (shared label) because
      # the directory stays part of the source tree.
      - ./examples/00-monolith/src/main/resources/db/migration:/monolith-migrations:ro,z
    mem_limit: 1g
    healthcheck:
      # -h 127.0.0.1: TCP, not the Unix socket. The image's initdb phase runs
      # a temporary server on the socket only and then restarts, so a socket
      # probe can report ready before the real server listens.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # ─── Kafka (KRaft mode, single broker) ──────────────────────────────────
  kafka:
    image: docker.io/apache/kafka:${KAFKA_IMAGE_TAG}
    container_name: mea-kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"   # PLAINTEXT for clients on the host
      - "9094:9094"                        # PLAINTEXT for clients inside the compose network
    environment:
      # KRaft mode — broker + controller roles combined, single node.
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,DOCKER://0.0.0.0:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,DOCKER://kafka:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_MIN_INSYNC_REPLICAS=1
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - CLUSTER_ID=${KAFKA_CLUSTER_ID}
    volumes:
      - kafka-data:/var/lib/kafka/data:Z
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ─── Kafka Connect (Debezium Postgres connector) — CDC, r05/ch.19 S3 ────
  # Standalone Kafka Connect distributed-mode worker running the Debezium
  # Postgres connector image. NOT Debezium Embedded (DRQ-040) — a visible,
  # inspectable connector is the teaching artifact for log-tailing CDC.
  # Registration (idempotent create-or-update) is a separate step — see
  # scripts/register-debezium.sh — not baked into this compose file, so the
  # connector config (infra/debezium/inventory-connector.json) can evolve
  # without a container rebuild.
  # Image moved to quay.io: Debezium stopped publishing to Docker Hub after
  # 3.0.0.Final (DRQ-077).
  connect:
    image: quay.io/debezium/connect:${CONNECT_IMAGE_TAG}
    container_name: mea-connect
    ports:
      - "${CONNECT_HOST_PORT:-8086}:8083"   # host 8086 (NOT 8083 — see header note); container always binds 8083
    environment:
      - BOOTSTRAP_SERVERS=kafka:9094
      - GROUP_ID=mea-connect-cluster
      - CONFIG_STORAGE_TOPIC=mea-connect-configs
      - OFFSET_STORAGE_TOPIC=mea-connect-offsets
      - STATUS_STORAGE_TOPIC=mea-connect-status
      - CONFIG_STORAGE_REPLICATION_FACTOR=1
      - OFFSET_STORAGE_REPLICATION_FACTOR=1
      - STATUS_STORAGE_REPLICATION_FACTOR=1
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s
    restart: unless-stopped

  # ─── Apicurio Schema Registry (ch.28, DRQ-038 follow-up/DRQ-076) ─────────
  # Used ONLY by examples/09-schema-registry-demo (see the header note above)
  # — no depends_on, since nothing else in this stack needs it ready first.
  # v3 image/API (confirmed by that module's `mvn dependency:tree`: the
  # quarkus-apicurio-registry-avro extension under quarkus-bom 3.40.1 pulls
  # io.apicurio:apicurio-registry-*:3.1.7, the v3 client line; the 3.3.3
  # server speaks the same /apis/registry/v3 API) — the image major and the
  # demo module's apicurio.registry.url agree on v3. APICURIO_STORAGE_KIND
  # =sql / APICURIO_STORAGE_SQL_KIND=h2: Apicurio 3.1.7 removed the plain
  # "mem" storage variant older 3.0.x images accepted (confirmed empirically
  # against a live 3.1.7 container: APICURIO_STORAGE_KIND=mem fails to
  # start) — embedded H2 is the closest equivalent, still ephemeral and wiped
  # on every container restart, no external dependency, and the registry
  # still self-reports as "Apicurio Registry (In Memory)" at /apis/registry/v3/system/info.
  apicurio:
    image: quay.io/apicurio/apicurio-registry:${APICURIO_IMAGE_TAG:-3.3.3}
    container_name: mea-apicurio
    ports:
      - "${APICURIO_HOST_PORT:-8095}:8080"
    environment:
      - APICURIO_STORAGE_KIND=sql
      - APICURIO_STORAGE_SQL_KIND=h2
    mem_limit: 512m
    healthcheck:
      # Apicurio Registry 3.3 serves health on the management interface
      # (container port 9000, not published); /health/ready on 8080 is a 404.
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:

networks:
  default:
    name: mea-observability
