# infra/otelcol/config.yaml
#
# OpenTelemetry Collector configuration for the local observability stack
# (r02 walking skeleton, S3). Mounted into the lgtm container, replacing its
# bundled default config so we control the pipeline explicitly.
#
# Receives OTLP (HTTP + gRPC) from the monolith and, later, the extracted
# services; applies the floor set of safety processors; exports to the LGTM
# stack's internal backends (Tempo/Mimir/Loki, all co-located in the same
# container on localhost).
#
# No sampling/cardinality-control processors yet (base config) — r02 has a
# single monolith emitting telemetry, so there is nothing to sample or
# constrain yet. Layer in otel-collector-tail-sampling.yaml /
# otel-collector-cardinality.yaml patterns from the lgtm-podman-stack skill
# once multiple extracted services are producing volume (r04+).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Self-scrape: the otel-lgtm image's startup script (run-all.sh) polls
  # Prometheus for the otelcol_process_uptime_total metric to decide the
  # whole stack is ready. Without this receiver feeding that metric into the
  # metrics pipeline, the container never reports healthy (confirmed by
  # bring-up during S3 — stock default config.yaml has this; the generic
  # lgtm-podman-stack base template does not, so it must be added back here).
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: 'opentelemetry-collector'
          static_configs:
            - targets: ['localhost:8888']

processors:
  # memory_limiter is the most important processor: without it a telemetry
  # flood can OOM-kill the Collector and take observability offline.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    timeout: 200ms
    send_batch_size: 8192

  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert

exporters:
  # Tempo's OTLP ingest port is 4418 in this image's bundled tempo-config.yaml
  # (distributor.receivers.otlp.protocols.http.endpoint) — NOT 3200, which is
  # Tempo's query/API port. Sending traces to 3200 silently no-ops.
  otlphttp/tempo:
    endpoint: http://localhost:4418
    tls:
      insecure: true

  # Prometheus v3's native OTLP receiver (not the remote-write endpoint) —
  # matches this image's bundled default and keeps metric metadata intact.
  otlphttp/metrics:
    endpoint: http://localhost:9090/api/v1/otlp
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: http://localhost:3100/otlp
    tls:
      insecure: true

  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 100

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/tempo]
    metrics:
      receivers: [otlp, prometheus/collector]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/metrics]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/loki]
