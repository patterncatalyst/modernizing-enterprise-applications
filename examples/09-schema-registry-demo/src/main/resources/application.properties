# schema-registry-demo — ch.28 (DRQ-038 follow-up, DRQ-076) Avro + Apicurio
# Schema Registry DEMONSTRATOR. ISOLATED and ADDITIVE: this module does not
# replace, route for, or share a topic with any existing extracted service.
# The real order.placed JSON event (examples/00-monolith through
# examples/07-order-service, DRQ-038) is untouched. This service publishes
# a field-for-field Avro mirror of OrderPlacedEvent (dev.patterncatalyst.
# contracts.avro.OrderPlaced, generated at build time by quarkus-avro from
# src/main/avro/order-placed-v1.avsc) to its OWN topic
# (order.events.avro.demo), fronted by Apicurio, to teach schema
# registration + BACKWARD-compatibility evolution checking.
quarkus.application.name=schema-registry-demo
quarkus.http.port=8096
quarkus.http.test-port=8097

# Reuses the SAME podman-stack Kafka broker every other example in this
# repo points at (compose.yaml's `kafka` service, localhost:9092) — no new
# broker, same convention as notification/payment/shipping/order
# (KAFKA_BOOTSTRAP_SERVERS override).
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ── Apicurio Schema Registry — v3 client/API (confirmed by `mvn dependency:
# tree`: quarkus-apicurio-registry-avro:3.40.1 pulls io.apicurio:apicurio-
# registry-*:3.1.7, the v3 client line) — the registry IMAGE pinned in
# compose.yaml (APICURIO_IMAGE_TAG), the healthcheck path, and this URL's
# `/apis/registry/v3` path all agree on the same major. Set at the
# CONNECTOR level (mp.messaging.connector.smallrye-kafka.apicurio.registry.url)
# so BOTH the order-avro-out producer and order-avro-in consumer channels
# below share one registry URL, rather than repeating it per-channel.
#
# Deliberately NOT set for %test: quarkus-apicurio-registry-avro's Dev
# Services (Testcontainers, quay.io/apicurio/apicurio-registry) and the
# quarkus-kafka-client Kafka Dev Services both activate automatically
# whenever no explicit URL/bootstrap-servers is configured for the active
# profile, so `mvn test` is self-contained given a container runtime
# (podman/docker) — no podman-stack dependency for the test suite.
%dev.mp.messaging.connector.smallrye-kafka.apicurio.registry.url=${APICURIO_REGISTRY_URL:http://localhost:8095/apis/registry/v3}
%prod.mp.messaging.connector.smallrye-kafka.apicurio.registry.url=${APICURIO_REGISTRY_URL:http://localhost:8095/apis/registry/v3}

# ── Outgoing: order-avro-out -> order.events.avro.demo (Avro via Apicurio) ──
mp.messaging.outgoing.order-avro-out.connector=smallrye-kafka
mp.messaging.outgoing.order-avro-out.topic=order.events.avro.demo
# Explicit, not autodetected: this build also pulls an older Apicurio serde
# transitively (same ambiguity datamesh-reference-arch-quarkus's
# order-service/application.properties documents for its identical
# producer), which makes SmallRye Kafka's serializer autodetection
# ambiguous and risks silently falling back to a Jackson (JSON) serializer
# — exactly the opposite of what this module exists to demonstrate.
mp.messaging.outgoing.order-avro-out.value.serializer=io.apicurio.registry.serde.avro.AvroKafkaSerializer
mp.messaging.outgoing.order-avro-out.apicurio.registry.auto-register=true

# ── Incoming: order-avro-in <- order.events.avro.demo (Avro via Apicurio) ──
mp.messaging.incoming.order-avro-in.connector=smallrye-kafka
mp.messaging.incoming.order-avro-in.topic=order.events.avro.demo
mp.messaging.incoming.order-avro-in.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
# Specific-record (not GenericRecord) deserialization into the generated
# dev.patterncatalyst.contracts.avro.OrderPlaced SpecificRecord class.
mp.messaging.incoming.order-avro-in.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.order-avro-in.group.id=schema-registry-demo
mp.messaging.incoming.order-avro-in.auto.offset.reset=earliest

# ── Ops ──────────────────────────────────────────────────────────────────
# quarkus-smallrye-health exposes /q/health, /q/health/live, /q/health/ready
# with zero extra config (Reactive Messaging connectivity checks included).
