# Reference monolith configuration.
#
# Defaults target the project's local podman-stack Postgres coordinates (S3,
# infra/). These are overridable via standard Spring Boot environment variables
# (SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD) so this module never hard-codes
# a dependency on the podman stack being up — the Testcontainers-backed smoke test
# (src/test) overrides them entirely and is fully self-contained.
spring:
  application:
    name: monolith
  datasource:
    url: jdbc:postgresql://localhost:5432/monolith
    username: monolith
    password: monolith
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# order-plan.md S10 (DRQ-070, the FINAL decommission): all config below this
# point describes machinery that has now been deleted from this module.
# Removed entirely (rather than left as inert properties, since Spring Boot
# would no longer recognize them without the dependencies that back them --
# see pom.xml):
#   - spring.kafka.* (bootstrap-servers, producer, consumer) -- the ONLY
#     producer (common/outbox/OutboxRelay's KafkaTemplate, ch.17 r04/S3) and
#     the ONLY consumer (order.OrderSagaListener's @KafkaListener reactions
#     to payment.captured/declined and shipment.dispatched/failed, ch.23/24)
#     are both deleted along with order/* and common/outbox/*.
#   - outbox.relay.poll-interval-ms -- OutboxRelay itself is deleted.
#   - inventory.grpc.host/port/timeout-ms -- RemoteInventoryClient (the gRPC
#     client these coordinates configured) is deleted.
# Prior decommissions (r06/ch.23 S9 payment, r07/ch.24 S9 shipping) had
# already removed their own mode=... reversibility flags from this file the
# same way; this is that same treatment applied, for the last time, to the
# order context's own machinery. See SMELLS.md (#2/#3 now fully cured) and
# MonolithApplication's javadoc for the full decommission history.

logging:
  level:
    dev.patterncatalyst.monolith: INFO
