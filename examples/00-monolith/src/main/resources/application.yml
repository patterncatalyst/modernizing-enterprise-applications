# Reference monolith configuration.
#
# Defaults target the project's local podman-stack Postgres coordinates (S3,
# infra/). These are overridable via standard Spring Boot environment variables
# (SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD) so this module never hard-codes
# a dependency on the podman stack being up — the Testcontainers-backed smoke test
# (src/test) overrides them entirely and is fully self-contained.
spring:
  application:
    name: monolith
  datasource:
    url: jdbc:postgresql://localhost:5432/monolith
    username: monolith
    password: monolith
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  # Kafka coordinates for the outbox relay's producer (ch.17, r04/S3,
  # common/outbox/OutboxRelay). Bootstrap defaults to the podman-stack
  # broker's host listener (compose.yaml, localhost:9092) and is overridable
  # via the standard Spring Boot env var SPRING_KAFKA_BOOTSTRAP_SERVERS —
  # never hard-coded beyond this default.
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ch.17 (r04/S3, DRQ-036): notification.mode=synchronous is the DEFAULT —
# today's unchanged behavior (OrderService calls NotificationService
# in-transaction). Set to `outbox` (e.g. NOTIFICATION_MODE=outbox) to switch
# placeOrder to writing a transactional-outbox row instead; see
# OrderService#placeOrder and common/outbox/OutboxRelay.
notification:
  mode: synchronous

# ch.17 (r04/S3): the outbox relay's own tuning, independent of notification.mode
# so it can be adjusted without touching the write-path flag.
outbox:
  relay:
    poll-interval-ms: 2000

logging:
  level:
    dev.patterncatalyst.monolith: INFO
