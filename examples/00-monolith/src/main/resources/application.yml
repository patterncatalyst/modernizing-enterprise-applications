# Reference monolith configuration.
#
# Defaults target the project's local podman-stack Postgres coordinates (S3,
# infra/). These are overridable via standard Spring Boot environment variables
# (SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD) so this module never hard-codes
# a dependency on the podman stack being up — the Testcontainers-backed smoke test
# (src/test) overrides them entirely and is fully self-contained.
spring:
  application:
    name: monolith
  datasource:
    url: jdbc:postgresql://localhost:5432/monolith
    username: monolith
    password: monolith
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  # Kafka coordinates for the outbox relay's producer (ch.17, r04/S3,
  # common/outbox/OutboxRelay). Bootstrap defaults to the podman-stack
  # broker's host listener (compose.yaml, localhost:9092) and is overridable
  # via the standard Spring Boot env var SPRING_KAFKA_BOOTSTRAP_SERVERS —
  # never hard-coded beyond this default.
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    # ch.23 (r06/S6, H4; r06/S9 DECOMMISSION): the monolith's FIRST Kafka
    # CONSUMER config — order.OrderSagaListener reacts to
    # payment.captured/payment.declined (see Topics.java) to confirm+ship or
    # decline+compensate. String deserializers are used deliberately (same
    # as the outbox relay's producer): the listener deserializes the JSON
    # payload itself via the injected ObjectMapper, matching the plain-JSON
    # wire contract (DRQ-038). The payment.mode=synchronous|choreographed
    # reversibility flag that once gated whether this listener's reactions
    # were ever actually exercised has been removed (S9) — choreographed is
    # now the only checkout path, so this consumer is always genuinely live.
    consumer:
      group-id: monolith-order-saga
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ch.17 (r04/S8): the outbox relay's own tuning. notification.mode (the
# synchronous|outbox reversibility flag used during the extraction) has been
# removed — placeOrder now always writes the outbox row; see
# OrderService#placeOrder and common/outbox/OutboxRelay.
outbox:
  relay:
    poll-interval-ms: 2000

# r05/ch.19 S11 (DECOMMISSION): the inventory.mode=local|remote reversibility
# flag (DRQ-045) introduced for the S7 cutover has been removed along with
# the monolith's local in-JVM inventory module (InventoryController/
# InventoryService/InventoryItem/InventoryRepository, SMELL #5 — now CURED,
# see SMELLS.md). OrderService#placeOrder's checkout reserve/release ALWAYS
# routes through RemoteInventoryClient's gRPC stub to the extracted
# inventory service (examples/04-inventory-service, :9004), with a
# compensating Release on any PRE-HANDOFF checkout failure (a later line out
# of stock, or the order save/outbox write itself throwing, DRQ-042) --
# post-handoff payment-decline compensation is a separate reaction, see
# order.OrderSagaListener (DRQ-049). Overridable via the standard Spring Boot env vars
# INVENTORY_GRPC_HOST/INVENTORY_GRPC_PORT/INVENTORY_GRPC_TIMEOUT_MS, never
# hard-coded beyond these defaults.
inventory:
  grpc:
    host: ${INVENTORY_GRPC_HOST:localhost}
    port: ${INVENTORY_GRPC_PORT:9004}
    timeout-ms: ${INVENTORY_GRPC_TIMEOUT_MS:5000}

# r06/ch.23 S9 (DECOMMISSION): the payment.mode=synchronous|choreographed
# reversibility flag introduced for the S6 cutover has been removed along
# with the monolith's in-process payment module (payment.PaymentController/
# PaymentService/Payment/PaymentRepository, SMELL[ch.22] -- now CURED for
# payment, see SMELLS.md). OrderService#placeOrder ALWAYS persists the order
# PENDING and hands it off via the order.placed outbox event; there is no
# more in-line charge to fall back to. The payment service
# (examples/05-payment-service, :8085) is the sole owner of payment capture,
# reached exclusively over the choreographed saga.

logging:
  level:
    dev.patterncatalyst.monolith: INFO
