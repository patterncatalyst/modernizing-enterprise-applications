syntax = "proto3";

package dev.patterncatalyst.inventory.v1;

option java_package = "dev.patterncatalyst.inventory.v1";
option java_multiple_files = true;
option java_outer_classname = "InventoryProto";

// r05/ch.19 S7 (DRQ-039/041/042) -- COPY of the single-writer contract
// authored at examples/04-inventory-service/src/main/proto/dev/patterncatalyst/
// inventory/v1/inventory.proto (S4). Copied verbatim (not re-authored) so the
// monolith's gRPC CLIENT stub and the inventory service's gRPC SERVER stub
// are generated from byte-identical .proto source -- any drift here would be
// exactly the two-protocol/ACL-drift risk (H4) the plan calls out. Do not
// edit this copy independently of the S4 original; if the contract changes,
// re-copy from the source of truth.
//
// The gRPC contract IS the anti-corruption layer for the synchronous
// order<->inventory seam (curing SMELL #5): a strongly-typed, versioned wire
// vocabulary deliberately DISTINCT from the monolith's own
// common.StockDto record (sku/name/priceCents/quantityOnHand) so ch.16's
// InventoryAclRoute message translator earns its keep converting between the
// two, rather than the two shapes happening to already agree.
//
// Adapted + EXTENDED from
// ~/Dev/datamesh-reference-arch-quarkus/examples/contracts/src/main/proto/
// capstone/inventory/v1/inventory.proto, which ships only a read-only
// CheckStock RPC. This contract adds the mutating Reserve/Release RPCs the
// checkout seam needs (DRQ-041: Reserve stays synchronous; DRQ-042: Release
// is the compensating call, a deliberate first taste of saga) plus GetStock
// (the ACL read-enrich target for ch.16's InventoryAclRoute).
service InventoryGrpcService {

  // Read-only availability probe: is at least requested_qty on hand for sku?
  // Does not mutate state.
  rpc CheckStock (CheckStockRequest) returns (StockReply);

  // Server-side atomic check-and-decrement against the inventory service's
  // OWN database, under its own lock (DRQ-041: correctness requires the
  // caller to know synchronously whether stock was secured before
  // confirming the order). reservation_ok=false + unchanged on_hand_qty
  // means insufficient stock -- no decrement happened.
  rpc Reserve (ReserveRequest) returns (ReserveReply);

  // Compensating re-increment (DRQ-042): once the decrement lives in this
  // service's own DB, the monolith's local @Transactional can no longer roll
  // it back on a later payment decline. The monolith calls Release to
  // restore the observable baseline -- a deliberate first taste of the
  // choreographed saga landing in ch.23.
  rpc Release (ReleaseRequest) returns (ReserveReply);

  // Full read of one sku's current stock record -- the content-enricher
  // fetch target for ch.16's InventoryAclRoute (content-based router ->
  // content enricher -> message translator into StockDto).
  rpc GetStock (GetStockRequest) returns (StockReply);
}

message CheckStockRequest {
  string stock_keeping_unit = 1;
  int32 requested_qty = 2;
}

message ReserveRequest {
  string stock_keeping_unit = 1;
  int32 requested_qty = 2;
}

message ReleaseRequest {
  string stock_keeping_unit = 1;
  int32 requested_qty = 2;
}

message GetStockRequest {
  string stock_keeping_unit = 1;
}

message StockReply {
  string stock_keeping_unit = 1;
  string display_name = 2;
  int64 unit_price_cents = 3;
  int32 on_hand_qty = 4;
  bool available = 5;
}

message ReserveReply {
  string stock_keeping_unit = 1;
  bool reservation_ok = 2;
  int32 on_hand_qty = 3;
}
