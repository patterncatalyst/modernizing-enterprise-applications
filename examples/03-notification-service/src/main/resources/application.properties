# notification-service — ch.17 Phase B (idiomatic Quarkus read surface +
# net-new SmallRye Reactive Messaging consumer, DRQ-029/DRQ-035/DRQ-038).
# UNLIKE review-service (which stayed in the monolith's SHARED schema,
# reading the live `reviews`/`customers`/`inventory_items` tables), this
# service OWNS ITS OWN SCHEMA from day one — see Notification.java's javadoc
# for why an event-driven read model cannot share the upstream aggregate's
# tables. It points at the SAME compose-stack Postgres *instance*
# (localhost:5432, db `monolith`) as every other example in this repo, but
# lives in its own `notification` Postgres SCHEMA inside that database,
# migrated by its OWN Flyway history (src/main/resources/db/migration) — it
# never reads or writes the monolith's `public.notifications` table.
quarkus.application.name=notification-service
quarkus.http.port=8083
quarkus.http.test-port=8084

# %dev and %prod both point at the real compose-stack Postgres instance, same
# coordinates compose.yaml/.env.example publish for every other service in
# this repo. Deliberately NOT set unprefixed: leaving it unset for the (test)
# profile lets Quarkus Dev Services start an ISOLATED, ephemeral Testcontainers
# Postgres for @QuarkusTest runs — never the shared long-lived instance — while
# still exercising this service's OWN Flyway migrations for real (see
# NotificationResourceTest).
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=monolith
%dev.quarkus.datasource.password=monolith_dev_only
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/monolith?currentSchema=notification
%dev.quarkus.datasource.devservices.enabled=false

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=monolith
%prod.quarkus.datasource.password=monolith_dev_only
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/monolith?currentSchema=notification
%prod.quarkus.datasource.devservices.enabled=false

# Own-schema Flyway: this service is the ONLY writer of the `notification`
# schema's migration history (contrast with review-service, which carries NO
# Flyway at all because it doesn't own the schema it reads). Flyway creates
# the `notification` schema automatically (it does not exist yet in the
# compose-stack Postgres on first run) and places its own
# `flyway_schema_history` table inside it, never touching `public`.
quarkus.flyway.schemas=notification
quarkus.flyway.migrate-at-start=true

# Hibernate ORM never manages the schema (Flyway does, exclusively) — same
# discipline review-service applies to the shared schema it doesn't own,
# applied here to the schema THIS service does own.
quarkus.hibernate-orm.schema-management.strategy=none

# Pin Hibernate's JDBC session timezone to UTC rather than inheriting the
# host JVM's default (found during S4 verification: the @QuarkusTest Dev
# Services Postgres container — an alpine image with a minimal zoneinfo
# database — rejected this machine's JVM default zone ID with
# "FATAL: invalid value for parameter 'TimeZone'"). UTC is always valid and
# matches the UTC `TIMESTAMPTZ` columns the Flyway migration defines.
quarkus.hibernate-orm.jdbc.timezone=UTC

# ── ch.17 Phase B / S5 — SmallRye Reactive Messaging Kafka consumers
# (DRQ-035: idiomatic-from-the-start, no Spring original to lift) ──
#
# Both channels below consume the SAME `order.placed` topic the monolith's
# OutboxRelay publishes to (examples/00-monolith/.../common/outbox/
# OutboxRelay.java) — JSON, not Avro (DRQ-038; Avro+Apicurio is ch.28). The
# message value type, OrderPlacedEvent, is a "trivial" record, so Quarkus
# generates the Jackson (de)serializer at build time; no value.deserializer
# is set explicitly. Bootstrap defaults to the compose-stack broker's host
# listener (compose.yaml, localhost:9092) and is overridable via
# KAFKA_BOOTSTRAP_SERVERS, mirroring the monolith's SPRING_KAFKA_BOOTSTRAP_SERVERS
# convention — never hard-coded beyond this default.
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# order-placed: persistence-only (OrderPlacedConsumer). No group.id is set,
# so it defaults to quarkus.application.name ("notification-service") — a
# single SHARED consumer group, so across a replica set each event is
# persisted by exactly one replica (correct for "write each order exactly
# once", backstopped by NotificationService#recordOrderPlaced's
# dedupe-by-order-id for the at-least-once redelivery case).
mp.messaging.incoming.order-placed.connector=smallrye-kafka
mp.messaging.incoming.order-placed.topic=order.placed
mp.messaging.incoming.order-placed.auto.offset.reset=earliest
# Reactive Messaging commits the offset itself once a message is processed
# (i.e. once the @Transactional persist succeeds) — not on receipt.
mp.messaging.incoming.order-placed.enable.auto.commit=false

# order-placed-push: WebSocket fan-out only (OrderPlacedPushConsumer); never
# persists. Same topic as above, but a per-replica UNIQUE group.id so Kafka
# treats every replica as "a group of one" and hands it a copy of every
# record on every partition, instead of splitting them — the multi-replica
# fan-out pattern adapted from datamesh's notification-service. HOSTNAME is
# set by Kubernetes to the pod name for every container in a Deployment
# (unique per replica); the ":notification-service-push" default keeps this
# channel working with a single, fixed group id when HOSTNAME isn't present
# (e.g. a bare `mvn test` run outside a container) — still correct for a
# single replica, since one group still sees every record.
mp.messaging.incoming.order-placed-push.group.id=notification-push-${HOSTNAME:notification-service-push}
mp.messaging.incoming.order-placed-push.connector=smallrye-kafka
mp.messaging.incoming.order-placed-push.topic=order.placed
mp.messaging.incoming.order-placed-push.auto.offset.reset=earliest
mp.messaging.incoming.order-placed-push.enable.auto.commit=false
