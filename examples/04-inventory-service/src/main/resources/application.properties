# inventory-service -- r05/ch.19 S4+S5+S6 (DRQ-039, DRQ-040, DRQ-044).
#
# Phase A (DRQ-044, superseded by Phase B below): lifted the monolith's
# InventoryController/InventoryService/InventoryRepository/InventoryItem read
# surface onto Quarkus via the Quarkiverse Spring-compat extensions. Phase B
# (S6) removes that shim -- the read surface now runs on Quarkus REST
# (InventoryResource) + Panache (InventoryRepository implements
# PanacheRepository<InventoryItem>) + plain CDI (InventoryService), same
# StockDto JSON shape, same 404 contract (see MIGRATION.md). UNLIKE
# review-service (which stayed in the monolith's SHARED schema), this service
# owns its OWN `inventory` Postgres schema from day one (own-schema decision
# mirrors notification-service, DRQ-035-style, here driven by
# DRQ-044/CDC-ownership) -- it is a WRITABLE CDC-fed replica of
# `public.inventory_items`, not a read-only projection into the shared
# schema, so it cannot share the monolith's table.
quarkus.application.name=inventory-service
quarkus.http.port=8084
quarkus.http.test-port=8085

# %dev and %prod both point at the real compose-stack Postgres instance
# (compose.yaml/.env.example: localhost:5432, db `monolith`), scoped to this
# service's OWN `inventory` schema via currentSchema. Deliberately NOT set
# unprefixed: leaving it unset for the (test) profile lets Quarkus Dev
# Services start an ISOLATED, ephemeral Testcontainers Postgres for
# @QuarkusTest runs -- never the shared long-lived instance -- while still
# exercising this service's OWN Flyway migrations for real.
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=monolith
%dev.quarkus.datasource.password=monolith_dev_only
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/monolith?currentSchema=inventory
%dev.quarkus.datasource.devservices.enabled=false

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=monolith
%prod.quarkus.datasource.password=monolith_dev_only
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/monolith?currentSchema=inventory
%prod.quarkus.datasource.devservices.enabled=false

# Own-schema Flyway (schema-management strategy=none, same discipline as
# review-service applies to the shared schema it doesn't own, and
# notification-service applies to the schema it does): this service is the
# ONLY writer of the `inventory` schema's migration history. Flyway creates
# the `inventory` schema automatically on first run.
quarkus.flyway.schemas=inventory
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# Pin Hibernate's JDBC session timezone to UTC (same fix notification-service
# needed, S4 verification: the @QuarkusTest Dev Services Postgres container
# -- an alpine image with a minimal zoneinfo database -- rejects this
# machine's JVM default zone ID). Matches the TIMESTAMPTZ `updated_at` column.
quarkus.hibernate-orm.jdbc.timezone=UTC

# ── r05/ch.19 S6 -- gRPC SERVER (DRQ-039/DRQ-041/DRQ-042/DRQ-044) ──
# InventoryGrpcServiceImpl (@GrpcService) implements CheckStock/Reserve/
# Release/GetStock. A SEPARATE gRPC server (not sharing the HTTP port 8084)
# on 9004, chosen to sit one above the monolith's/other services' HTTP ports
# in this repo's port map and avoid any collision with :8084's HTTP listener.
# `quarkus.grpc.server.test-port` mirrors `quarkus.http.test-port` above --
# a distinct port so `@QuarkusTest`'s gRPC server doesn't collide with a
# concurrently running `quarkus:dev` instance's gRPC server during
# continuous testing. The in-JVM `@GrpcClient("inventory")` test client
# (InventoryGrpcServiceTest) is pointed at the test port explicitly below.
quarkus.grpc.server.port=9004
quarkus.grpc.server.test-port=9005
quarkus.grpc.server.use-separate-server=true

%test.quarkus.grpc.clients.inventory.host=localhost
%test.quarkus.grpc.clients.inventory.port=9005

# ── r05/ch.19 S5 -- Debezium CDC backfill/sync consumer (DRQ-040) ──
# NET-NEW (DRQ-035-style: no Spring original to lift -- the monolith never
# consumed its own inventory_items changes). Binds to the SAME
# `mea.public.inventory_items` topic infra/debezium/inventory-connector.json
# publishes to (topic.prefix=mea, schema.include.list=public,
# table.include.list=public.inventory_items). The connector runs with
# key/value.converter.schemas.enable=false (infra/debezium/README.md), so
# Kafka Connect's JsonConverter emits the Debezium envelope FLAT -- no outer
# {"schema":...,"payload":{...}} wrapper, just {"before":...,"after":...,
# "source":...,"op":...,"ts_ms":...} as the message value -- hence binding
# this channel to a plain String payload (StringDeserializer) and parsing
# the envelope by hand with Jackson in InventoryCdcConsumer, rather than
# relying on Quarkus's build-time record deserializer (which assumes a
# single fixed shape, not a Debezium op-dependent before/after envelope).
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

mp.messaging.incoming.inventory-cdc.connector=smallrye-kafka
mp.messaging.incoming.inventory-cdc.topic=mea.public.inventory_items
# A dedicated, stable group id (not the quarkus.application.name default) so
# a future second replica of this service still forms one balanced backfill
# group rather than each replica re-reading the full topic from earliest.
mp.messaging.incoming.inventory-cdc.group.id=inventory-service-cdc
mp.messaging.incoming.inventory-cdc.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
# initial snapshot (op=r) events only exist once, at connector registration
# time -- earliest ensures a freshly-started (or restarted-with-no-committed-
# offset) consumer replays them for the backfill, exactly DRQ-040's "seed
# from the initial snapshot, then keep current during the transition" role.
mp.messaging.incoming.inventory-cdc.auto.offset.reset=earliest
# Reactive Messaging commits the offset itself once a message is processed
# (i.e. once the @Transactional upsert/delete succeeds) -- not on receipt.
mp.messaging.incoming.inventory-cdc.enable.auto.commit=false


# ch.30 (additive): OpenTelemetry traces to the mesh LGTM collector. Demo
# sampler (always_on) -- not production-appropriate, this is for a live
# connected-trace capture across exactly 3 instrumented modules.
quarkus.otel.exporter.otlp.traces.endpoint=http://lgtm.mea.svc.cluster.local:4317
quarkus.otel.service.name=inventory-service
quarkus.otel.traces.sampler=always_on
