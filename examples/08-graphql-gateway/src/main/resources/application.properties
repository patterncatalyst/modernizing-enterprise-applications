# graphql-gateway -- ch.26 S7 (DRQ-069), adapted from
# ~/Dev/datamesh-reference-arch-quarkus/examples/graphql-gateway (DRQ-032)
# with attribution, widened from order+stock to the full cross-context view.
#
# This module OWNS NO DATA: every field is resolved by calling the service
# that owns it, over the SAME protocol that service's other consumers use
# (REST for order/payment/shipping/review, gRPC for inventory -- the
# read-only GetStock RPC, same contract order-service's own
# RemoteInventoryClient dials). Nothing here is request-derived: every
# downstream target below is FIXED operator config (DRQ-069's secure-by-design
# requirement -- an aggregation gateway that let a client redirect a
# downstream call would be a trivial SSRF/amplification vector).
quarkus.application.name=graphql-gateway
quarkus.http.port=8090
# Avoids 8086 (Debezium Kafka Connect REST API, compose.yaml
# CONNECT_HOST_PORT) and every other service's main/test port (see
# order-service's application.properties for the full port ledger).
quarkus.http.test-port=8092

# --- order-service REST client (GET /api/orders/{id}) ----------------------
quarkus.rest-client.order-service.url=${ORDER_SERVICE_URL:http://localhost:8087}
quarkus.rest-client.order-service.connect-timeout=5000
quarkus.rest-client.order-service.read-timeout=5000

# --- payment-service REST client (GET /api/payments?orderId=) --------------
quarkus.rest-client.payment-service.url=${PAYMENT_SERVICE_URL:http://localhost:8085}
quarkus.rest-client.payment-service.connect-timeout=5000
quarkus.rest-client.payment-service.read-timeout=5000

# --- shipping-service REST client (GET /api/shipments?orderId=) ------------
quarkus.rest-client.shipping-service.url=${SHIPPING_SERVICE_URL:http://localhost:8088}
quarkus.rest-client.shipping-service.connect-timeout=5000
quarkus.rest-client.shipping-service.read-timeout=5000

# --- review-service REST client (GET /api/reviews?sku=) --------------------
quarkus.rest-client.review-service.url=${REVIEW_SERVICE_URL:http://localhost:8081}
quarkus.rest-client.review-service.connect-timeout=5000
quarkus.rest-client.review-service.read-timeout=5000

# --- inventory-service gRPC client (GetStock RPC) ---------------------------
# Same host/port convention as order-service's RemoteInventoryClient --
# dev/prod dial the real inventory-service gRPC server (port 9004); %test
# dials that service's documented test port (9005) when a real
# inventory-service process is up for a live multi-service stitch (S8/S9).
# The gateway's own @QuarkusTest suite mocks this with an in-process
# @GrpcService test double (see MockInventoryGrpcService) and never dials
# either port.
# This module is a gRPC CLIENT ONLY -- it has no @GrpcService of its own
# (MockInventoryGrpcService is a src/test-only stand-in) -- but the
# quarkus-grpc extension still stands up a (vestigial, unused) gRPC SERVER
# whenever it's on the classpath. Pin it off the extension's default port
# 9000 to avoid colliding with any other unrelated local gRPC/MCP server
# already bound there on a dev workstation.
quarkus.grpc.server.port=9093

quarkus.grpc.clients.inventory.host=${INVENTORY_GRPC_HOST:localhost}
quarkus.grpc.clients.inventory.port=${INVENTORY_GRPC_PORT:9004}
%test.quarkus.grpc.clients.inventory.host=localhost
%test.quarkus.grpc.clients.inventory.port=9005

# --- Secure-by-design: bound query depth/complexity (DRQ-069) --------------
# The deepest legitimate query this gateway's schema supports is
# order -> items -> stock|reviews (depth 3) or order -> payments|shipments
# (depth 2); 8 leaves headroom for field aliases/fragments in the contract
# suite while still rejecting a deliberately recursive/padded query. The
# complexity budget (effectively "total field count", graphql-java's default
# scoring of 1 point per field with multipliers for list fields) is sized so
# the full GG-a aggregation (order + ~6 order fields + items[] with 3 fields
# each + nested stock/reviews + payments[]/shipments[] with their fields)
# comfortably fits, while a query that pads the selection set with many
# aliased copies of the same expensive subtree is rejected. Both bounds are
# OPERATOR config here (application.properties), never influenced by request
# content -- the amplification-vector mitigation DRQ-069 calls for.
smallrye.graphql.instrumentation.queryDepth=8
smallrye.graphql.instrumentation.queryComplexity=200

# OrderNotFoundException's message is safe to surface verbatim (it carries no
# internal detail, just "order <id> not found") -- show it instead of the
# default masked "Server Error" so the GraphQL Gateway Contract's GG-b
# envelope carries a meaningful message. Every OTHER unexpected
# RuntimeException (a downstream 5xx, a timeout) stays masked, which is the
# secure default: never echo an internal exception's raw message to a GraphQL
# client.
quarkus.smallrye-graphql.show-runtime-exception-message=dev.patterncatalyst.gateway.OrderNotFoundException

# Include the @ErrorCode-set "code" extension (ORDER_NOT_FOUND) in error
# responses, on top of the "exception"/"classification" fields SmallRye
# GraphQL includes by default -- lets a GraphQL client branch on a stable
# error code rather than parsing the (masked, for everything except
# OrderNotFoundException) message string.
smallrye.graphql.errorExtensionFields=exception,classification,code,description

# GraphiQL ships enabled by default in dev/test; set explicitly here for
# discoverability, same as the datamesh gateway this module adapts from.
%dev.quarkus.smallrye-graphql.ui.always-include=true


# ch.30 (additive): OpenTelemetry traces to the mesh LGTM collector. Demo
# sampler (always_on) -- not production-appropriate, this is for a live
# connected-trace capture across exactly 3 instrumented modules.
quarkus.otel.exporter.otlp.traces.endpoint=http://lgtm.mea.svc.cluster.local:4317
quarkus.otel.service.name=graphql-gateway
quarkus.otel.traces.sampler=always_on

# ── Native container build (DRQ-077) ─────────────────────────────────────
# `-Dquarkus.native.container-build=true` runs native-image inside the
# Mandrel builder on Docker Engine: pinned UBI 10 / JDK 25 builder, exact tag.
quarkus.native.container-runtime=docker
quarkus.native.builder-image=quay.io/quarkus/ubi10-quarkus-mandrel-builder-image:jdk-25.0.4.1
