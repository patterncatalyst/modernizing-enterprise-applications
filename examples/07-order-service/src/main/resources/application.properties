# order-service -- ch.26 S5 (DRQ-073), Phase B.
#
# Phase A (S4, "lift the read+command surface onto Quarkus") lifted the
# monolith's OrderController/OrderService#getById,listAll,placeOrder/
# Order+OrderItem/OrderRepository/Customer+CustomerRepository read+command
# surface onto Quarkus via the Quarkiverse Spring-compatibility extensions.
# Phase B (this step) removes that shim -- the read+command surface now runs
# on Quarkus REST + Panache + plain CDI -- and adds the net-new CQRS write
# core: placeOrder writes order.placed to this service's OWN transactional
# outbox atomically with the Order row; a @Scheduled relay then publishes
# unpublished outbox rows to Kafka; the four lifted OrderSagaListener
# reactions (@Incoming consumers, own consumer group) drive the rest of the
# lifecycle. Still owns its OWN `order_service` Postgres schema from day one
# (own-schema, same discipline as inventory/payment/shipping). The read-model
# projection is S6 (see MIGRATION.md).
quarkus.application.name=order-service
quarkus.http.port=8087
# Avoids 8086 (Debezium Kafka Connect REST API, compose.yaml CONNECT_HOST_PORT),
# 8089 (shipping-service's test port), and 8090 (the future graphql-gateway) --
# payment-service's :8087 is a TEST-only port there, so it is free at runtime
# for this service's main port.
quarkus.http.test-port=8091

# %dev and %prod both point at the real podman-stack Postgres instance
# (compose.yaml/.env.example: localhost:5432, db `monolith`), scoped to this
# service's OWN `order_service` schema via currentSchema -- mirrors
# inventory's/payment's/shipping's own-schema treatment, NOT review's
# shared-schema approach. Deliberately NOT set unprefixed: leaving it unset
# for the (test) profile lets Quarkus Dev Services start an ISOLATED,
# ephemeral Testcontainers Postgres for @QuarkusTest runs -- never the shared
# long-lived instance -- while still exercising this service's OWN Flyway
# migrations for real.
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=monolith
%dev.quarkus.datasource.password=monolith_dev_only
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/monolith?currentSchema=order_service
%dev.quarkus.datasource.devservices.enabled=false

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=monolith
%prod.quarkus.datasource.password=monolith_dev_only
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/monolith?currentSchema=order_service
%prod.quarkus.datasource.devservices.enabled=false

# Own-schema Flyway (schema-management strategy=none, same discipline as
# inventory/payment/shipping): this service is the ONLY writer of the
# `order_service` schema's migration history. Flyway creates the schema
# automatically on first run. Store starts EMPTY and is forward-filled only --
# deliberately NO CDC backfill from the monolith's existing customers/orders/
# order_items rows (contrast inventory's CDC-fed backfill, DRQ-040): this
# step's scope is read+command surface + entities + own schema only.
quarkus.flyway.schemas=order_service
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# Pin Hibernate's JDBC session timezone to UTC -- same fix every other
# extracted service needed: the @QuarkusTest Dev Services Postgres container
# (an alpine image with a minimal zoneinfo database) rejects this machine's
# JVM default zone ID. Matches the TIMESTAMPTZ created_at/updated_at columns.
quarkus.hibernate-orm.jdbc.timezone=UTC

# -- ch.26 S4 gRPC CLIENT SCAFFOLD (DRQ-068/073) --
#
# RemoteInventoryClient's @GrpcClient("inventory") target: the extracted
# inventory service's gRPC server (examples/04-inventory-service,
# quarkus.grpc.server.port=9004 in dev/prod). %test points at that service's
# own documented test port (9005) for completeness/consistency, even though
# OrderServiceTest/OrderControllerTest mock RemoteInventoryClient directly and
# never actually dial this channel (no live inventory-service process is
# required to run this service's Phase A test suite) -- see RemoteInventoryClient's
# javadoc for what's deferred to S5 (the live end-to-end wiring proof).
quarkus.grpc.clients.inventory.host=localhost
quarkus.grpc.clients.inventory.port=9004
%test.quarkus.grpc.clients.inventory.host=localhost
%test.quarkus.grpc.clients.inventory.port=9005

# -- ch.26 S5 (DRQ-073) -- SmallRye Reactive Messaging Kafka --
#
# Bootstrap defaults to the podman-stack broker's host listener
# (compose.yaml, localhost:9092), overridable via KAFKA_BOOTSTRAP_SERVERS --
# the same convention payment-service/shipping-service use.
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# order-placed: OrderOutboxRelay's single outgoing channel (this service only
# ever emits ONE event type from its outbox, unlike payment's two-outcome
# relay -- see OrderOutboxRelay's javadoc). Sent programmatically via
# @Channel Emitter (not an @Outgoing method) for the same reason every other
# outbox relay in this repo uses an Emitter: the row to publish is read off a
# table, not produced by a static method return.
mp.messaging.outgoing.order-placed.connector=smallrye-kafka
mp.messaging.outgoing.order-placed.topic=order.placed

# OrderOutboxRelay's @Scheduled poll interval -- same default cadence as
# payment-service's/the monolith's outbox relay (poll-interval-ms=2000).
order.outbox.relay.poll-interval=2s

# The four lifted OrderSagaListener reactions (DRQ-074) -- NO group.id
# override on any of these, so each defaults to quarkus.application.name
# ("order-service"), a single SHARED consumer group distinct from both the
# monolith's OrderSagaListener consumer group and shipping-service's
# "shipping-service" group (same topics, three independent consumer groups
# reacting to the same events, not a hand-off -- see OrderSagaListener's
# class javadoc). Reactive Messaging commits each offset itself once the
# @Transactional reaction succeeds, not on receipt.
mp.messaging.incoming.payment-captured.connector=smallrye-kafka
mp.messaging.incoming.payment-captured.topic=payment.captured
mp.messaging.incoming.payment-captured.auto.offset.reset=earliest
mp.messaging.incoming.payment-captured.enable.auto.commit=false

mp.messaging.incoming.payment-declined.connector=smallrye-kafka
mp.messaging.incoming.payment-declined.topic=payment.declined
mp.messaging.incoming.payment-declined.auto.offset.reset=earliest
mp.messaging.incoming.payment-declined.enable.auto.commit=false

mp.messaging.incoming.shipment-dispatched.connector=smallrye-kafka
mp.messaging.incoming.shipment-dispatched.topic=shipment.dispatched
mp.messaging.incoming.shipment-dispatched.auto.offset.reset=earliest
mp.messaging.incoming.shipment-dispatched.enable.auto.commit=false

mp.messaging.incoming.shipment-failed.connector=smallrye-kafka
mp.messaging.incoming.shipment-failed.topic=shipment.failed
mp.messaging.incoming.shipment-failed.auto.offset.reset=earliest
mp.messaging.incoming.shipment-failed.enable.auto.commit=false
