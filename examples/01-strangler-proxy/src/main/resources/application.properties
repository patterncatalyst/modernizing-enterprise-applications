# strangler-proxy — the Camel edge router for the six extracted bounded
# contexts. Originally the strangler-fig proxy fronting the monolith
# (r02-plan S7); now its permanent successor as of order-plan.md S10
# (DRQ-070) — the strangler fig has completed, there is no monolith left to
# strangle, and this is the system's permanent REST edge router.
quarkus.application.name=strangler-proxy

# The proxy's own listen port. Clients (and the Newman contract/acceptance
# suite) talk to the proxy here, never directly to an individual service.
quarkus.http.port=8888

# ── order-plan.md S10 (DRQ-070) — the strangler flags are RETIRED ──────────
# All six strangler.*.enabled cutover flags (review/notification/inventory/
# payment/shipping/order) and the strangler.monolith.base-url default
# backend have been removed from this file and from StranglerProxyRoute's
# field declarations. Routing is now unconditional: StranglerProxyRoute's
# configure() dispatches on URI path prefix alone, straight to one of the
# six base URLs below, every time -- there is no flag left to flip and no
# monolith left to fall back to. See StranglerProxyRoute's class javadoc for
# the full per-context cutover history (each flag's reversibility window,
# proven green both ways, right up to that context's own decommission step)
# and CUTOVER.md for the evidence trail.

# Fixed, operator-controlled backend targets. The route only ever picks one of
# these known, configured URIs — never a header- or request-derived value —
# which is the secure-by-default discipline for a dynamic-URI Camel route
# (build-plan.md §F.4): no attacker-controlled input can redirect the router
# to an arbitrary host.
strangler.review.base-url=http://localhost:8081
strangler.notification.base-url=http://localhost:8083
strangler.inventory.base-url=http://localhost:8084
strangler.payment.base-url=http://localhost:8085
# NOTE: the shipping service listens on :8088 -- :8086 is Debezium Connect
# (compose.yaml, unrelated), not a target of this router.
strangler.shipping.base-url=http://localhost:8088
# NOTE: the order service listens on :8087 -- not :8086 (Debezium Connect)
# and not :8090 (the GraphQL gateway, order-plan.md DRQ-069, which has its
# own front door and is never routed through this proxy).
strangler.order.base-url=http://localhost:8087

# ── Native container build (DRQ-077) ─────────────────────────────────────
# `-Dquarkus.native.container-build=true` runs native-image inside the
# Mandrel builder on Docker Engine: pinned UBI 10 / JDK 25 builder, exact tag.
quarkus.native.container-runtime=docker
quarkus.native.builder-image=quay.io/quarkus/ubi10-quarkus-mandrel-builder-image:jdk-25.0.4.1
