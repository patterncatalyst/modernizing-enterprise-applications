# strangler-proxy — the Camel strangler-fig proxy fronting the monolith (r02-plan S7).
quarkus.application.name=strangler-proxy

# The proxy's own listen port. Clients (and the Newman behavior-equivalence
# suite) talk to the proxy here, never directly to the monolith, once it's
# in front of traffic.
quarkus.http.port=8888

# ── The strangler seam ──────────────────────────────────────────────────────
# strangler.review.enabled is the cutover flag for the Review bounded context
# (build-plan.md §E, step 1 of the decomposition roadmap).
#
# r02/S10 CUTOVER (permanent default, irreversible step): this now defaults to
# TRUE. Review traffic is served by examples/02-review-service; the monolith's
# Review module (controller/service/repository/entity) has been decommissioned
# (removed) — see examples/00-monolith/SMELLS.md smell #6. Before this flip,
# S7-S9 ran with the flag defaulting to false (monolith served Review) and both
# the flag-off and flag-on states were proven green against the full
# behavior-equivalence suite (see CUTOVER.md) — that reversibility window is
# now closed because the monolith side no longer exists to revert to.
# Flipping back to false today would just 404 (the monolith has nothing left
# to serve at /api/reviews/**).
strangler.review.enabled=true

# strangler.notification.enabled is the cutover flag for the Notification
# bounded context (notification-plan.md S6/S7, ch.17, DRQ-036). Mirrors the
# Review flag's shape exactly, with the same two-flag reversibility story:
# the monolith's own `notification.mode=synchronous|outbox` switch (its
# application.yml, NOT this file) is the write-side half; this is the
# read-side half. Cutover flips both together.
#
# notification-plan S7 CUTOVER (committed default, post-cutover): this now
# defaults to TRUE, mirroring how strangler.review.enabled's default was
# flipped at r02/S10. Before this flip: (1) a REVERSIBILITY-BASELINE run of
# the full behavior-equivalence suite through this proxy with the flag at its
# prior default (false) came back green (notifications served synchronously
# by the monolith); (2) the CUTOVER run (monolith NOTIFICATION_MODE=outbox +
# this flag true) came back green too, with the bounded-wait poll in the
# "Notification Context Contract" folder actually retrying before success —
# real evidence of outbox->Kafka->consumer latency, not an instant
# synchronous hit; (3) a NEGATIVE CHECK — stopping the notification-service
# process (consumer + read surface) and re-running just that folder — went
# RED (500 / connection failure), then GREEN again once the service was
# restarted, proving the assertion genuinely exercises the async pipeline and
# is not a false positive (DRQ-037; the CUTOVER.md §2 trap). See
# examples/01-strangler-proxy/CUTOVER.md for the full evidence trail.
# Unlike Review's flip, this is NOT yet the point where reversibility closes:
# the monolith's synchronous notification path and /api/notifications read
# surface are still present (decommission is notification-plan S8, not run
# here) — flipping this back to false today still reaches a working monolith
# notification surface.
strangler.notification.enabled=true

# strangler.inventory.enabled is the cutover flag for the Inventory bounded
# context's REST read surface (inventory-plan.md S9, ch.19, DRQ-045). Mirrors
# the Review/Notification flags' shape exactly: content-based routing on the
# /api/inventory path prefix. This is the READ-side half of a two-flag
# reversibility story -- the monolith's own `inventory.mode=local|remote`
# switch (its application.yml, NOT this file) is the write/reserve-side half,
# governing whether checkout reserves stock in-JVM or over gRPC against
# examples/04-inventory-service/. A real cutover flips both together.
#
# Default FALSE (inventory-plan S9; not yet cut over): /api/inventory is
# served by the monolith, same as every other still-unmigrated path. Unlike
# the Review/Notification ACL sketch at this proxy layer, this route is a
# TRANSPARENT reverse proxy, not a translating ACL -- the monolith's
# common/StockDto.java and the inventory service's StockDto.java (lifted
# unchanged) are byte-for-byte identical contracts, so there is nothing for a
# Camel message translator to do here. The REAL anti-corruption layer for the
# order->inventory seam is the gRPC proto contract (examples/00-monolith's and
# examples/04-inventory-service's inventory.proto), whose field vocabulary
# (stock_keeping_unit/unit_price_cents/on_hand_qty) genuinely differs from the
# internal sku/priceCents/quantityOnHand -- translated by the monolith's
# RemoteInventoryClient (proto->internal) and the inventory service's
# InventoryGrpcServiceImpl (internal->proto). See README.md and
# StranglerProxyRoute's class javadoc for the full writeup of where ch.16's
# InventoryAclRoute sketch actually gets realized.
strangler.inventory.enabled=false

# Fixed, operator-controlled backend targets. The route only ever picks one of
# these known, configured URIs — never a header- or request-derived value —
# which is the secure-by-default discipline for a dynamic-URI Camel route
# (build-plan.md §F.4): no attacker-controlled input can redirect the proxy
# to an arbitrary host.
strangler.monolith.base-url=http://localhost:8080
strangler.review.base-url=http://localhost:8081
strangler.notification.base-url=http://localhost:8083
strangler.inventory.base-url=http://localhost:8084
