# strangler-proxy — the Camel strangler-fig proxy fronting the monolith (r02-plan S7).
quarkus.application.name=strangler-proxy

# The proxy's own listen port. Clients (and the Newman behavior-equivalence
# suite) talk to the proxy here, never directly to the monolith, once it's
# in front of traffic.
quarkus.http.port=8888

# ── The strangler seam ──────────────────────────────────────────────────────
# strangler.review.enabled is the cutover flag for the Review bounded context
# (build-plan.md §E, step 1 of the decomposition roadmap).
#
# r02/S10 CUTOVER (permanent default, irreversible step): this now defaults to
# TRUE. Review traffic is served by examples/02-review-service; the monolith's
# Review module (controller/service/repository/entity) has been decommissioned
# (removed) — see examples/00-monolith/SMELLS.md smell #6. Before this flip,
# S7-S9 ran with the flag defaulting to false (monolith served Review) and both
# the flag-off and flag-on states were proven green against the full
# behavior-equivalence suite (see CUTOVER.md) — that reversibility window is
# now closed because the monolith side no longer exists to revert to.
# Flipping back to false today would just 404 (the monolith has nothing left
# to serve at /api/reviews/**).
strangler.review.enabled=true

# strangler.notification.enabled is the cutover flag for the Notification
# bounded context (notification-plan.md S6/S7, ch.17, DRQ-036). Mirrors the
# Review flag's shape exactly, with the same two-flag reversibility story:
# the monolith's own `notification.mode=synchronous|outbox` switch (its
# application.yml, NOT this file) is the write-side half; this is the
# read-side half. Cutover flips both together.
#
# notification-plan S7 CUTOVER (committed default, post-cutover): this now
# defaults to TRUE, mirroring how strangler.review.enabled's default was
# flipped at r02/S10. Before this flip: (1) a REVERSIBILITY-BASELINE run of
# the full behavior-equivalence suite through this proxy with the flag at its
# prior default (false) came back green (notifications served synchronously
# by the monolith); (2) the CUTOVER run (monolith NOTIFICATION_MODE=outbox +
# this flag true) came back green too, with the bounded-wait poll in the
# "Notification Context Contract" folder actually retrying before success —
# real evidence of outbox->Kafka->consumer latency, not an instant
# synchronous hit; (3) a NEGATIVE CHECK — stopping the notification-service
# process (consumer + read surface) and re-running just that folder — went
# RED (500 / connection failure), then GREEN again once the service was
# restarted, proving the assertion genuinely exercises the async pipeline and
# is not a false positive (DRQ-037; the CUTOVER.md §2 trap). See
# examples/01-strangler-proxy/CUTOVER.md for the full evidence trail.
# Unlike Review's flip, this is NOT yet the point where reversibility closes:
# the monolith's synchronous notification path and /api/notifications read
# surface are still present (decommission is notification-plan S8, not run
# here) — flipping this back to false today still reaches a working monolith
# notification surface.
strangler.notification.enabled=true

# strangler.inventory.enabled is the cutover flag for the Inventory bounded
# context's REST read surface (inventory-plan.md S9, ch.19, DRQ-045). Mirrors
# the Review/Notification flags' shape exactly: content-based routing on the
# /api/inventory path prefix. This is the READ-side half of a two-flag
# reversibility story -- the monolith's own `inventory.mode=local|remote`
# switch (its application.yml, NOT this file) is the write/reserve-side half,
# governing whether checkout reserves stock in-JVM or over gRPC against
# examples/04-inventory-service/. A real cutover flips both together.
#
# inventory-plan S10 CUTOVER (committed default, post-cutover): this now
# defaults to TRUE, mirroring how strangler.review.enabled and
# strangler.notification.enabled were flipped at their own cutover steps.
# Before this flip: (1) a REVERSIBILITY-BASELINE run of the full
# behavior-equivalence suite through this proxy with the flag at its prior
# default (false) and the monolith at its default inventory.mode=local came
# back green (85/85 assertions; /api/inventory served by the monolith); (2)
# the CUTOVER run (monolith INVENTORY_MODE=remote + this flag true) came back
# green too (73-77/73-77 assertions across several re-runs), with explicit
# before/after reads taken directly against examples/04-inventory-service
# (:8084) proving Scenario 1 decrements the SERVICE's stock (monolith's local
# inventory_items frozen throughout), Scenario 2 (out-of-stock) leaves stock
# untouched, and Scenario 3 (payment-declined) nets to zero via the
# compensating gRPC Release (DRQ-042) -- the crux of this extraction; (3) a
# POST-CUTOVER REVERSIBILITY check -- flipping both back (monolith to its
# default inventory.mode=local, this flag back to its then-default false) --
# came back green again (75/75), proving the window was still genuinely open;
# (4) a NEGATIVE CHECK -- stopping the inventory-service process (:8084 HTTP +
# :9004 gRPC) and re-running the full suite -- went RED (34/56 assertions
# failed: checkout's gRPC Reserve failed the whole placeOrder with a 500, and
# /api/inventory 500'd), then GREEN again (75/75) once the service was
# restarted, proving the assertions genuinely exercise the extracted service
# and its gRPC seam, not a false positive (DRQ-046; the CUTOVER.md paragraph 2
# trap). See examples/01-strangler-proxy/CUTOVER.md for the full evidence
# trail, including the explicit stock numbers.
#
# Unlike Review's flip, this is NOT yet the point where reversibility closes:
# the monolith's own inventory.mode committed default is UNCHANGED (still
# `local`) -- only this proxy's READ-side default has moved. Decommissioning
# the monolith's local Inventory module and flipping inventory.mode's own
# committed default to `remote`-only is inventory-plan S11, deliberately out
# of scope here. Unlike the Review/Notification ACL sketch at this proxy
# layer, this route is a TRANSPARENT reverse proxy, not a translating ACL --
# the monolith's common/StockDto.java and the inventory service's
# StockDto.java (lifted unchanged) are byte-for-byte identical contracts, so
# there is nothing for a Camel message translator to do here. The REAL
# anti-corruption layer for the order->inventory seam is the gRPC proto
# contract (examples/00-monolith's and examples/04-inventory-service's
# inventory.proto), whose field vocabulary
# (stock_keeping_unit/unit_price_cents/on_hand_qty) genuinely differs from the
# internal sku/priceCents/quantityOnHand -- translated by the monolith's
# RemoteInventoryClient (proto->internal) and the inventory service's
# InventoryGrpcServiceImpl (internal->proto). See README.md and
# StranglerProxyRoute's class javadoc for the full writeup of where ch.16's
# InventoryAclRoute sketch actually gets realized.
strangler.inventory.enabled=true

# strangler.payment.enabled is the cutover flag for the Payment bounded
# context's REST read surface (payment-plan.md S7, ch.23, DRQ-052). Mirrors
# the Review/Notification/Inventory flags' shape exactly: content-based
# routing on the /api/payments path prefix, matching the FULL incoming path
# (the same CUTOVER.md paragraph 2 lesson -- a route-relative "/payments"
# prefix would silently never match -- applied a fourth time; see
# StranglerProxyRoute's class javadoc).
#
# payment-plan S9 DECOMMISSION (committed default, now permanent,
# irreversible step): this now defaults to TRUE, mirroring how
# strangler.review.enabled was flipped at r02/S10. S8 proved the cutover
# AND its reversibility, then flipped both flags back to their pre-cutover
# defaults (false / payment.mode=synchronous) as part of demonstrating that
# reversibility was real right up to this decommission step: (1) a
# REVERSIBILITY-BASELINE run of the full behavior-equivalence suite through
# this proxy with the flag at its prior default (false) and the monolith at
# its default payment.mode=synchronous came back green (/api/payments served
# by the monolith, checkout 201/402 synchronous); (2) the CUTOVER run
# (monolith PAYMENT_MODE=choreographed + this flag true) came back green
# too, with Scenario 1 bounded-wait polling to CONFIRMED and Scenario 3
# bounded-wait polling to PAYMENT_DECLINED + inventory net-zero via the
# choreographed Release -- real evidence of the order.placed ->
# payment service -> payment.captured|declined -> order-saga-reaction
# latency, not an instant synchronous hit; (3) a NEGATIVE CHECK -- stopping
# the payment-service process and re-running Scenario 1 -- went RED (order
# stuck PENDING past the bounded wait), then GREEN again once the service
# was restarted, proving the assertion genuinely exercises the async
# pipeline (DRQ-055; the CUTOVER.md paragraph 2 trap). See
# examples/01-strangler-proxy/CUTOVER.md and
# examples/05-payment-service/CUTOVER.md for the full evidence trail.
#
# Unlike Notification's and Inventory's flips, this IS now the point where
# reversibility closes, same as Review's: payment-plan S9 has decommissioned
# the monolith's in-process payment module (payment.PaymentController/
# PaymentService/Payment/PaymentRepository) and removed the monolith's
# payment.mode=synchronous|choreographed flag entirely -- choreographed is
# the ONLY path left anywhere. Flipping this back to false today would just
# reach a monolith that 404s on /api/payments/** (see
# examples/00-monolith/SMELLS.md SMELL[ch.22], realized for payment, and
# SixContextsSmokeTest#paymentIsNoLongerServedByTheMonolith).
#
# ACL honesty (the same call this proxy already made for Inventory,
# directly above): the monolith's payment.PaymentDto and the payment
# service's PaymentDto were byte-for-byte identical records -- (id, orderId,
# amountCents, method, status, createdAt) -- field names, types, and order
# unchanged, before the monolith's copy was deleted in S9. orderId was
# already a plain Long on the wire in the monolith (only the JPA entity
# carried a cross-context @ManyToOne Order join, SMELL[ch.18]); the payment
# service's Payment entity decomposes that FK to a plain orderId value
# column (r06/S4, DRQ-052 Phase A), but that is an internal persistence-layer
# change that never reached the read contract, so the wire shape needed zero
# changes. The payment.captured/payment.declined Kafka events the two sides
# exchange are likewise authored field-for-field identical on both sides
# (DRQ-038: plain JSON, no shared code between reactors). There is therefore
# nothing for a Camel message translator to translate at this seam --
# building one would fabricate a no-op ACL for a contract that does not
# differ, the same speculative-infrastructure trap the Inventory precedent
# already ruled out. The /api/payments branch below is an honest,
# transparent reverse proxy, not a translating PaymentAclRoute. See
# StranglerProxyRoute's class javadoc and README.md for the full writeup.
strangler.payment.enabled=true

# Fixed, operator-controlled backend targets. The route only ever picks one of
# these known, configured URIs — never a header- or request-derived value —
# which is the secure-by-default discipline for a dynamic-URI Camel route
# (build-plan.md §F.4): no attacker-controlled input can redirect the proxy
# to an arbitrary host.
strangler.monolith.base-url=http://localhost:8080
strangler.review.base-url=http://localhost:8081
strangler.notification.base-url=http://localhost:8083
strangler.inventory.base-url=http://localhost:8084
strangler.payment.base-url=http://localhost:8085
