# shipping-service -- r07/ch.24 S4 (DRQ-063), Phase A.
#
# Phase A ("lift the read surface onto Quarkus") lifts the monolith's
# ShippingController/ShippingService#getById,listByOrderId/Shipment entity +
# ShipmentRepository read surface onto Quarkus via the Quarkiverse
# Spring-compatibility extensions (quarkus-spring-web/-di/-data-jpa), already
# pointed at its OWN `shipping` Postgres schema from day one. No saga/
# consumer/producer exists yet (S5 adds the Camel Saga EIP orchestrator,
# consumes payment.captured, emits shipment.dispatched/shipment.failed via
# this service's own transactional outbox).
quarkus.application.name=shipping-service
# :8088 -- NOT :8086 (compose.yaml/.env map Debezium Kafka Connect's REST API
# container :8083 to HOST :8086, which is already bound on this machine's
# podman stack); :8089 for the test port, keeping clear of every other
# service's port assignment (review 8081/8082, notification 8083/8084,
# inventory 8084/8085, payment 8085/8087, proxy 8888).
quarkus.http.port=8088
quarkus.http.test-port=8089

# %dev and %prod both point at the real podman-stack Postgres instance
# (compose.yaml/.env.example: localhost:5432, db `monolith`), scoped to this
# service's OWN `shipping` schema via currentSchema -- mirrors inventory's/
# notification's/payment's own-schema treatment, NOT review's shared-schema
# approach. Deliberately NOT set unprefixed: leaving it unset for the (test)
# profile lets Quarkus Dev Services start an ISOLATED, ephemeral
# Testcontainers Postgres for @QuarkusTest runs -- never the shared
# long-lived instance -- while still exercising this service's OWN Flyway
# migrations for real.
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=monolith
%dev.quarkus.datasource.password=monolith_dev_only
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/monolith?currentSchema=shipping
%dev.quarkus.datasource.devservices.enabled=false

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=monolith
%prod.quarkus.datasource.password=monolith_dev_only
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/monolith?currentSchema=shipping
%prod.quarkus.datasource.devservices.enabled=false

# Own-schema Flyway (schema-management strategy=none, same discipline as
# inventory-service/notification-service/payment-service): this service is
# the ONLY writer of the `shipping` schema's migration history. Flyway
# creates the `shipping` schema automatically on first run. UNLIKE inventory
# (CDC-fed backfill from an existing monolith table), shipment rows are
# created forward only -- by the future S5 saga's dispatch step -- so there
# is NO backfill migration, just an optional small demo seed (V2) to
# exercise the read surface before the saga exists. This is a DELIBERATE
# contrast to inventory/DRQ-040, mirroring payment/DRQ-052.
quarkus.flyway.schemas=shipping
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# Pin Hibernate's JDBC session timezone to UTC -- same fix every other
# service in this repo needed: the @QuarkusTest Dev Services Postgres
# container (an alpine image with a minimal zoneinfo database) rejects this
# machine's JVM default zone ID. Matches the TIMESTAMPTZ `created_at` column.
quarkus.hibernate-orm.jdbc.timezone=UTC
