# shipping-service -- r07/ch.24 S5 (DRQ-063/DRQ-059), Phase B.
#
# Phase A ("lift the read surface onto Quarkus", S4) lifted the monolith's
# ShippingController/ShippingService#getById,listByOrderId/Shipment entity +
# ShipmentRepository read surface onto Quarkus via the Quarkiverse
# Spring-compatibility extensions. Phase B (this step) removes that shim --
# the read surface now runs on Quarkus REST + Panache + plain CDI -- and
# adds the net-new ORCHESTRATED core: an InMemorySagaService-backed Camel
# Saga EIP route that consumes payment.captured, enriches the order's
# shipping address, dispatches, books the (simulated) carrier, and emits
# shipment.dispatched|shipment.failed atomically via this service's own
# transactional outbox (see MIGRATION.md).
quarkus.application.name=shipping-service
# :8088 -- NOT :8086 (compose.yaml/.env map Debezium Kafka Connect's REST API
# container :8083 to HOST :8086, which is already bound on this machine's
# compose stack); :8089 for the test port, keeping clear of every other
# service's port assignment (review 8081/8082, notification 8083/8084,
# inventory 8084/8085, payment 8085/8087, proxy 8888).
quarkus.http.port=8088
quarkus.http.test-port=8089

# %dev and %prod both point at the real compose-stack Postgres instance
# (compose.yaml/.env.example: localhost:5432, db `monolith`), scoped to this
# service's OWN `shipping` schema via currentSchema -- mirrors inventory's/
# notification's/payment's own-schema treatment, NOT review's shared-schema
# approach. Deliberately NOT set unprefixed: leaving it unset for the (test)
# profile lets Quarkus Dev Services start an ISOLATED, ephemeral
# Testcontainers Postgres for @QuarkusTest runs -- never the shared
# long-lived instance -- while still exercising this service's OWN Flyway
# migrations for real.
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=monolith
%dev.quarkus.datasource.password=monolith_dev_only
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/monolith?currentSchema=shipping
%dev.quarkus.datasource.devservices.enabled=false

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=monolith
%prod.quarkus.datasource.password=monolith_dev_only
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/monolith?currentSchema=shipping
%prod.quarkus.datasource.devservices.enabled=false

# Own-schema Flyway (schema-management strategy=none, same discipline as
# inventory-service/notification-service/payment-service): this service is
# the ONLY writer of the `shipping` schema's migration history. Flyway
# creates the `shipping` schema automatically on first run. UNLIKE inventory
# (CDC-fed backfill from an existing monolith table), shipment rows are
# created forward only -- by this step's saga's dispatch step -- so there is
# NO backfill migration (DRQ-063, contrast inventory/DRQ-040, mirrors
# payment/DRQ-052).
quarkus.flyway.schemas=shipping
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# Pin Hibernate's JDBC session timezone to UTC -- same fix every other
# service in this repo needed: the @QuarkusTest Dev Services Postgres
# container (an alpine image with a minimal zoneinfo database) rejects this
# machine's JVM default zone ID. Matches the TIMESTAMPTZ `created_at` column.
quarkus.hibernate-orm.jdbc.timezone=UTC

# -- ch.24 Phase B / S5 -- SmallRye Reactive Messaging Kafka (DRQ-063: no
# Spring original to lift, authored idiomatic-from-the-start) --
#
# Bootstrap defaults to the compose-stack broker's host listener
# (compose.yaml, localhost:9092), overridable via KAFKA_BOOTSTRAP_SERVERS --
# the same convention every other service in this repo uses.
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# payment-captured: the saga trigger (PaymentCapturedConsumer). No group.id
# override, so it defaults to quarkus.application.name ("shipping-service")
# -- a single SHARED consumer group, so across a replica set each
# payment.captured event is handed to exactly one replica (idempotency
# backstopped by ShippingService#processPaymentCaptured's dedupe-by-orderId
# check-then-act + the DB-level uq_shipments_order_id unique index, DRQ-064).
mp.messaging.incoming.payment-captured.connector=smallrye-kafka
mp.messaging.incoming.payment-captured.topic=payment.captured
mp.messaging.incoming.payment-captured.auto.offset.reset=earliest
mp.messaging.incoming.payment-captured.enable.auto.commit=false

# shipment-dispatched / shipment-failed: the outbox relay's two outgoing
# channels (ShipmentOutboxRelay) -- one Kafka topic per saga outcome
# (DRQ-058). Sent programmatically via @Channel Emitter, not @Outgoing,
# since the choice of topic is a runtime decision per outbox row.
mp.messaging.outgoing.shipment-dispatched.connector=smallrye-kafka
mp.messaging.outgoing.shipment-dispatched.topic=shipment.dispatched
mp.messaging.outgoing.shipment-failed.connector=smallrye-kafka
mp.messaging.outgoing.shipment-failed.topic=shipment.failed

# ShipmentOutboxRelay's @Scheduled poll interval -- same default cadence as
# every other outbox relay in this repo.
shipping.outbox.relay.poll-interval=2s

# -- ch.24 S5 (DRQ-059 "enrich") -- the order-service read client --
#
# The saga's enrich step fetches the order's shipping address via
# GET {order.service.base-url}/api/orders/{orderId}.
#
# order-plan.md S10 (DRQ-070, the final decommission): rewired from the
# monolith's port (:8080) to the extracted examples/07-order-service's own
# port (:8087) -- the monolith has been decommissioned (its order/* module
# deleted, examples/00-monolith/SMELLS.md) and no longer serves /api/orders
# at all, so this enrich step would 404 against the old default. This is the
# committed, permanent address now; there is no cutover flag here (shipping's
# own extraction, ch.24, already completed its own cutover in r07/S9 --
# this property only ever pointed at "whichever process currently serves
# /api/orders", and as of order-plan S10 that is permanently the order
# service, never the monolith again). OrderReadClient catches a reachability
# exception and falls back to the documented ADDRESS_UNAVAILABLE sentinel
# (never equal to the SHIP-FAIL sentinel, so a reachability problem never
# masquerades as the deterministic carrier-failure demo rule). Configurable
# via ORDER_SERVICE_BASE_URL so a different topology can still point it
# elsewhere without a code change.
order.service.base-url=${ORDER_SERVICE_BASE_URL:http://localhost:8087}
quarkus.rest-client."order-service".url=${order.service.base-url}
quarkus.rest-client."order-service".scope=jakarta.inject.Singleton
quarkus.rest-client."order-service".connect-timeout=2000
quarkus.rest-client."order-service".read-timeout=3000

# ── Native container build (DRQ-077) ─────────────────────────────────────
# `-Dquarkus.native.container-build=true` runs native-image inside the
# Mandrel builder on Docker Engine: pinned UBI 10 / JDK 25 builder, exact tag.
quarkus.native.container-runtime=docker
quarkus.native.builder-image=quay.io/quarkus/ubi10-quarkus-mandrel-builder-image:jdk-25.0.4.1

# Dev Services Postgres for %test, pinned to the compose stack's exact tag
# (DRQ-077) instead of Quarkus 3.40.1's floating postgres:18 default.
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6-alpine
