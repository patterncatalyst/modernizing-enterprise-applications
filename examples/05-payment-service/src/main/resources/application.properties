# payment-service -- r06/ch.23 S5 (DRQ-052/DRQ-053), Phase B.
#
# Phase A ("lift the read surface onto Quarkus") lifted the monolith's
# PaymentController/PaymentService/PaymentRepository/Payment read surface onto
# Quarkus via the Quarkiverse Spring-compatibility extensions (S4). Phase B
# (this step) removes that shim -- the read surface now runs on Quarkus REST +
# Panache + plain CDI -- and adds the net-new choreography core: a SmallRye
# Reactive Messaging consumer of `order.placed` that captures the payment and,
# atomically with the Payment row, writes a payment.captured/payment.declined
# row to this service's OWN transactional outbox; a @Scheduled relay then
# publishes unpublished outbox rows to Kafka (see MIGRATION.md).
quarkus.application.name=payment-service
quarkus.http.port=8085
# NOT 8086 -- compose.yaml/.env.example map the Debezium Kafka Connect REST
# API's container :8083 to HOST port 8086 (CONNECT_HOST_PORT), which is
# already bound on this machine's compose stack; 8087 avoids that collision.
quarkus.http.test-port=8087

# %dev and %prod both point at the real compose-stack Postgres instance
# (compose.yaml/.env.example: localhost:5432, db `monolith`), scoped to this
# service's OWN `payment` schema via currentSchema -- mirrors inventory's and
# notification's own-schema treatment, NOT review's shared-schema approach.
# Deliberately NOT set unprefixed: leaving it unset for the (test) profile
# lets Quarkus Dev Services start an ISOLATED, ephemeral Testcontainers
# Postgres for @QuarkusTest runs -- never the shared long-lived instance --
# while still exercising this service's OWN Flyway migrations for real.
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=monolith
%dev.quarkus.datasource.password=monolith_dev_only
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/monolith?currentSchema=payment
%dev.quarkus.datasource.devservices.enabled=false

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=monolith
%prod.quarkus.datasource.password=monolith_dev_only
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/monolith?currentSchema=payment
%prod.quarkus.datasource.devservices.enabled=false

# Own-schema Flyway (schema-management strategy=none, same discipline as
# inventory-service/notification-service): this service is the ONLY writer
# of the `payment` schema's migration history. Flyway creates the `payment`
# schema automatically on first run. UNLIKE inventory (CDC-fed backfill from
# an existing monolith table), payment rows are created forward only -- by
# the future S5 order.placed consumer -- so there is no backfill migration,
# just an optional small demo seed (V2) to exercise the read surface before
# the consumer exists.
quarkus.flyway.schemas=payment
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# Pin Hibernate's JDBC session timezone to UTC -- same fix inventory-service
# and notification-service needed: the @QuarkusTest Dev Services Postgres
# container (an alpine image with a minimal zoneinfo database) rejects this
# machine's JVM default zone ID. Matches the TIMESTAMPTZ `created_at` column.
quarkus.hibernate-orm.jdbc.timezone=UTC

# -- ch.23 Phase B / S5 -- SmallRye Reactive Messaging Kafka (DRQ-052: no
# Spring original to lift, authored idiomatic-from-the-start) --
#
# Bootstrap defaults to the compose-stack broker's host listener
# (compose.yaml, localhost:9092), overridable via KAFKA_BOOTSTRAP_SERVERS --
# the same convention notification-service/inventory-service use.
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# order-placed: the choreography trigger (OrderPlacedConsumer). No group.id
# override, so it defaults to quarkus.application.name ("payment-service") --
# a single SHARED consumer group, so across a replica set each order.placed
# event is captured by exactly one replica (idempotency backstopped by
# PaymentService#processOrderPlaced's dedupe-by-orderId + the DB-level
# uq_payments_order_id unique index, DRQ-051).
mp.messaging.incoming.order-placed.connector=smallrye-kafka
mp.messaging.incoming.order-placed.topic=order.placed
mp.messaging.incoming.order-placed.auto.offset.reset=earliest
# Reactive Messaging commits the offset itself once a message is processed
# (i.e. once the @Transactional capture+outbox-write succeeds) -- not on
# receipt.
mp.messaging.incoming.order-placed.enable.auto.commit=false

# payment-captured / payment-declined: the outbox relay's two outgoing
# channels (PaymentOutboxRelay) -- one Kafka topic per outcome (DRQ-048).
# The relay sends to these programmatically via @Channel Emitter, not an
# @Outgoing method, since the choice of channel is a runtime decision (which
# outcome this outbox row records), not a static method return type.
mp.messaging.outgoing.payment-captured.connector=smallrye-kafka
mp.messaging.outgoing.payment-captured.topic=payment.captured
mp.messaging.outgoing.payment-declined.connector=smallrye-kafka
mp.messaging.outgoing.payment-declined.topic=payment.declined

# PaymentOutboxRelay's @Scheduled poll interval -- same default cadence as
# the monolith's OutboxRelay (outbox.relay.poll-interval-ms=2000).
payment.outbox.relay.poll-interval=2s

# ── Native container build (DRQ-085) ─────────────────────────────────────
# `-Dquarkus.native.container-build=true` runs native-image inside the
# Mandrel builder on Docker Engine: pinned UBI 10 / JDK 25 builder, exact tag.
quarkus.native.container-runtime=docker
quarkus.native.builder-image=quay.io/quarkus/ubi10-quarkus-mandrel-builder-image:jdk-25.0.4.1
