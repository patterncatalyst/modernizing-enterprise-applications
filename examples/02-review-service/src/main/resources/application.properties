# review-service — ch.15 Phase A (lift onto Quarkus via Spring-compat
# extensions, DRQ-029). Equivalent in intent to the monolith's
# src/main/resources/application.yml datasource block, but pointed at the
# SAME compose-stack Postgres unconditionally (not just %prod) — this service
# does not yet own its schema (see Review.java/Customer.java/InventoryItem.java
# javadoc: true database decomposition is deferred to ch.18/19). Dev Services
# is disabled rather than relied on, since Phase A's whole point is "the SAME
# shared database, unchanged," not an isolated per-test database.
quarkus.application.name=review-service
quarkus.http.port=8081
quarkus.http.test-port=8082

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=monolith
quarkus.datasource.password=monolith_dev_only
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/monolith
quarkus.datasource.devservices.enabled=false

# The monolith (examples/00-monolith) owns and Flyway-migrates this shared
# schema; review-service only reads/writes the existing `reviews` table (plus
# the read-only `customers`/`inventory_items` projections). It intentionally
# carries NO Flyway extension/migrations of its own — it must never attempt
# to migrate a schema it does not own.
quarkus.hibernate-orm.schema-management.strategy=none

# HTTP Basic auth + an embedded realm reproducing the monolith's single demo
# user (SecurityConfig's InMemoryUserDetailsManager), so the write endpoint's
# 401/201 contract matches exactly. This REPLACES the monolith's one shared
# SecurityFilterChain with Review's own standalone config — curing SMELL[ch.15]
# (Review no longer depends on the monolith's global security wiring).
quarkus.http.auth.basic=true
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.demo-customer=demo-pass
quarkus.security.users.embedded.roles.demo-customer=CUSTOMER
