# code-ci.yml — r02 S-CI: the minimal equivalence gate in GitHub Actions
# (DRQ-030, DRQ-014). Proves, once, that the behavior-equivalence suite (the
# Newman collection captured against the monolith, tooling/newman/) can gate
# an extracted service in CI, not just on a developer's laptop.
#
# Scope discipline (r02-plan.md S-CI, DRQ-030): this job only builds and
# serves examples/02-review-service/ and runs the suite's "Review Context
# Contract" folder against it — the full Site CI / deploy-pipeline surface
# stays deferred to r08. It does NOT build or boot the Spring Boot monolith
# (examples/00-monolith/): review-service deliberately owns no Flyway
# migrations of its own (see its application.properties —
# quarkus.hibernate-orm.schema-management.strategy=none; the monolith owns
# this shared schema) and the walking skeleton's CI gate should not need to
# build a second, unrelated Maven project just to get tables. Instead this
# job applies the monolith's existing, committed V1/V2 migration SQL
# (examples/00-monolith/src/main/resources/db/migration/) directly with
# psql — the exact same DDL/seed Flyway would run, with no monolith JVM
# involved. If those files change, this job picks the change up automatically
# (no suite drift, R8).
#
# Red->green proof (acceptance criterion, r02-plan.md S-CI): this workflow
# was validated locally before being committed by deliberately breaking
# review-service's validation contract (ReviewCreate's @Max(5) on `rating`
# temporarily widened to @Max(500) so an out-of-range rating that should 400
# was instead accepted as 201) and re-running the exact newman command this
# job runs — "4e. Authenticated write with invalid rating -> 400 validation"
# failed (RED), proving the gate actually gates. The change was then
# reverted and the suite re-run GREEN before this file was committed. See
# examples/02-review-service/README.md's "CI equivalence gate" note for the
# full before/after transcript.
#
# notification-plan.md S9: a second job, `notification-equivalence-gate`,
# extends this same workflow (one file, per DRQ-030's "do not fork a new
# workflow" discipline) to cover the ASYNC notification path — monolith
# outbox -> Kafka `order.placed` -> examples/03-notification-service's
# SmallRye consumer -> its own-schema read surface -> through
# examples/01-strangler-proxy (:8888) — unlike Review (a synchronous REST
# passthrough), this gate genuinely waits on eventual consistency: the
# "Notification Context Contract" folder's DRQ-037 bounded-wait poll must
# retry before succeeding, not just hit on the first attempt, or the gate
# would be a green-only race rather than real evidence the async pipeline
# was exercised (see examples/03-notification-service/README.md's "CI
# equivalence gate" note for the full red->green transcript). The top-level
# `on.paths` filters above were widened from the original
# "db/migration/** only" scoping to the full `examples/00-monolith/**`,
# `examples/01-strangler-proxy/**`, and `examples/03-notification-service/**`
# trees to cover both jobs — GitHub Actions path filters are workflow-level,
# not per-job, so the Review job now also runs (and should stay green) on
# changes to those paths.
#
# shipping-plan.md S10 (ch.24, DRQ-056..065): a fifth job,
# `shipping-equivalence-gate`, extends this same workflow to cover the
# ORCHESTRATED-SAGA shipping extraction (examples/06-shipping-service) —
# the deliberate contrast to payment's CHOREOGRAPHED saga: a Camel Saga EIP
# coordinator consumes `payment.captured`, dispatches, books the carrier,
# and either emits `shipment.dispatched` (confirm) or compensates via
# `shipment.failed` (the order context's delegated `Release`, DRQ-060) on a
# deterministic `SHIP-FAIL`. `examples/06-shipping-service/**` was added to
# the path filters above for this job. **Cross-service cascade (learned
# from ch.23 S10b):** post-S9 decommission, checkout's terminal `CONFIRMED`
# depends on `shipment.dispatched` for EVERY checkout, not just shipping's
# own gate — so `payment-equivalence-gate` (full suite),
# `inventory-equivalence-gate` (the "Scenario 1 — Happy-Path Checkout"
# folder), and `notification-equivalence-gate` (its "Notification Context
# Contract" folder places a checkout and bounded-waits to CONFIRMED at
# step 5b) all now also start the shipping service and wait for it, or their
# bounded-waits go RED on every future run, independent of any real
# regression. Only the original `equivalence-gate` (Review Context Contract
# folder) never touches the checkout-confirm path, so it is unaffected and
# untouched.

name: Code CI

on:
  push:
    branches: ["**"]
    paths:
      - "examples/00-monolith/**"
      - "examples/01-strangler-proxy/**"
      - "examples/02-review-service/**"
      - "examples/03-notification-service/**"
      - "examples/04-inventory-service/**"
      - "examples/05-payment-service/**"
      - "examples/06-shipping-service/**"
      - "tooling/newman/**"
      - ".github/workflows/code-ci.yml"
  pull_request:
    paths:
      - "examples/00-monolith/**"
      - "examples/01-strangler-proxy/**"
      - "examples/02-review-service/**"
      - "examples/03-notification-service/**"
      - "examples/04-inventory-service/**"
      - "examples/05-payment-service/**"
      - "examples/06-shipping-service/**"
      - "tooling/newman/**"
      - ".github/workflows/code-ci.yml"
  workflow_dispatch:

jobs:
  equivalence-gate:
    name: equivalence-gate
    runs-on: ubuntu-latest

    # Postgres, pinned to the same tag/creds the project's podman stack and
    # review-service's application.properties use (.env: POSTGRES_IMAGE_TAG,
    # POSTGRES_DB/_USER/_PASSWORD) so this is the SAME contract, not a
    # CI-only substitute.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: monolith
          POSTGRES_USER: monolith
          POSTGRES_PASSWORD: monolith_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monolith -d monolith"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up JDK 25 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node (for newman)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install newman
        run: npm install -g newman

      - name: Apply the monolith's schema + seed data to Postgres
        # review-service reads/writes the monolith's existing `reviews` table
        # plus read-only projections of `customers`/`inventory_items` — it
        # does not own or run these migrations itself (schema-management
        # strategy=none). Apply the committed SQL directly; psql is preinstalled
        # on the ubuntu-latest runner image.
        run: |
          set -euo pipefail
          PGPASSWORD=monolith_dev_only psql -h localhost -U monolith -d monolith \
            -f examples/00-monolith/src/main/resources/db/migration/V1__init_schema.sql
          PGPASSWORD=monolith_dev_only psql -h localhost -U monolith -d monolith \
            -f examples/00-monolith/src/main/resources/db/migration/V2__seed_data.sql

      - name: Build the Review service
        working-directory: examples/02-review-service
        run: ./mvnw -q -DskipTests package

      - name: Start the Review service
        working-directory: examples/02-review-service
        run: |
          nohup java -jar target/quarkus-app/quarkus-run.jar > quarkus.log 2>&1 &
          echo $! > quarkus.pid

      - name: Wait for the Review service to be ready on :8081
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8081/api/reviews?sku=SKU-WIDGET-001" > /dev/null; then
              echo "Review service is up."
              exit 0
            fi
            sleep 2
          done
          echo "Review service did not become ready in time." >&2
          cat examples/02-review-service/quarkus.log || true
          exit 1

      - name: Run the behavior-equivalence suite (Review Context Contract) — the equivalence gate
        # This is the gate: a non-zero newman exit code fails the job.
        run: |
          newman run tooling/newman/mea.postman_collection.json \
            --folder "Review Context Contract" \
            --env-var baseUrl=http://localhost:8081 \
            --env-var reviewUsername=demo-customer \
            --env-var reviewPassword=demo-pass

      - name: Dump Review service log on failure
        if: failure()
        run: cat examples/02-review-service/quarkus.log || true

      - name: Stop the Review service
        if: always()
        run: |
          if [ -f examples/02-review-service/quarkus.pid ]; then
            kill "$(cat examples/02-review-service/quarkus.pid)" || true
          fi

  # notification-equivalence-gate (notification-plan.md S9) — the ASYNC
  # sibling of equivalence-gate above. Review is a synchronous REST
  # passthrough with no messaging involved; Notification is the first
  # context whose equivalence gate must stand up Kafka and genuinely wait on
  # eventual consistency: monolith checkout -> transactional outbox ->
  # OutboxRelay (@Scheduled poll) -> Kafka `order.placed` -> this service's
  # SmallRye @Incoming consumer -> its own `notification` Postgres schema ->
  # GET /api/notifications, all exercised THROUGH the strangler proxy
  # (examples/01-strangler-proxy, :8888) exactly as a real client would see
  # it. The gate is the "Notification Context Contract" folder's DRQ-037
  # bounded-wait poll (tooling/newman/mea.postman_collection.json) — it is
  # written to pass against either a synchronous or an async backend
  # unchanged, so running it here with NO collection edits is itself part of
  # the equivalence proof (R8, no suite drift).
  #
  # POST-S11 ADDENDUM (inventory-plan.md S11): checkout's stock reservation is
  # no longer in-JVM — OrderService reserves stock via a synchronous gRPC call
  # (RemoteInventoryClient -> CheckStock/Reserve, :9004) to
  # examples/04-inventory-service. There is no INVENTORY_MODE flag left to fall
  # back to local inventory; the monolith is unconditionally a gRPC client post-
  # S11. This job therefore also builds and starts the Inventory service (same
  # :8084 REST / :9004 gRPC, self-seeding Flyway, as inventory-equivalence-gate
  # below) before the monolith, and points the monolith at it via
  # INVENTORY_GRPC_HOST/PORT — otherwise "place order" fails checkout's gRPC
  # Reserve with io.grpc.StatusRuntimeException: UNAVAILABLE and the monolith
  # returns HTTP 500, which was masking the async notification path this job
  # exists to gate.
  #
  # S10b FIX (cross-service CI cascade, same shape as the INVENTORY_GRPC addendum
  # above): after payment-plan S9 decommissioned the monolith's in-process
  # payment, checkout became choreographed-only — POST /api/orders returns
  # 202/PENDING, and an order only reaches CONFIRMED/PAYMENT_DECLINED once
  # examples/05-payment-service consumes order.placed and emits
  # payment.captured/payment.declined, which the monolith's OrderSagaListener
  # reacts to. This job's "Notification Context Contract" folder places a
  # checkout (5a) and bounded-waits it to CONFIRMED (5b) — without the payment
  # service running, that order stayed PENDING forever and the bounded wait
  # timed out. This job now also builds/starts/readiness-gates the payment
  # service and waits for the monolith's order-saga consumer group to stabilize
  # before running newman, mirroring payment-equivalence-gate's proven template.
  notification-equivalence-gate:
    name: notification-equivalence-gate
    runs-on: ubuntu-latest

    # Postgres (same image tag/creds the podman stack uses, matching
    # equivalence-gate above) PLUS a single-broker KRaft-mode Kafka,
    # pinned to the same apache/kafka tag compose.yaml/.env.example use
    # (KAFKA_IMAGE_TAG=3.8.0) — the SAME contract as local dev, not a
    # CI-only substitute. Both are GitHub Actions service containers with
    # health checks, so the job's steps don't start until each is ready.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: monolith
          POSTGRES_USER: monolith
          POSTGRES_PASSWORD: monolith_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monolith -d monolith"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      # Single-node KRaft (broker+controller combined role, no ZooKeeper),
      # mirroring compose.yaml's kafka service. Trimmed for the GitHub
      # Actions service-container network model: steps run directly on the
      # runner VM (not inside a compose network), so there is no "kafka"
      # container hostname to advertise — every listener below resolves via
      # the runner's own localhost, the same way service containers already
      # make Postgres reachable at localhost:5432 above.
      kafka:
        image: docker.io/apache/kafka:3.8.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          KAFKA_NUM_PARTITIONS: 3
          KAFKA_DEFAULT_REPLICATION_FACTOR: 1
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
          --health-start-period 30s

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up JDK 25 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node (for newman)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install newman
        run: npm install -g newman

      # No psql pre-apply here: unlike the Review gate (where review-service is
      # not the migrator), this job RUNS the monolith, whose own Flyway migrates
      # the `public` schema (V1-V3, incl. V3's outbox) on boot against the fresh
      # Postgres service container. The notification-service likewise migrates its
      # own `notification` schema on boot. Pre-applying the DDL with psql would
      # leave a non-empty schema with no flyway_schema_history, and the monolith's
      # Flyway would then refuse to start ("Found non-empty schema(s) ... but no
      # schema history table"). Let each service be its own migrator.
      - name: Build the monolith
        run: mvn -q -DskipTests -f examples/00-monolith package

      - name: Build the Notification service
        working-directory: examples/03-notification-service
        run: ./mvnw -q -DskipTests package

      - name: Build the Inventory service
        working-directory: examples/04-inventory-service
        run: ./mvnw -q -DskipTests package

      - name: Build the Payment service
        working-directory: examples/05-payment-service
        run: ./mvnw -q -DskipTests package

      # shipping-plan.md S10 cascade fix: checkout's terminal CONFIRMED now
      # depends on the shipping service's orchestrated saga (see the
      # top-of-file header note), so this gate's checkout-and-wait-to-
      # CONFIRMED (Notification Context Contract 5a/5b) needs it built too.
      - name: Build the Shipping service
        working-directory: examples/06-shipping-service
        run: ./mvnw -q -DskipTests package

      - name: Build the strangler proxy
        working-directory: examples/01-strangler-proxy
        run: ./mvnw -q -DskipTests package

      - name: Start the Inventory service (REST :8084 + gRPC :9004) — seeds itself via Flyway
        # No env overrides needed: this service's application.properties
        # %prod datasource (localhost:5432/monolith, user/password
        # monolith/monolith_dev_only) already matches the Postgres service
        # container above, and its gRPC/HTTP ports are fixed in that same
        # file. V2__seed_inventory.sql runs on boot
        # (quarkus.flyway.migrate-at-start=true), populating the canonical
        # 3-SKU catalog. Started before the monolith (mirroring
        # inventory-equivalence-gate below) since the monolith's checkout path
        # now reserves stock over gRPC and has no in-JVM fallback (S11).
        working-directory: examples/04-inventory-service
        run: |
          nohup java -jar target/quarkus-app/quarkus-run.jar > quarkus.log 2>&1 &
          echo $! > quarkus.pid

      - name: Start the Payment service (order.placed consumer + own outbox) on :8085
        # S10b FIX: checkout is choreographed-only post-S9 — an order only
        # reaches CONFIRMED/PAYMENT_DECLINED once this service consumes
        # order.placed and emits payment.captured/payment.declined, which the
        # monolith's OrderSagaListener reacts to. This job's "Notification
        # Context Contract" folder (5a/5b) places a checkout and bounded-waits
        # it to CONFIRMED, so without this service that order stays PENDING
        # forever and the bounded-wait times out. Started before the monolith,
        # same ordering payment-equivalence-gate uses, so the consumer is
        # already subscribed before any order.placed is produced. No datasource
        # env overrides needed (its %prod profile already points at
        # localhost:5432/monolith?currentSchema=payment) — only the Kafka
        # bootstrap, same convention as inventory/notification services.
        working-directory: examples/05-payment-service
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          nohup java -jar target/quarkus-app/quarkus-run.jar > quarkus.log 2>&1 &
          echo $! > quarkus.pid

      - name: Start the Shipping service (payment.captured saga consumer + own outbox) on :8088
        # shipping-plan.md S10 cascade fix: post-S9, orchestrated is the ONLY
        # shipping path — CONFIRMED is reached via this service's Camel Saga
        # EIP coordinator emitting shipment.dispatched, not an in-process
        # dispatch. No SHIPPING_MODE override (that flag is gone, S9) and no
        # ORDER_SERVICE_BASE_URL override (its default, http://localhost:8080,
        # already matches the monolith below). Started before the monolith,
        # same discipline as the Payment service above, so the saga consumer
        # is already subscribed before any payment.captured is produced.
        working-directory: examples/06-shipping-service
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          nohup java -jar target/quarkus-app/quarkus-run.jar > quarkus.log 2>&1 &
          echo $! > quarkus.pid

      - name: Start the monolith (outbox write path + Kafka producer/consumer + gRPC inventory client) on :8080
        # No PAYMENT_MODE override: payment-plan S9 removed that flag entirely —
        # choreographed is the only checkout path left. This is also the
        # monolith's order-saga Kafka CONSUMER (OrderSagaListener reacting to
        # payment.captured/payment.declined), not just an outbox producer.
        working-directory: examples/00-monolith
        env:
          SPRING_DATASOURCE_PASSWORD: monolith_dev_only
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          INVENTORY_GRPC_HOST: localhost
          INVENTORY_GRPC_PORT: "9004"
        run: |
          nohup java -jar target/monolith.jar > monolith.log 2>&1 &
          echo $! > monolith.pid

      - name: Start the Notification service (Kafka consumer) on :8083
        working-directory: examples/03-notification-service
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          nohup java -jar target/quarkus-app/quarkus-run.jar > quarkus.log 2>&1 &
          echo $! > quarkus.pid

      - name: Start the strangler proxy (notification cutover flag on) on :8888
        # strangler.notification.enabled defaults to true in the proxy's
        # committed application.properties (notification-plan.md S7 cutover)
        # — no override needed here, the routing /api/notifications ->
        # :8083 is already the proxy's shipped default. strangler.shipping.enabled
        # also defaults to true (shipping-plan S9) — no override needed either.
        working-directory: examples/01-strangler-proxy
        run: |
          nohup java -jar target/quarkus-app/quarkus-run.jar > quarkus.log 2>&1 &
          echo $! > quarkus.pid

      - name: Wait for the Inventory service to be ready on :8084
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8084/api/inventory" > /dev/null; then
              echo "Inventory service is up."
              exit 0
            fi
            sleep 2
          done
          echo "Inventory service did not become ready in time." >&2
          cat examples/04-inventory-service/quarkus.log || true
          exit 1

      - name: Wait for the Payment service to be ready on :8085
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8085/api/payments?orderId=1" > /dev/null; then
              echo "Payment service is up."
              exit 0
            fi
            sleep 2
          done
          echo "Payment service did not become ready in time." >&2
          cat examples/05-payment-service/quarkus.log || true
          exit 1

      - name: Wait for the Shipping service to be ready on :8088
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8088/api/shipments?orderId=1" > /dev/null; then
              echo "Shipping service is up."
              exit 0
            fi
            sleep 2
          done
          echo "Shipping service did not become ready in time." >&2
          cat examples/06-shipping-service/quarkus.log || true
          exit 1

      - name: Wait for the Shipping service's payment.captured saga consumer to connect
        # The shipping service's Kafka client (SmallRye Reactive Messaging,
        # newer KIP-848 consumer-group protocol) does not emit a one-line
        # INFO "partitions assigned" log the way Spring Kafka does for the
        # monolith below (confirmed by hand: forcing DEBUG on
        # org.apache.kafka/io.smallrye.reactive.messaging.kafka produces no
        # equivalent single-line signal for this client). The most specific
        # available signal is this connector's own startup confirmation line,
        # which precedes the HTTP listener coming up — followed by a short,
        # fixed settle buffer for the broker-side group-coordinator handshake
        # (an honest, documented approximation, not a precise rebalance
        # signal).
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if grep -q "belongs to the 'shipping-service' consumer group" examples/06-shipping-service/quarkus.log 2>/dev/null; then
              echo "shipping-service payment.captured consumer connected."
              break
            fi
            sleep 2
          done
          if ! grep -q "belongs to the 'shipping-service' consumer group" examples/06-shipping-service/quarkus.log 2>/dev/null; then
            echo "shipping-service payment.captured consumer did not connect in time." >&2
            cat examples/06-shipping-service/quarkus.log || true
            exit 1
          fi
          sleep 5

      - name: Wait for the monolith to be ready on :8080
        # NOTE: the monolith's /api/inventory was removed at inventory-plan S11
        # (inventory now extracted; checkout reserves over gRPC against the
        # Inventory service started above). Probe /api/orders (permitAll,
        # seeded) which the monolith still serves.
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8080/api/orders" > /dev/null; then
              echo "Monolith is up."
              exit 0
            fi
            sleep 2
          done
          echo "Monolith did not become ready in time." >&2
          cat examples/00-monolith/monolith.log || true
          exit 1

      - name: Wait for the monolith's order-saga Kafka consumer group to stabilize
        # Load-bearing, not cosmetic (S10b FIX, mirroring payment-equivalence-gate):
        # a freshly-started consumer group can take up to its session-timeout
        # window to be assigned partitions, independent of the HTTP health check
        # above being green. Without this wait, the Notification Context
        # Contract's 5a/5b bounded-wait-to-CONFIRMED can race the rebalance.
        # shipping-plan.md S10: OrderSagaListener grew from 2 to 4
        # @KafkaListener methods at r07/S6 (payment.captured, payment.declined,
        # shipment.dispatched, shipment.failed), all in the same
        # monolith-order-saga consumer group — so this wait now requires ALL
        # FOUR listener containers to log "partitions assigned" (not just two)
        # before running the suite, or a result in the next step is a
        # rebalance artifact rather than trustworthy evidence.
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            count=$(grep -c "monolith-order-saga: partitions assigned" examples/00-monolith/monolith.log || true)
            if [ "${count:-0}" -ge 4 ]; then
              echo "monolith-order-saga consumer group stabilized (all four listeners assigned)."
              exit 0
            fi
            sleep 2
          done
          echo "monolith-order-saga consumer group did not stabilize in time." >&2
          cat examples/00-monolith/monolith.log || true
          exit 1

      - name: Wait for the Notification service to be ready on :8083
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8083/api/notifications?customerId=1" > /dev/null; then
              echo "Notification service is up."
              exit 0
            fi
            sleep 2
          done
          echo "Notification service did not become ready in time." >&2
          cat examples/03-notification-service/quarkus.log || true
          exit 1

      - name: Wait for the strangler proxy to be ready on :8888
        # Probe /api/orders (routes through the proxy to the monolith). This
        # job's assertions are the Notification folder only; /api/orders is
        # sufficient to confirm the proxy itself is serving.
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8888/api/orders" > /dev/null; then
              echo "Strangler proxy is up."
              exit 0
            fi
            sleep 2
          done
          echo "Strangler proxy did not become ready in time." >&2
          cat examples/01-strangler-proxy/quarkus.log || true
          exit 1

      - name: Run the behavior-equivalence suite (Notification Context Contract) — the equivalence gate
        # THE GATE: the async path (outbox -> Kafka -> consumer) exercised
        # end-to-end through the proxy. A non-zero newman exit code fails the
        # job. The DRQ-037 bounded-wait poll (up to 10 x 500ms) absorbs the
        # relay's ~2s poll-interval latency — no sleep/delay is added here,
        # the collection itself owns the wait.
        run: |
          newman run tooling/newman/mea.postman_collection.json \
            --folder "Notification Context Contract" \
            --env-var baseUrl=http://localhost:8888

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "::group::inventory-service quarkus.log"
          cat examples/04-inventory-service/quarkus.log || true
          echo "::endgroup::"
          echo "::group::payment-service quarkus.log"
          cat examples/05-payment-service/quarkus.log || true
          echo "::endgroup::"
          echo "::group::shipping-service quarkus.log"
          cat examples/06-shipping-service/quarkus.log || true
          echo "::endgroup::"
          echo "::group::monolith.log"
          cat examples/00-monolith/monolith.log || true
          echo "::endgroup::"
          echo "::group::notification-service quarkus.log"
          cat examples/03-notification-service/quarkus.log || true
          echo "::endgroup::"
          echo "::group::strangler-proxy quarkus.log"
          cat examples/01-strangler-proxy/quarkus.log || true
          echo "::endgroup::"

      - name: Stop the services
        if: always()
        run: |
          if [ -f examples/04-inventory-service/quarkus.pid ]; then
            kill "$(cat examples/04-inventory-service/quarkus.pid)" || true
          fi
          if [ -f examples/05-payment-service/quarkus.pid ]; then
            kill "$(cat examples/05-payment-service/quarkus.pid)" || true
          fi
          if [ -f examples/06-shipping-service/quarkus.pid ]; then
            kill "$(cat examples/06-shipping-service/quarkus.pid)" || true
          fi
          if [ -f examples/00-monolith/monolith.pid ]; then
            kill "$(cat examples/00-monolith/monolith.pid)" || true
          fi
          if [ -f examples/03-notification-service/quarkus.pid ]; then
            kill "$(cat examples/03-notification-service/quarkus.pid)" || true
          fi
          if [ -f examples/01-strangler-proxy/quarkus.pid ]; then
            kill "$(cat examples/01-strangler-proxy/quarkus.pid)" || true
          fi

  # inventory-equivalence-gate (inventory-plan.md S12) — the gRPC sibling of
  # equivalence-gate (Review, synchronous REST passthrough) and
  # notification-equivalence-gate (async outbox->Kafka) above. Covers the
  # inventory extraction (examples/04-inventory-service): a synchronous gRPC
  # read/reserve/release hot path (CheckStock/Reserve/Release/GetStock, :9004)
  # fronted by a REST read surface (:8084) that the strangler proxy routes
  # /api/inventory to (strangler.inventory.enabled=true, the committed
  # default since inventory-plan S10's cutover).
  #
  # CDC IS RETIRED, DELIBERATELY NOT STOOD UP HERE (inventory-plan.md S11):
  # the monolith's in-JVM inventory module (and the inventory.mode flag) was
  # decommissioned at S11 — the monolith no longer writes `inventory_items`,
  # so there is no upstream WAL for a Debezium connector to tail, and no
  # Kafka Connect service is started in this job. examples/04-inventory-service
  # now owns its data end-to-end via its own committed Flyway migration
  # (V2__seed_inventory.sql, idempotent ON CONFLICT DO NOTHING seed of the
  # same canonical 3 SKUs examples/00-monolith's V2__seed_data.sql seeds) —
  # this is itself the "owns its data" piece of S12, not just a CI change.
  # Kafka is still started below because the monolith's OutboxRelay
  # (spring-kafka producer) needs a reachable broker to boot cleanly, mirroring
  # notification-equivalence-gate's reasoning above — this job does not assert
  # anything about the async notification pipeline, only that the monolith
  # starts clean with it present.
  #
  # THE GATE: this job runs the full set of inventory-relevant folders from
  # the SAME, unedited Newman collection (R8, no suite drift) through the
  # proxy — Smoke (asserts the seeded SKUs are visible), Scenario 1
  # (happy-path stock decrement), Scenario 2 (out-of-stock, 409, stock
  # untouched), Scenario 3 (payment-declined — the cross-seam compensating
  # gRPC Release, DRQ-042, the single most dangerous regression in this
  # extraction per inventory-plan.md H1), and Inventory Context Contract (the
  # routed /api/inventory read surface). A non-zero Newman exit fails the job.
  #
  # Red->green proof (acceptance criterion, inventory-plan.md S12): this job
  # was validated locally before being committed by temporarily disabling the
  # monolith's compensating Release call in OrderService#placeOrder's catch
  # block (compensateRemoteReservations(remoteReservations) commented out) so
  # a declined payment left stock decremented — re-running the exact newman
  # command this job runs failed "3c. Inventory is NOT left decremented after
  # the decline" (RED), proving the gate genuinely catches a missing
  # compensation. The change was then reverted and the suite re-run GREEN
  # before this file was committed. See
  # examples/04-inventory-service/README.md's "CI equivalence gate" note (if
  # present) or this job's own history for the full before/after transcript.
  #
  # S10b FIX (cross-service CI cascade): after payment-plan S9 decommissioned
  # the monolith's in-process payment, checkout became choreographed-only —
  # POST /api/orders returns 202/PENDING, and an order only reaches
  # CONFIRMED/PAYMENT_DECLINED once examples/05-payment-service consumes
  # order.placed and emits payment.captured/payment.declined, which the
  # monolith's OrderSagaListener reacts to. Scenario 1 and Scenario 3 above
  # both bounded-wait a checkout to one of those terminal states — without the
  # payment service running, those orders stayed PENDING forever and the
  # bounded waits timed out (real CI failure: "order 2 status ... expected
  # 'PENDING' to deeply equal 'CONFIRMED'"). Kafka is therefore now genuinely
  # load-bearing in this job, not just "present so the outbox producer boots
  # clean" as the service-container comment below originally said — this job
  # now also builds/starts/readiness-gates the payment service and waits for
  # the monolith's order-saga consumer group to stabilize before running
  # newman, mirroring payment-equivalence-gate's proven template. Scenario 2
  # (out-of-stock) does not need this: the order is rejected with 409 before
  # a checkout is ever placed, so there is no terminal-status bounded-wait to
  # race.
  inventory-equivalence-gate:
    name: inventory-equivalence-gate
    runs-on: ubuntu-latest

    # Postgres (same image tag/creds the podman stack and the other gates
    # use) PLUS Kafka (same apache/kafka:3.8.0 tag, pinned in
    # .env.example's KAFKA_IMAGE_TAG). Kafka is genuinely load-bearing here
    # (S10b FIX) — it is no longer just "present so the outbox producer boots
    # cleanly": Scenario 1 and Scenario 3's checkout-driven bounded-waits
    # depend on the real order.placed -> payment-service ->
    # payment.captured/payment.declined -> monolith OrderSagaListener
    # round-trip (see header note above). No Kafka Connect / Debezium service
    # here — CDC is retired (see header note above); the inventory service
    # seeds itself via its own Flyway migration instead.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: monolith
          POSTGRES_USER: monolith
          POSTGRES_PASSWORD: monolith_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monolith -d monolith"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      kafka:
        image: docker.io/apache/kafka:3.8.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          KAFKA_NUM_PARTITIONS: 3
          KAFKA_DEFAULT_REPLICATION_FACTOR: 1
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
          --health-start-period 30s

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up JDK 25 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node (for newman)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install newman
        run: npm install -g newman

      # No psql pre-apply: each service runs its OWN Flyway migrations on
      # boot against the fresh Postgres service container — the monolith
      # migrates `public` (V1-V4), examples/04-inventory-service migrates its
      # own `inventory` schema (V1 create + V2 seed). Pre-applying DDL with
      # psql would leave a non-empty schema with no flyway_schema_history and
      # make either service's own Flyway refuse to start.
      - name: Build the monolith
        run: mvn -q -DskipTests -f examples/00-monolith package

      - name: Build the Inventory service
        working-directory: examples/04-inventory-service
        run: ./mvnw -q -DskipTests package

      - name: Build the Payment service
        working-directory: examples/05-payment-service
        run: ./mvnw -q -DskipTests package

      # shipping-plan.md S10 cascade fix: this job's own "Scenario 1 —
      # Happy-Path Checkout" folder bounded-waits to CONFIRMED, which post-S9
      # depends on the shipping service's orchestrated saga (see the
      # top-of-file header note).
      - name: Build the Shipping service
        working-directory: examples/06-shipping-service
        run: ./mvnw -q -DskipTests package

      - name: Build the strangler proxy
        working-directory: examples/01-strangler-proxy
        run: ./mvnw -q -DskipTests package

      - name: Start the Inventory service (REST :8084 + gRPC :9004) — seeds itself via Flyway
        # No env overrides needed: this service's application.properties
        # %prod datasource (localhost:5432/monolith, user/password
        # monolith/monolith_dev_only) already matches the Postgres service
        # container above, and its gRPC/HTTP ports are fixed in that same
        # file. V2__seed_inventory.sql runs on boot (quarkus.flyway.migrate-at-start=true),
        # populating the canonical 3-SKU catalog with no CDC involved.
        working-directory: examples/04-inventory-service
        run: |
          nohup java -jar target/quarkus-app/quarkus-run.jar > quarkus.log 2>&1 &
          echo $! > quarkus.pid

      - name: Start the Payment service (order.placed consumer + own outbox) on :8085
        # S10b FIX: checkout is choreographed-only post-S9 — an order only
        # reaches CONFIRMED/PAYMENT_DECLINED once this service consumes
        # order.placed and emits payment.captured/payment.declined, which the
        # monolith's OrderSagaListener reacts to. This job's Scenario 1
        # (happy-path) and Scenario 3 (payment-declined, incl. the
        # compensating gRPC Release, DRQ-042) both bounded-wait a checkout to
        # a terminal status, so without this service those orders stay
        # PENDING forever and the bounded waits time out. Started before the
        # monolith, same ordering payment-equivalence-gate uses, so the
        # consumer is already subscribed before any order.placed is produced.
        # No datasource env overrides needed (its %prod profile already points
        # at localhost:5432/monolith?currentSchema=payment) — only the Kafka
        # bootstrap, same convention as the Inventory service above.
        working-directory: examples/05-payment-service
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          nohup java -jar target/quarkus-app/quarkus-run.jar > quarkus.log 2>&1 &
          echo $! > quarkus.pid

      - name: Start the Shipping service (payment.captured saga consumer + own outbox) on :8088
        # shipping-plan.md S10 cascade fix: post-S9, orchestrated is the ONLY
        # shipping path — Scenario 1's CONFIRMED is reached via this
        # service's Camel Saga EIP coordinator emitting shipment.dispatched,
        # not an in-process dispatch. No SHIPPING_MODE override (that flag is
        # gone, S9) and no ORDER_SERVICE_BASE_URL override (its default,
        # http://localhost:8080, already matches the monolith below).
        # Started before the monolith, same discipline as the Payment service
        # above, so the saga consumer is already subscribed before any
        # payment.captured is produced.
        working-directory: examples/06-shipping-service
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          nohup java -jar target/quarkus-app/quarkus-run.jar > quarkus.log 2>&1 &
          echo $! > quarkus.pid

      - name: Start the monolith (gRPC Reserve/Release client + outbox producer/order-saga consumer) on :8080
        # No PAYMENT_MODE override: payment-plan S9 removed that flag entirely —
        # choreographed is the only checkout path left. This is also the
        # monolith's order-saga Kafka CONSUMER (OrderSagaListener reacting to
        # payment.captured/payment.declined), not just an outbox producer.
        working-directory: examples/00-monolith
        env:
          SPRING_DATASOURCE_PASSWORD: monolith_dev_only
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          INVENTORY_GRPC_HOST: localhost
          INVENTORY_GRPC_PORT: "9004"
        run: |
          nohup java -jar target/monolith.jar > monolith.log 2>&1 &
          echo $! > monolith.pid

      - name: Start the strangler proxy (inventory cutover flag committed-true) on :8888
        # strangler.inventory.enabled defaults to true in the proxy's
        # committed application.properties (inventory-plan.md S10 cutover) —
        # no override needed, /api/inventory already routes to :8084 by
        # default. strangler.shipping.enabled also defaults to true
        # (shipping-plan S9) — no override needed either.
        working-directory: examples/01-strangler-proxy
        run: |
          nohup java -jar target/quarkus-app/quarkus-run.jar > quarkus.log 2>&1 &
          echo $! > quarkus.pid

      - name: Wait for the Inventory service to be ready on :8084
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8084/api/inventory" > /dev/null; then
              echo "Inventory service is up."
              exit 0
            fi
            sleep 2
          done
          echo "Inventory service did not become ready in time." >&2
          cat examples/04-inventory-service/quarkus.log || true
          exit 1

      - name: Wait for the Payment service to be ready on :8085
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8085/api/payments?orderId=1" > /dev/null; then
              echo "Payment service is up."
              exit 0
            fi
            sleep 2
          done
          echo "Payment service did not become ready in time." >&2
          cat examples/05-payment-service/quarkus.log || true
          exit 1

      - name: Wait for the Shipping service to be ready on :8088
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8088/api/shipments?orderId=1" > /dev/null; then
              echo "Shipping service is up."
              exit 0
            fi
            sleep 2
          done
          echo "Shipping service did not become ready in time." >&2
          cat examples/06-shipping-service/quarkus.log || true
          exit 1

      - name: Wait for the Shipping service's payment.captured saga consumer to connect
        # See shipping-equivalence-gate's identical step below for why this
        # greps a connector-startup log line plus a short settle buffer
        # rather than a partitions-assigned line (the newer KIP-848 Kafka
        # consumer protocol this client uses does not emit the Spring-Kafka-
        # style one-line INFO signal the monolith's wait below relies on).
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if grep -q "belongs to the 'shipping-service' consumer group" examples/06-shipping-service/quarkus.log 2>/dev/null; then
              echo "shipping-service payment.captured consumer connected."
              break
            fi
            sleep 2
          done
          if ! grep -q "belongs to the 'shipping-service' consumer group" examples/06-shipping-service/quarkus.log 2>/dev/null; then
            echo "shipping-service payment.captured consumer did not connect in time." >&2
            cat examples/06-shipping-service/quarkus.log || true
            exit 1
          fi
          sleep 5

      - name: Wait for the monolith to be ready on :8080
        # NOTE: the monolith's own /api/inventory was removed at S11
        # (decommission) — it now 404s by design (RemoteInventoryClient is
        # the only inventory path, over gRPC). /api/orders (permitAll,
        # seeded with order #1 by V2__seed_data.sql) is the readiness probe
        # instead.
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8080/api/orders" > /dev/null; then
              echo "Monolith is up."
              exit 0
            fi
            sleep 2
          done
          echo "Monolith did not become ready in time." >&2
          cat examples/00-monolith/monolith.log || true
          exit 1

      - name: Wait for the monolith's order-saga Kafka consumer group to stabilize
        # Load-bearing, not cosmetic (S10b FIX, mirroring payment-equivalence-gate):
        # a freshly-started consumer group can take up to its session-timeout
        # window to be assigned partitions, independent of the HTTP health check
        # above being green. Without this wait, Scenario 1's bounded-wait-to-
        # CONFIRMED and Scenario 3's bounded-wait-to-PAYMENT_DECLINED can race
        # the rebalance. shipping-plan.md S10: OrderSagaListener grew from 2
        # to 4 @KafkaListener methods at r07/S6 (payment.captured,
        # payment.declined, shipment.dispatched, shipment.failed), all in the
        # same monolith-order-saga consumer group — so this wait now requires
        # ALL FOUR listener containers to log "partitions assigned" (not just
        # two) before running the suite, or a result in the next step is a
        # rebalance artifact rather than trustworthy evidence.
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            count=$(grep -c "monolith-order-saga: partitions assigned" examples/00-monolith/monolith.log || true)
            if [ "${count:-0}" -ge 4 ]; then
              echo "monolith-order-saga consumer group stabilized (all four listeners assigned)."
              exit 0
            fi
            sleep 2
          done
          echo "monolith-order-saga consumer group did not stabilize in time." >&2
          cat examples/00-monolith/monolith.log || true
          exit 1

      - name: Wait for the strangler proxy to be ready on :8888
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8888/api/inventory" > /dev/null; then
              echo "Strangler proxy is up."
              exit 0
            fi
            sleep 2
          done
          echo "Strangler proxy did not become ready in time." >&2
          cat examples/01-strangler-proxy/quarkus.log || true
          exit 1

      - name: Run the behavior-equivalence suite (inventory-relevant folders) — the equivalence gate
        # THE GATE: Smoke + Scenario 1/2/3 (the load-bearing cross-seam
        # inventory-mutation checks, incl. Scenario 3's compensating gRPC
        # Release on a payment decline, DRQ-042) + Inventory Context Contract
        # (the routed /api/inventory read surface), all through the proxy on
        # :8888, from the SAME unedited collection the other gates use. A
        # non-zero newman exit code fails the job.
        run: |
          newman run tooling/newman/mea.postman_collection.json \
            --folder "Smoke" \
            --folder "Scenario 1 — Happy-Path Checkout" \
            --folder "Scenario 2 — Out-of-Stock" \
            --folder "Scenario 3 — Payment-Declined" \
            --folder "Inventory Context Contract" \
            --env-var baseUrl=http://localhost:8888

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "::group::inventory-service quarkus.log"
          cat examples/04-inventory-service/quarkus.log || true
          echo "::endgroup::"
          echo "::group::payment-service quarkus.log"
          cat examples/05-payment-service/quarkus.log || true
          echo "::endgroup::"
          echo "::group::shipping-service quarkus.log"
          cat examples/06-shipping-service/quarkus.log || true
          echo "::endgroup::"
          echo "::group::monolith.log"
          cat examples/00-monolith/monolith.log || true
          echo "::endgroup::"
          echo "::group::strangler-proxy quarkus.log"
          cat examples/01-strangler-proxy/quarkus.log || true
          echo "::endgroup::"

      - name: Stop the services
        if: always()
        run: |
          if [ -f examples/04-inventory-service/quarkus.pid ]; then
            kill "$(cat examples/04-inventory-service/quarkus.pid)" || true
          fi
          if [ -f examples/05-payment-service/quarkus.pid ]; then
            kill "$(cat examples/05-payment-service/quarkus.pid)" || true
          fi
          if [ -f examples/06-shipping-service/quarkus.pid ]; then
            kill "$(cat examples/06-shipping-service/quarkus.pid)" || true
          fi
          if [ -f examples/00-monolith/monolith.pid ]; then
            kill "$(cat examples/00-monolith/monolith.pid)" || true
          fi
          if [ -f examples/01-strangler-proxy/quarkus.pid ]; then
            kill "$(cat examples/01-strangler-proxy/quarkus.pid)" || true
          fi

  # payment-equivalence-gate (payment-plan.md S10) — the CHOREOGRAPHED-SAGA
  # sibling of equivalence-gate (Review), notification-equivalence-gate
  # (async outbox->Kafka), and inventory-equivalence-gate (gRPC) above. Covers
  # the payment extraction (examples/05-payment-service): checkout is now
  # fully async end-to-end (payment-plan.md S6/S8/S9, DRQ-047) — `POST
  # /api/orders` returns 202+PENDING, the monolith's transactional outbox
  # relays `order.placed` to Kafka, examples/05-payment-service's SmallRye
  # consumer captures/declines the payment and emits
  # `payment.captured`/`payment.declined` via its OWN outbox, and the
  # monolith's `OrderSagaListener` (its first Kafka CONSUMER, not just
  # producer) reacts: confirm + dispatch shipping on capture, or
  # PAYMENT_DECLINED + a compensating gRPC `Release` on decline (DRQ-049 —
  # this choreographed reaction fully replaces the ch.19 in-line `catch`
  # compensation; see OrderSagaListener's class javadoc). There is no
  # payment.mode flag left to gate this behind (payment-plan.md S9
  # DECOMMISSION removed it) — choreographed is the only path, and
  # `strangler.payment.enabled=true` is the proxy's committed default, so NO
  # runtime flag overrides are needed anywhere in this job, unlike
  # notification-equivalence-gate's historical flag-flip era.
  #
  # THE GATE: this job runs the FULL, unedited Newman collection (every
  # folder — Smoke, Scenario 1/2/3, Review/Notification/Inventory/Payment
  # Context Contract — no --folder filter, R8 no suite drift) through the
  # proxy on :8888, exactly as demos/demo-equivalence.sh does for a full-suite
  # run. Scenario 1 and Scenario 3 are the load-bearing async assertions:
  # Scenario 1 bounded-waits to CONFIRMED (payment captured over the saga,
  # shipping dispatched); Scenario 3 bounded-waits to PAYMENT_DECLINED AND
  # THEN bounded-waits inventory back to net-zero via the choreographed
  # Release (DRQ-049) — the single most dangerous regression in this
  # extraction (payment-plan.md H1, "Highest risk"). A non-zero Newman exit
  # fails the job. Because the async saga needs Kafka and the payment
  # consumer healthy BEFORE the suite runs (or the bounded-waits flake/false-
  # fail), every service below is readiness-gated with its own wait step
  # ahead of the "Run the behavior-equivalence suite" step — mirroring
  # inventory-equivalence-gate's and notification-equivalence-gate's
  # discipline, extended with the payment service and (since this is the
  # FULL suite, not an inventory-only folder subset) the Review and
  # Notification services too, since the proxy's committed defaults route
  # /api/reviews and /api/notifications to them and a full-suite run 500s on
  # those requests otherwise.
  #
  # Red->green proof (acceptance criterion, payment-plan.md S10(b)/(g)): this
  # job was validated LOCALLY before being committed (GitHub Actions cannot be
  # triggered from this environment) by bringing up the exact topology below
  # against the local podman stack (mea-postgres/mea-kafka) and running this
  # job's exact commands by hand:
  #
  #   1. GREEN baseline: full suite through the proxy — 108/108 assertions,
  #      0 failed, 11.3s (newman exit 0). Scenario 1 and Scenario 3 both
  #      resolved over genuine bounded-wait retries (not instant hits),
  #      confirming the choreography was actually exercised, not raced.
  #   2. DELIBERATE BREAK: in a LOCAL working copy only, the compensating
  #      Release loop in OrderSagaListener#onPaymentDeclined (monolith) was
  #      commented out (the `for (OrderItem item : order.getItems())` block
  #      that calls `remoteInventoryClient.release(...)`), the monolith was
  #      rebuilt (`mvn -q -DskipTests -f examples/00-monolith package`) and
  #      restarted. Re-running "Scenario 3 — Payment-Declined" alone (after
  #      letting the restarted consumer group's rebalance settle, isolating
  #      the failure to the break itself rather than a restart-timing
  #      artifact) went RED: newman exit 1, 1/22 assertions failed —
  #      "3d. Bounded-wait poll: inventory returns to net-zero after the
  #      decline ... quantityOnHand after 10 attempt(s): expected 60 to
  #      deeply equal 61" — while 3c (order reaches PAYMENT_DECLINED) still
  #      passed, proving the RED is isolated to the missing compensation, not
  #      a flaky consumer group. This is exactly payment-plan.md S10(b)'s
  #      required proof: "Scenario 3 net-zero goes RED".
  #   3. REVERT: the local edit was reverted byte-for-byte (confirmed via
  #      `git status`/`git diff` showing zero changes to OrderSagaListener.java
  #      before this workflow file was committed), the monolith rebuilt and
  #      restarted clean, and the full suite re-run GREEN again — 99/99
  #      assertions, 0 failed, 6.2s (newman exit 0; the small assertion-count
  #      delta from run 1 is the same documented bounded-wait retry-count
  #      variance CUTOVER.md's own runs show, not a correctness difference).
  #   4. NEGATIVE CHECK (DRQ-055) re-confirmed cheaply: with the payment
  #      service process killed, "Scenario 1 — Happy-Path Checkout" alone went
  #      RED (newman exit 1, 1/23 failed — order stuck PENDING past the
  #      bounded wait); restarting the payment service and re-running the same
  #      folder went GREEN again (19/19, newman exit 0).
  #
  # All services started during this local proof were stopped afterward; the
  # podman stack (mea-postgres/mea-kafka/mea-connect/mea-lgtm) was left
  # running, as required. The real GitHub Actions run of the job below is
  # unverifiable from this environment and is watched post-push.
  payment-equivalence-gate:
    name: payment-equivalence-gate
    runs-on: ubuntu-latest

    # Postgres + Kafka (same images/tags/creds as the other gates — the SAME
    # contract as local dev, not a CI-only substitute). Kafka is load-bearing
    # here, not just "present so the producer boots clean" as in
    # inventory-equivalence-gate's reasoning: the payment service's
    # OrderPlacedConsumer and the monolith's OrderSagaListener are both real
    # consumers this job's assertions depend on.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: monolith
          POSTGRES_USER: monolith
          POSTGRES_PASSWORD: monolith_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monolith -d monolith"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      kafka:
        image: docker.io/apache/kafka:3.8.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          KAFKA_NUM_PARTITIONS: 3
          KAFKA_DEFAULT_REPLICATION_FACTOR: 1
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
          --health-start-period 30s

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up JDK 25 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node (for newman)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install newman
        run: npm install -g newman

      # No psql pre-apply: every service below runs its OWN Flyway migrations
      # on boot against the fresh Postgres service container (monolith:
      # `public`, incl. V3's outbox; inventory: own `inventory` schema;
      # payment: own `payment` schema; review/notification likewise own or
      # share as already established). Pre-applying DDL with psql would leave
      # a non-empty schema with no flyway_schema_history and make a service's
      # own Flyway refuse to start.
      - name: Build the monolith
        run: mvn -q -DskipTests -f examples/00-monolith package

      - name: Build the Inventory service
        working-directory: examples/04-inventory-service
        run: ./mvnw -q -DskipTests package

      - name: Build the Payment service
        working-directory: examples/05-payment-service
        run: ./mvnw -q -DskipTests package

      - name: Build the Review service
        working-directory: examples/02-review-service
        run: ./mvnw -q -DskipTests package

      - name: Build the Notification service
        working-directory: examples/03-notification-service
        run: ./mvnw -q -DskipTests package

      # shipping-plan.md S10 cascade fix: this job runs the FULL suite,
      # whose Scenario 1 bounded-waits to CONFIRMED — post-S9 that depends on
      # the shipping service's orchestrated saga (see the top-of-file header
      # note).
      - name: Build the Shipping service
        working-directory: examples/06-shipping-service
        run: ./mvnw -q -DskipTests package

      - name: Build the strangler proxy
        working-directory: examples/01-strangler-proxy
        run: ./mvnw -q -DskipTests package

      - name: Start the Inventory service (REST :8084 + gRPC :9004) — seeds itself via Flyway
        # Checkout's synchronous gRPC Reserve has no in-JVM fallback
        # (inventory-plan S11) — started first, same discipline as the other
        # gates.
        working-directory: examples/04-inventory-service
        run: |
          nohup java -jar target/quarkus-app/quarkus-run.jar > quarkus.log 2>&1 &
          echo $! > quarkus.pid

      - name: Start the Payment service (order.placed consumer + own outbox) on :8085
        # No env overrides needed for the datasource (its %prod profile
        # already points at localhost:5432/monolith?currentSchema=payment,
        # matching the Postgres service container above) — only the Kafka
        # bootstrap, same convention as inventory/notification services.
        working-directory: examples/05-payment-service
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          nohup java -jar target/quarkus-app/quarkus-run.jar > quarkus.log 2>&1 &
          echo $! > quarkus.pid

      - name: Start the Shipping service (payment.captured saga consumer + own outbox) on :8088
        # shipping-plan.md S10 cascade fix: post-S9, orchestrated is the ONLY
        # shipping path — Scenario 1's CONFIRMED is reached via this
        # service's Camel Saga EIP coordinator emitting shipment.dispatched,
        # not an in-process dispatch. No SHIPPING_MODE override (that flag is
        # gone, S9) and no ORDER_SERVICE_BASE_URL override (its default,
        # http://localhost:8080, already matches the monolith below). Started
        # before the monolith, same discipline as the Payment service above,
        # so the saga consumer is already subscribed before any
        # payment.captured is produced.
        working-directory: examples/06-shipping-service
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          nohup java -jar target/quarkus-app/quarkus-run.jar > quarkus.log 2>&1 &
          echo $! > quarkus.pid

      - name: Start the Review service on :8081
        # The proxy's committed strangler.review.enabled=true default routes
        # /api/reviews here — required for the FULL suite's Review Context
        # Contract folder, which this job (unlike inventory-equivalence-gate's
        # folder subset) does not filter out.
        working-directory: examples/02-review-service
        run: |
          nohup java -jar target/quarkus-app/quarkus-run.jar > quarkus.log 2>&1 &
          echo $! > quarkus.pid

      - name: Start the Notification service (Kafka consumer) on :8083
        # Likewise required for the FULL suite's Notification Context
        # Contract folder (strangler.notification.enabled=true, committed
        # default).
        working-directory: examples/03-notification-service
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          nohup java -jar target/quarkus-app/quarkus-run.jar > quarkus.log 2>&1 &
          echo $! > quarkus.pid

      - name: Start the monolith (order-saga Kafka CONSUMER + outbox producer + gRPC inventory client) on :8080
        # No PAYMENT_MODE override: payment-plan S9 removed that flag entirely
        # — choreographed is the only checkout path left, committed. This is
        # the monolith's FIRST Kafka consumer (OrderSagaListener, reacting to
        # payment.captured/payment.declined), not just a producer.
        working-directory: examples/00-monolith
        env:
          SPRING_DATASOURCE_PASSWORD: monolith_dev_only
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          INVENTORY_GRPC_HOST: localhost
          INVENTORY_GRPC_PORT: "9004"
        run: |
          nohup java -jar target/monolith.jar > monolith.log 2>&1 &
          echo $! > monolith.pid

      - name: Start the strangler proxy (all cutover flags at their committed defaults) on :8888
        # strangler.review.enabled / .notification.enabled / .inventory.enabled
        # / .payment.enabled / .shipping.enabled all default to true in the
        # proxy's committed application.properties — no runtime overrides
        # needed, unlike notification-equivalence-gate's historical
        # flag-flip era. /api/orders (monolith), /api/reviews,
        # /api/notifications, /api/inventory, /api/payments, and
        # /api/shipments are all genuinely routed by committed default.
        working-directory: examples/01-strangler-proxy
        run: |
          nohup java -jar target/quarkus-app/quarkus-run.jar > quarkus.log 2>&1 &
          echo $! > quarkus.pid

      - name: Wait for the Inventory service to be ready on :8084
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8084/api/inventory" > /dev/null; then
              echo "Inventory service is up."
              exit 0
            fi
            sleep 2
          done
          echo "Inventory service did not become ready in time." >&2
          cat examples/04-inventory-service/quarkus.log || true
          exit 1

      - name: Wait for the Payment service to be ready on :8085
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8085/api/payments?orderId=1" > /dev/null; then
              echo "Payment service is up."
              exit 0
            fi
            sleep 2
          done
          echo "Payment service did not become ready in time." >&2
          cat examples/05-payment-service/quarkus.log || true
          exit 1

      - name: Wait for the Shipping service to be ready on :8088
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8088/api/shipments?orderId=1" > /dev/null; then
              echo "Shipping service is up."
              exit 0
            fi
            sleep 2
          done
          echo "Shipping service did not become ready in time." >&2
          cat examples/06-shipping-service/quarkus.log || true
          exit 1

      - name: Wait for the Shipping service's payment.captured saga consumer to connect
        # See shipping-equivalence-gate's identical step below for why this
        # greps a connector-startup log line plus a short settle buffer
        # rather than a partitions-assigned line (the newer KIP-848 Kafka
        # consumer protocol this client uses does not emit the Spring-Kafka-
        # style one-line INFO signal the monolith's wait below relies on).
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if grep -q "belongs to the 'shipping-service' consumer group" examples/06-shipping-service/quarkus.log 2>/dev/null; then
              echo "shipping-service payment.captured consumer connected."
              break
            fi
            sleep 2
          done
          if ! grep -q "belongs to the 'shipping-service' consumer group" examples/06-shipping-service/quarkus.log 2>/dev/null; then
            echo "shipping-service payment.captured consumer did not connect in time." >&2
            cat examples/06-shipping-service/quarkus.log || true
            exit 1
          fi
          sleep 5

      - name: Wait for the Review service to be ready on :8081
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8081/api/reviews?sku=SKU-WIDGET-001" > /dev/null; then
              echo "Review service is up."
              exit 0
            fi
            sleep 2
          done
          echo "Review service did not become ready in time." >&2
          cat examples/02-review-service/quarkus.log || true
          exit 1

      - name: Wait for the Notification service to be ready on :8083
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8083/api/notifications?customerId=1" > /dev/null; then
              echo "Notification service is up."
              exit 0
            fi
            sleep 2
          done
          echo "Notification service did not become ready in time." >&2
          cat examples/03-notification-service/quarkus.log || true
          exit 1

      - name: Wait for the monolith to be ready on :8080
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8080/api/orders" > /dev/null; then
              echo "Monolith is up."
              exit 0
            fi
            sleep 2
          done
          echo "Monolith did not become ready in time." >&2
          cat examples/00-monolith/monolith.log || true
          exit 1

      - name: Wait for the monolith's order-saga Kafka consumer group to stabilize
        # Load-bearing, not cosmetic: a freshly-started consumer group can take
        # up to its session-timeout window to be assigned partitions,
        # independent of the HTTP health check above being green. This
        # job's own local red-then-green proof (see header) hit exactly this
        # — a stale-member rebalance delay produced a FALSE red on Scenario 3
        # unrelated to any real regression. shipping-plan.md S10:
        # OrderSagaListener grew from 2 to 4 @KafkaListener methods at r07/S6
        # (payment.captured, payment.declined, shipment.dispatched,
        # shipment.failed), all in the same monolith-order-saga consumer
        # group — so this wait now requires ALL FOUR listener containers to
        # log "partitions assigned" (not just two) before running the suite,
        # or a RED result in the next step could be a rebalance artifact
        # rather than trustworthy evidence of a real regression.
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            count=$(grep -c "monolith-order-saga: partitions assigned" examples/00-monolith/monolith.log || true)
            if [ "${count:-0}" -ge 4 ]; then
              echo "monolith-order-saga consumer group stabilized (all four listeners assigned)."
              exit 0
            fi
            sleep 2
          done
          echo "monolith-order-saga consumer group did not stabilize in time." >&2
          cat examples/00-monolith/monolith.log || true
          exit 1

      - name: Wait for the strangler proxy to be ready on :8888
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8888/api/orders" > /dev/null; then
              echo "Strangler proxy is up."
              exit 0
            fi
            sleep 2
          done
          echo "Strangler proxy did not become ready in time." >&2
          cat examples/01-strangler-proxy/quarkus.log || true
          exit 1

      - name: Run the FULL behavior-equivalence suite through the proxy — the equivalence gate
        # THE GATE: every folder in the unedited collection (Smoke, Scenario
        # 1/2/3/4, Review/Notification/Inventory/Payment/Shipping Context
        # Contract), through the proxy on :8888 — the same invocation
        # demos/demo-equivalence.sh uses for a full-suite run (the
        # environment file supplies reviewUsername/reviewPassword the Review
        # Context Contract folder needs; baseUrl is overridden to the proxy).
        # Scenario 1 and Scenario 3's bounded-wait polls are the genuine
        # async assertions (confirm-over-the-saga and
        # decline-then-compensate-via-choreography respectively) — a
        # non-zero newman exit code fails the job. NOTE: this plain CLI
        # invocation does NOT flip the collection's `shippingSagaEnabled`
        # variable (that requires the Node-API helper — see
        # shipping-equivalence-gate below for why `--env-var` cannot do it),
        # so Scenario 4 (Shipping-Failure) stays harmlessly PENDING here, as
        # committed-default-baseline intends; proving Scenario 4 is this
        # job's sibling shipping-equivalence-gate's job, not this one's.
        run: |
          newman run tooling/newman/mea.postman_collection.json \
            --environment tooling/newman/local.postman_environment.json \
            --env-var baseUrl=http://localhost:8888

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "::group::inventory-service quarkus.log"
          cat examples/04-inventory-service/quarkus.log || true
          echo "::endgroup::"
          echo "::group::payment-service quarkus.log"
          cat examples/05-payment-service/quarkus.log || true
          echo "::endgroup::"
          echo "::group::shipping-service quarkus.log"
          cat examples/06-shipping-service/quarkus.log || true
          echo "::endgroup::"
          echo "::group::review-service quarkus.log"
          cat examples/02-review-service/quarkus.log || true
          echo "::endgroup::"
          echo "::group::notification-service quarkus.log"
          cat examples/03-notification-service/quarkus.log || true
          echo "::endgroup::"
          echo "::group::monolith.log"
          cat examples/00-monolith/monolith.log || true
          echo "::endgroup::"
          echo "::group::strangler-proxy quarkus.log"
          cat examples/01-strangler-proxy/quarkus.log || true
          echo "::endgroup::"

      - name: Stop the services
        if: always()
        run: |
          if [ -f examples/04-inventory-service/quarkus.pid ]; then
            kill "$(cat examples/04-inventory-service/quarkus.pid)" || true
          fi
          if [ -f examples/05-payment-service/quarkus.pid ]; then
            kill "$(cat examples/05-payment-service/quarkus.pid)" || true
          fi
          if [ -f examples/06-shipping-service/quarkus.pid ]; then
            kill "$(cat examples/06-shipping-service/quarkus.pid)" || true
          fi
          if [ -f examples/02-review-service/quarkus.pid ]; then
            kill "$(cat examples/02-review-service/quarkus.pid)" || true
          fi
          if [ -f examples/03-notification-service/quarkus.pid ]; then
            kill "$(cat examples/03-notification-service/quarkus.pid)" || true
          fi
          if [ -f examples/00-monolith/monolith.pid ]; then
            kill "$(cat examples/00-monolith/monolith.pid)" || true
          fi
          if [ -f examples/01-strangler-proxy/quarkus.pid ]; then
            kill "$(cat examples/01-strangler-proxy/quarkus.pid)" || true
          fi

  # shipping-equivalence-gate (shipping-plan.md S10, ch.24, DRQ-056..065) —
  # the ORCHESTRATED-SAGA sibling of equivalence-gate (Review),
  # notification-equivalence-gate (async outbox->Kafka),
  # inventory-equivalence-gate (gRPC), and payment-equivalence-gate
  # (CHOREOGRAPHED saga) above. Covers the shipping extraction
  # (examples/06-shipping-service): a Camel Saga EIP COORDINATOR (the
  # deliberate contrast to payment's choreography — one readable route
  # explicitly sequences the steps and owns the compensation decision)
  # consumes `payment.captured`, enriches the order's shipping address,
  # dispatches a `Shipment` row, books the (simulated) carrier — the
  # deterministic `SHIP-FAIL` injection point — and either emits
  # `shipment.dispatched` (the monolith's `onShipmentDispatched` reaction:
  # `AWAITING_SHIPMENT -> CONFIRMED`) or compensates via
  # `direct:ship-compensate`, which cancels the `Shipment` and emits
  # `shipment.failed` (the monolith's `onShipmentFailed` reaction:
  # `AWAITING_SHIPMENT -> SHIPPING_FAILED` + a delegated compensating gRPC
  # `Release` for every reserved sku, DRQ-060). r07/ch.24 S9 (DECOMMISSION)
  # removed the monolith's `shipping.mode` flag and in-process shipping
  # module entirely — orchestrated is the ONLY path, `strangler.shipping.
  # enabled=true` is the proxy's committed default, so NO runtime flag
  # overrides are needed anywhere in this job (same as payment-
  # equivalence-gate post its own S9).
  #
  # THE GATE: this job runs the FULL, unedited Newman collection (every
  # folder — Smoke, Scenario 1/2/3/4, Review/Notification/Inventory/Payment/
  # Shipping Context Contract) through the proxy on :8888, WITH Scenario 4
  # (Shipping-Failure) genuinely ENABLED — see the dedicated step below for
  # why the collection's `shippingSagaEnabled` variable cannot be flipped
  # via newman's `--env-var` flag. Scenario 1's bounded-wait-to-CONFIRMED
  # now traverses the longest chain in the suite (order.placed ->
  # payment.captured -> shipping saga -> enrich -> dispatch -> book-carrier
  # -> emit shipment.dispatched -> CONFIRMED); Scenario 4's SF-c/SF-d
  # bounded-waits are THE crux (H3): order reaches SHIPPING_FAILED AND
  # inventory returns to net-zero, proving the orchestrated, cross-context
  # compensation genuinely fires. A non-zero exit from the helper script
  # fails the job.
  #
  # WHY THE NODE-API HELPER (demos/lib/run-shipping-newman.js), NOT
  # `--env-var "shippingSagaEnabled=true"` (a documented, empirically
  # verified finding, not an assumption — see
  # examples/06-shipping-service/CUTOVER.md's S8 writeup for the original
  # discovery): the collection's "SF-gate" item reads
  # `pm.collectionVariables.get('shippingSagaEnabled')`. newman's
  # `--env-var`/`--global-var` CLI flags only populate the ENVIRONMENT/
  # GLOBAL variable scopes — a DIFFERENT scope from the collection-level
  # `variable` array a Postman collection's own JSON defines. Passing
  # `--env-var "shippingSagaEnabled=true"` was verified by hand to leave the
  # SF-gate PENDING (Scenario 4 silently SKIPPED, not run) — a false green
  # on exactly the crux this gate exists to prove. The helper instead loads
  # the collection JSON into memory via newman's documented Node API,
  # patches the IN-MEMORY `shippingSagaEnabled` variable's value, and hands
  # the in-memory object (never a re-written file) to `newman.run()` — the
  # committed collection file on disk is never touched. This job therefore
  # invokes `node demos/lib/run-shipping-newman.js "$PWD"
  # "http://localhost:8888" "true"` instead of a plain `newman run` CLI
  # call.
  #
  # Readiness gating: the orchestrated chain needs Kafka + the monolith's
  # FOUR order-saga consumers (payment.captured, payment.declined,
  # shipment.dispatched, shipment.failed — grown from two at r07/S6) + the
  # shipping service's OWN payment.captured saga consumer all live before
  # the suite runs, or Scenario 1/4's bounded-waits flake/false-fail — every
  # service below is readiness-gated with its own wait step, extending
  # payment-equivalence-gate's proven template with the shipping service and
  # its saga-consumer-connect wait.
  #
  # Red->green proof (acceptance criterion, shipping-plan.md S10(b)/(g)):
  # this job was validated LOCALLY before being committed (GitHub Actions
  # cannot be triggered from this environment) by bringing up the exact
  # topology below against the local podman stack (mea-postgres/mea-kafka)
  # and running this job's exact commands by hand, AFTER r07/S9's
  # decommission (no SHIPPING_MODE override, no -D strangler.shipping.enabled
  # override — committed defaults only, matching this job):
  #
  #   1. GREEN baseline: full suite through the proxy, via the helper with
  #      shippingSagaEnabled=true — 134/134 assertions, 0 failed, 16.1s
  #      (newman exit 0). The helper's own console banner confirmed
  #      'Scenario 4 (Shipping-Failure) ENABLED (shippingSagaEnabled=true) —
  #      running the SHIP-FAIL saga assertions.' (NOT the baseline
  #      'PENDING' banner), and SF-c's bounded-wait poll genuinely looped
  #      (5 attempts) before observing SHIPPING_FAILED — confirming Scenario
  #      4 actually EXECUTED, not a silently-skipped false green.
  #   2. DELIBERATE BREAK: in a LOCAL working copy only,
  #      examples/06-shipping-service/.../ShipmentSagaRoute.java's
  #      `.compensation("direct:ship-compensate")` line (the saga route's
  #      ONE registration of its compensating action) was commented out, the
  #      shipping service was rebuilt (`./mvnw -q -DskipTests package`) and
  #      restarted. Re-running the "Scenario 4 — Shipping-Failure" folder
  #      alone via the helper (shippingSagaEnabled=true) went RED: newman
  #      exit 1, 2/47 assertions failed —
  #      "SF-c. ... order 312 status after 20 attempt(s): expected
  #      'AWAITING_SHIPMENT' to deeply equal 'SHIPPING_FAILED'" and
  #      "SF-d. ... quantityOnHand after 20 attempt(s): expected 457 to
  #      deeply equal 458" — exactly the predicted failure mode: with no
  #      compensation route registered, the Camel Saga EIP coordinator has
  #      nothing to invoke on the deterministic SHIP-FAIL exception,
  #      `shipment.failed` is never emitted, the order is stuck
  #      `AWAITING_SHIPMENT` forever, and the compensating `Release` never
  #      runs, so stock stays decremented. This is exactly shipping-plan.md
  #      S10(b)'s required proof: "Scenario 4 net-zero goes RED".
  #   3. REVERT: the local edit was reverted BYTE-FOR-BYTE (confirmed via
  #      `git status`/`git diff` showing zero changes to
  #      ShipmentSagaRoute.java before this workflow file was committed —
  #      `git status` reported "nothing to commit, working tree clean"), the
  #      shipping service rebuilt and restarted clean, and the full suite
  #      re-run GREEN again via the helper (shippingSagaEnabled=true) —
  #      133/133 assertions, 0 failed, 15.5s (newman exit 0; the
  #      one-assertion delta from run 1 is the same documented bounded-wait
  #      retry-count variance payment-equivalence-gate's own header
  #      documents, not a correctness difference). Scenario 4's SF-c
  #      bounded-wait again resolved GREEN, confirming the orchestrated
  #      compensation was genuinely restored.
  #   4. NEGATIVE CHECK (DRQ-065) re-confirmed cheaply: with the shipping
  #      service process killed (its sole `payment.captured` saga consumer),
  #      a fresh checkout's "Scenario 1 — Happy-Path Checkout" folder alone
  #      went RED (newman exit 1, 1/33 failed — "order 317 status after 20
  #      attempt(s): expected 'AWAITING_SHIPMENT' to deeply equal
  #      'CONFIRMED'" — payment.captured arrived and the monolith reacted,
  #      but with no shipping-service consumer alive there is no path to
  #      shipment.dispatched); restarting the shipping service and
  #      re-running the same folder on a fresh checkout went GREEN again
  #      (19/19, newman exit 0, 4s — Kafka's at-least-once redelivery drained
  #      the backlog with no manual intervention).
  #
  # All services started during this local proof were stopped afterward; the
  # podman stack (mea-postgres/mea-kafka/mea-connect/mea-lgtm) was left
  # running, as required. The real GitHub Actions run of the job below is
  # unverifiable from this environment and is watched post-push.
  shipping-equivalence-gate:
    name: shipping-equivalence-gate
    runs-on: ubuntu-latest

    # Postgres + Kafka (same images/tags/creds as the other gates — the SAME
    # contract as local dev, not a CI-only substitute). Kafka is genuinely
    # load-bearing: the shipping service's payment.captured saga consumer and
    # the monolith's FOUR order-saga listeners are all real consumers this
    # job's assertions depend on.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: monolith
          POSTGRES_USER: monolith
          POSTGRES_PASSWORD: monolith_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monolith -d monolith"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      kafka:
        image: docker.io/apache/kafka:3.8.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          KAFKA_NUM_PARTITIONS: 3
          KAFKA_DEFAULT_REPLICATION_FACTOR: 1
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
          --health-start-period 30s

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up JDK 25 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node (for newman)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install newman
        # Installed as a locally-resolvable module (not just the global CLI)
        # so demos/lib/run-shipping-newman.js's require('newman') resolves —
        # the helper's Node API usage needs the module itself, not just the
        # `newman` binary on PATH.
        run: npm install newman

      # No psql pre-apply: every service below runs its OWN Flyway migrations
      # on boot against the fresh Postgres service container (monolith:
      # `public`, incl. V4's AWAITING_SHIPMENT/SHIPPING_FAILED states;
      # inventory/payment/review/notification/shipping each own their own
      # schema). Pre-applying DDL with psql would leave a non-empty schema
      # with no flyway_schema_history and make a service's own Flyway refuse
      # to start.
      - name: Build the monolith
        run: mvn -q -DskipTests -f examples/00-monolith package

      - name: Build the Inventory service
        working-directory: examples/04-inventory-service
        run: ./mvnw -q -DskipTests package

      - name: Build the Payment service
        working-directory: examples/05-payment-service
        run: ./mvnw -q -DskipTests package

      - name: Build the Review service
        working-directory: examples/02-review-service
        run: ./mvnw -q -DskipTests package

      - name: Build the Notification service
        working-directory: examples/03-notification-service
        run: ./mvnw -q -DskipTests package

      - name: Build the Shipping service
        working-directory: examples/06-shipping-service
        run: ./mvnw -q -DskipTests package

      - name: Build the strangler proxy
        working-directory: examples/01-strangler-proxy
        run: ./mvnw -q -DskipTests package

      - name: Start the Inventory service (REST :8084 + gRPC :9004) — seeds itself via Flyway
        # Checkout's synchronous gRPC Reserve has no in-JVM fallback
        # (inventory-plan S11) — started first, same discipline as the other
        # gates.
        working-directory: examples/04-inventory-service
        run: |
          nohup java -jar target/quarkus-app/quarkus-run.jar > quarkus.log 2>&1 &
          echo $! > quarkus.pid

      - name: Start the Payment service (order.placed consumer + own outbox) on :8085
        # No env overrides needed for the datasource (its %prod profile
        # already points at localhost:5432/monolith?currentSchema=payment,
        # matching the Postgres service container above) — only the Kafka
        # bootstrap, same convention as the other services.
        working-directory: examples/05-payment-service
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          nohup java -jar target/quarkus-app/quarkus-run.jar > quarkus.log 2>&1 &
          echo $! > quarkus.pid

      - name: Start the Review service on :8081
        # The proxy's committed strangler.review.enabled=true default routes
        # /api/reviews here — required for the FULL suite's Review Context
        # Contract folder.
        working-directory: examples/02-review-service
        run: |
          nohup java -jar target/quarkus-app/quarkus-run.jar > quarkus.log 2>&1 &
          echo $! > quarkus.pid

      - name: Start the Notification service (Kafka consumer) on :8083
        # Likewise required for the FULL suite's Notification Context
        # Contract folder (strangler.notification.enabled=true, committed
        # default).
        working-directory: examples/03-notification-service
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          nohup java -jar target/quarkus-app/quarkus-run.jar > quarkus.log 2>&1 &
          echo $! > quarkus.pid

      - name: Start the Shipping service (payment.captured saga consumer + own outbox) on :8088
        # THE CORE OF THIS GATE. No SHIPPING_MODE override on the monolith
        # below (r07/ch.24 S9 removed that flag entirely — orchestrated is
        # the only shipping path, committed) and no ORDER_SERVICE_BASE_URL
        # override here (its default, http://localhost:8080, already matches
        # the monolith started below — the saga's enrich step reads the
        # order's shipping address from there). Started before the monolith,
        # same ordering discipline as the Payment service above, so the saga
        # consumer is already subscribed before any payment.captured is
        # produced.
        working-directory: examples/06-shipping-service
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          nohup java -jar target/quarkus-app/quarkus-run.jar > quarkus.log 2>&1 &
          echo $! > quarkus.pid

      - name: Start the monolith (FOUR order-saga Kafka consumers + outbox producer + gRPC inventory client) on :8080
        # No PAYMENT_MODE / SHIPPING_MODE overrides: both flags were removed
        # by their respective S9 decommission steps — choreographed payment
        # and orchestrated shipping are the only checkout paths left,
        # committed. OrderSagaListener now has FOUR @KafkaListener methods
        # (payment.captured, payment.declined, shipment.dispatched,
        # shipment.failed), all in the monolith-order-saga consumer group.
        working-directory: examples/00-monolith
        env:
          SPRING_DATASOURCE_PASSWORD: monolith_dev_only
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          INVENTORY_GRPC_HOST: localhost
          INVENTORY_GRPC_PORT: "9004"
        run: |
          nohup java -jar target/monolith.jar > monolith.log 2>&1 &
          echo $! > monolith.pid

      - name: Start the strangler proxy (all cutover flags at their committed defaults) on :8888
        # strangler.review.enabled / .notification.enabled / .inventory.enabled
        # / .payment.enabled / .shipping.enabled all default to true in the
        # proxy's committed application.properties (shipping-plan S9) — no
        # runtime -D overrides needed anywhere in this job. /api/orders
        # (monolith), /api/reviews, /api/notifications, /api/inventory,
        # /api/payments, and /api/shipments are all genuinely routed by
        # committed default.
        working-directory: examples/01-strangler-proxy
        run: |
          nohup java -jar target/quarkus-app/quarkus-run.jar > quarkus.log 2>&1 &
          echo $! > quarkus.pid

      - name: Wait for the Inventory service to be ready on :8084
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8084/api/inventory" > /dev/null; then
              echo "Inventory service is up."
              exit 0
            fi
            sleep 2
          done
          echo "Inventory service did not become ready in time." >&2
          cat examples/04-inventory-service/quarkus.log || true
          exit 1

      - name: Wait for the Payment service to be ready on :8085
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8085/api/payments?orderId=1" > /dev/null; then
              echo "Payment service is up."
              exit 0
            fi
            sleep 2
          done
          echo "Payment service did not become ready in time." >&2
          cat examples/05-payment-service/quarkus.log || true
          exit 1

      - name: Wait for the Review service to be ready on :8081
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8081/api/reviews?sku=SKU-WIDGET-001" > /dev/null; then
              echo "Review service is up."
              exit 0
            fi
            sleep 2
          done
          echo "Review service did not become ready in time." >&2
          cat examples/02-review-service/quarkus.log || true
          exit 1

      - name: Wait for the Notification service to be ready on :8083
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8083/api/notifications?customerId=1" > /dev/null; then
              echo "Notification service is up."
              exit 0
            fi
            sleep 2
          done
          echo "Notification service did not become ready in time." >&2
          cat examples/03-notification-service/quarkus.log || true
          exit 1

      - name: Wait for the Shipping service to be ready on :8088
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8088/api/shipments?orderId=1" > /dev/null; then
              echo "Shipping service is up."
              exit 0
            fi
            sleep 2
          done
          echo "Shipping service did not become ready in time." >&2
          cat examples/06-shipping-service/quarkus.log || true
          exit 1

      - name: Wait for the Shipping service's payment.captured saga consumer to connect
        # Load-bearing, not cosmetic: without the saga consumer genuinely
        # subscribed, a payment.captured produced too early is still
        # delivered (Kafka at-least-once + no auto-commit until processed),
        # but a race here is exactly how a false RED on Scenario 1/4 would
        # happen — the local red-then-green proof above (see header) depends
        # on this NOT racing. Unlike the monolith's Spring Kafka listeners
        # below, this service's Kafka client (SmallRye Reactive Messaging,
        # the newer KIP-848 consumer-group protocol) does not emit a clean,
        # one-line INFO "partitions assigned" log — confirmed by hand:
        # forcing DEBUG on both io.smallrye.reactive.messaging.kafka and
        # org.apache.kafka produced no equivalent single-line signal for this
        # client (its reconciliation logging is multi-line and
        # DEBUG-gated). The most specific available signal is this
        # connector's own startup confirmation line (SRMSG18257, "belongs to
        # the 'shipping-service' consumer group"), which precedes the HTTP
        # listener coming up in every observed run, followed by a short,
        # fixed settle buffer for the broker-side group-coordinator
        # handshake — an honest, documented approximation, not a precise
        # rebalance signal.
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if grep -q "belongs to the 'shipping-service' consumer group" examples/06-shipping-service/quarkus.log 2>/dev/null; then
              echo "shipping-service payment.captured consumer connected."
              break
            fi
            sleep 2
          done
          if ! grep -q "belongs to the 'shipping-service' consumer group" examples/06-shipping-service/quarkus.log 2>/dev/null; then
            echo "shipping-service payment.captured consumer did not connect in time." >&2
            cat examples/06-shipping-service/quarkus.log || true
            exit 1
          fi
          sleep 5

      - name: Wait for the monolith to be ready on :8080
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8080/api/orders" > /dev/null; then
              echo "Monolith is up."
              exit 0
            fi
            sleep 2
          done
          echo "Monolith did not become ready in time." >&2
          cat examples/00-monolith/monolith.log || true
          exit 1

      - name: Wait for the monolith's order-saga Kafka consumer group to stabilize
        # Load-bearing, not cosmetic (mirroring payment-equivalence-gate): a
        # freshly-started consumer group can take up to its session-timeout
        # window to be assigned partitions, independent of the HTTP health
        # check above being green. OrderSagaListener has FOUR @KafkaListener
        # methods (payment.captured, payment.declined, shipment.dispatched,
        # shipment.failed), all in the monolith-order-saga consumer group
        # (grown from two at r07/S6) — this wait requires ALL FOUR listener
        # containers to log "partitions assigned" before running the suite,
        # or a RED result in the next step could be a rebalance artifact
        # rather than trustworthy evidence of a real regression (exactly the
        # false-RED-on-Scenario-3 this discipline was originally added to
        # prevent for payment, now doubly relevant with Scenario 1's longer
        # chain and Scenario 4's new terminal outcome).
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            count=$(grep -c "monolith-order-saga: partitions assigned" examples/00-monolith/monolith.log || true)
            if [ "${count:-0}" -ge 4 ]; then
              echo "monolith-order-saga consumer group stabilized (all four listeners assigned)."
              exit 0
            fi
            sleep 2
          done
          echo "monolith-order-saga consumer group did not stabilize in time." >&2
          cat examples/00-monolith/monolith.log || true
          exit 1

      - name: Wait for the strangler proxy to be ready on :8888
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8888/api/orders" > /dev/null; then
              echo "Strangler proxy is up."
              exit 0
            fi
            sleep 2
          done
          echo "Strangler proxy did not become ready in time." >&2
          cat examples/01-strangler-proxy/quarkus.log || true
          exit 1

      - name: Run the FULL behavior-equivalence suite through the proxy, Scenario 4 ENABLED — the equivalence gate
        # THE GATE. Uses the committed Node-API helper
        # (demos/lib/run-shipping-newman.js), NOT a plain `newman run`
        # CLI invocation — see the job-level header comment above for the
        # full, empirically-verified reasoning: newman's `--env-var` flag
        # cannot reach the collection-scoped `shippingSagaEnabled` variable
        # the Scenario 4 "SF-gate" item reads, and using it anyway would
        # SILENTLY SKIP Scenario 4 (a false green on this extraction's crux,
        # H3). The helper patches that variable to "true" on an IN-MEMORY
        # copy of the collection (the committed file on disk is never
        # written to) and runs the full, unedited suite through the proxy.
        # A non-zero exit from the helper (newman reported >=1 failed
        # assertion, or a setup error) fails this step.
        run: |
          node demos/lib/run-shipping-newman.js "$PWD" "http://localhost:8888" "true"

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "::group::inventory-service quarkus.log"
          cat examples/04-inventory-service/quarkus.log || true
          echo "::endgroup::"
          echo "::group::payment-service quarkus.log"
          cat examples/05-payment-service/quarkus.log || true
          echo "::endgroup::"
          echo "::group::review-service quarkus.log"
          cat examples/02-review-service/quarkus.log || true
          echo "::endgroup::"
          echo "::group::notification-service quarkus.log"
          cat examples/03-notification-service/quarkus.log || true
          echo "::endgroup::"
          echo "::group::shipping-service quarkus.log"
          cat examples/06-shipping-service/quarkus.log || true
          echo "::endgroup::"
          echo "::group::monolith.log"
          cat examples/00-monolith/monolith.log || true
          echo "::endgroup::"
          echo "::group::strangler-proxy quarkus.log"
          cat examples/01-strangler-proxy/quarkus.log || true
          echo "::endgroup::"

      - name: Stop the services
        if: always()
        run: |
          if [ -f examples/04-inventory-service/quarkus.pid ]; then
            kill "$(cat examples/04-inventory-service/quarkus.pid)" || true
          fi
          if [ -f examples/05-payment-service/quarkus.pid ]; then
            kill "$(cat examples/05-payment-service/quarkus.pid)" || true
          fi
          if [ -f examples/02-review-service/quarkus.pid ]; then
            kill "$(cat examples/02-review-service/quarkus.pid)" || true
          fi
          if [ -f examples/03-notification-service/quarkus.pid ]; then
            kill "$(cat examples/03-notification-service/quarkus.pid)" || true
          fi
          if [ -f examples/06-shipping-service/quarkus.pid ]; then
            kill "$(cat examples/06-shipping-service/quarkus.pid)" || true
          fi
          if [ -f examples/00-monolith/monolith.pid ]; then
            kill "$(cat examples/00-monolith/monolith.pid)" || true
          fi
          if [ -f examples/01-strangler-proxy/quarkus.pid ]; then
            kill "$(cat examples/01-strangler-proxy/quarkus.pid)" || true
          fi
