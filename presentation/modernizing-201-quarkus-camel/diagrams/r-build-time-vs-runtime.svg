<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600"><defs><marker id="_arrow_neutral_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4A4A4A"/></marker></defs><rect x="0" y="0" width="1200" height="600" fill="#FFFFFF"/><text x="600.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">Build-time, not boot-time</text><text x="600.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Quarkus does classpath scanning, metamodel building, and proxying once at build — the runtime just runs</text><rect x="50" y="110" width="520" height="420" rx="8" ry="8" fill="#F4F4F4" stroke="#D2D2D2" stroke-width="1"/><text x="74" y="136" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="bold" fill="#B71C1C" text-anchor="start">Traditional JVM framework — at every boot</text><rect x="80" y="170" width="460" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.6"/><text x="310.0" y="194" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Scan the classpath</text><text x="310.0" y="214" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">reflection over annotations</text><rect x="80" y="258" width="460" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.6"/><text x="310.0" y="282" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Build the metamodel</text><text x="310.0" y="302" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">wiring, ORM, config</text><rect x="80" y="346" width="460" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.6"/><text x="310.0" y="370" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Generate proxies</text><text x="310.0" y="390" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">dynamic, at startup</text><rect x="80" y="434" width="460" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="310.0" y="458" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">→ slow start, big heap</text><text x="310.0" y="478" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">work repeated every launch</text><rect x="630" y="110" width="520" height="420" rx="8" ry="8" fill="#F4F4F4" stroke="#D2D2D2" stroke-width="1"/><text x="654" y="136" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="bold" fill="#006E6E" text-anchor="start">Quarkus — once, at build time</text><rect x="660" y="170" width="460" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="890.0" y="194" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Augmentation at build</text><text x="890.0" y="214" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">scan + wire + proxy ONCE</text><rect x="660" y="258" width="460" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="890.0" y="282" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Closed-world metamodel</text><text x="890.0" y="302" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">baked into the artifact</text><rect x="660" y="346" width="460" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="890.0" y="370" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Tiny runtime init</text><text x="890.0" y="390" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">no startup reflection</text><rect x="660" y="434" width="460" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="890.0" y="458" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">→ fast start, native-ready</text><text x="890.0" y="478" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">Mandrel: ~0.05 s, ~73 MB</text><line x1="540" y1="400" x2="660" y2="400" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><text x="600.0" y="394.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">moved left</text></svg>