<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640"><defs><marker id="_arrow_neutral_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4A4A4A"/></marker><marker id="_arrow_muted_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5A5A5A"/></marker></defs><rect x="0" y="0" width="1280" height="640" fill="#FFFFFF"/><text x="640.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">The end state: six services + a gateway, on Kubernetes</text><text x="640.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">The monolith is decommissioned; the proxy is now the permanent edge router; each service owns its schema</text><rect x="40" y="150" width="150" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="115.0" y="190.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">client</text><rect x="230" y="150" width="200" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#EE0000" stroke-width="1.6"/><text x="330.0" y="174" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">strangler proxy</text><text x="330.0" y="194" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">NodePort edge</text><line x1="190" y1="185" x2="230" y2="185" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><rect x="60" y="300" width="150" height="64" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="135.0" y="337.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">order</text><rect x="222" y="300" width="150" height="64" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="297.0" y="337.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">inventory</text><rect x="384" y="300" width="150" height="64" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="459.0" y="337.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">payment</text><rect x="546" y="300" width="150" height="64" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="621.0" y="337.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">shipping</text><rect x="708" y="300" width="150" height="64" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="783.0" y="337.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">notification</text><rect x="870" y="300" width="150" height="64" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="945.0" y="337.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">review</text><rect x="1032" y="300" width="150" height="64" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="1107.0" y="337.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">graphql-gw</text><line x1="330" y1="230" x2="330" y2="300" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><text x="330.0" y="259.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">routes by path</text><rect x="300" y="460" width="300" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="1.6"/><text x="450.0" y="484" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">PostgreSQL</text><text x="450.0" y="504" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">one schema per service</text><rect x="700" y="460" width="300" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="850.0" y="484" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Kafka (KRaft)</text><text x="850.0" y="504" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">outbox relays + sagas</text><line x1="135" y1="364" x2="450" y2="460" stroke="#5A5A5A" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#_arrow_muted_1)"/><line x1="435" y1="364" x2="450" y2="460" stroke="#5A5A5A" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#_arrow_muted_1)"/><line x1="735" y1="364" x2="450" y2="460" stroke="#5A5A5A" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#_arrow_muted_1)"/><line x1="1035" y1="364" x2="450" y2="460" stroke="#5A5A5A" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#_arrow_muted_1)"/><line x1="285" y1="364" x2="850" y2="460" stroke="#5A5A5A" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#_arrow_muted_1)"/><line x1="585" y1="364" x2="850" y2="460" stroke="#5A5A5A" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#_arrow_muted_1)"/><line x1="885" y1="364" x2="850" y2="460" stroke="#5A5A5A" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#_arrow_muted_1)"/><text x="60" y="580" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5A5A5A" text-anchor="start">Istio mesh (mTLS + tracing) + LGTM observability layered on top — verified live on minikube</text></svg>