<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"><rect x="0" y="0" width="1200" height="900" fill="#FFFFFF"/><text x="600.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">The chassis scorecard — capabilities by status</text><text x="600.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Verified against this repo's code; blue = used, grey outline = partial, light grey = deferred</text><rect x="70" y="110" width="1060" height="72" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="600.0" y="134" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">1. Config — USED</text><text x="600.0" y="154" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">@ConfigProperty + %dev/%prod/%test profiles</text><rect x="70" y="190" width="1060" height="72" rx="8" ry="8" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.6"/><text x="600.0" y="214" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">2. Fault Tolerance — DEFERRED</text><text x="600.0" y="234" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">no @Retry/@Timeout/@CircuitBreaker — manual deadlines stand in</text><rect x="70" y="270" width="1060" height="72" rx="8" ry="8" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.6"/><text x="600.0" y="294" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">3. Health — PARTIAL</text><text x="600.0" y="314" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">smallrye-health on 6 of 8 (auto /q/health); no custom checks</text><rect x="70" y="350" width="1060" height="72" rx="8" ry="8" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.6"/><text x="600.0" y="374" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">4. Metrics — DEFERRED</text><text x="600.0" y="394" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">no Micrometer, no /q/metrics</text><rect x="70" y="430" width="1060" height="72" rx="8" ry="8" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.6"/><text x="600.0" y="454" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">5. OpenAPI — DEFERRED</text><text x="600.0" y="474" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">no smallrye-openapi; the gateway's GraphQL schema replaces it</text><rect x="70" y="510" width="1060" height="72" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="600.0" y="534" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">6. REST Client — USED</text><text x="600.0" y="554" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">@RegisterRestClient in shipping + gateway resolvers, config-driven</text><rect x="70" y="590" width="1060" height="72" rx="8" ry="8" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.6"/><text x="600.0" y="614" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">7. Security / JWT — PARTIAL</text><text x="600.0" y="634" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">HTTP Basic + @RolesAllowed on review; OIDC deferred</text><rect x="70" y="670" width="1060" height="72" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="600.0" y="694" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">8. Native / build-time — USED</text><text x="600.0" y="714" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">native profile in all 8 poms — ~31x startup / ~4x memory</text><rect x="70" y="750" width="1060" height="72" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="600.0" y="774" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">9. Dev-mode — USED</text><text x="600.0" y="794" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">quarkus:dev live reload; Dev Services off (shared Postgres)</text><rect x="70" y="840" width="330" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="235.0" y="870.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">USED</text><rect x="430" y="840" width="330" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.6"/><text x="595.0" y="870.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">PARTIAL</text><rect x="790" y="840" width="330" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.6"/><text x="955.0" y="870.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">DEFERRED</text></svg>