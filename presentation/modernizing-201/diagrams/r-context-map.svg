ntory</text><text x="560.0" y="164" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">stock per SKU</text><rect x="440" y="250" width="240" height="90" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="560.0" y="274" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">payment</text><text x="560.0" y="294" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">charge capture</text><rect x="440" y="380" width="240" height="90" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="560.0" y="404" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">shipping</text><text x="560.0" y="424" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">dispatch</text><rect x="440" y="510" width="240" height="90" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="560.0" y="534" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">notification</text><text x="560.0" y="554" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">confirmation</text><rect x="820" y="120" width="200" height="90" rx="8" ry="8" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.6"/><text x="920.0" y="144" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">review</text><text x="920.0" y="164" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">no outbound edges</text><text x="920.0" y="180" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">extracted first</text><rect x="430" y="640" width="420" height="90" rx="8" ry="8" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="1.6"/><text x="640.0" y="664" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">PostgreSQL</text><text x="640.0" y="684" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">one shared schema — no owner (shared kernel)</text><line x1="290" y1="355.0" x2="440" y2="165" stroke="#B36B00" stroke-width="1.6" marker-end="url(#_arrow_govern_0)"/><text x="365.0" y="254.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">conformist · ACL missing</text><line x1="290" y1="355.0" x2="440" y2="295" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><text x="365.0" y="319.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">direct @Transactional call</text><line x1="290" y1="355.0" x2="440" y2="425" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><line x1="290" y1="355.0" x2="440" y2="555" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><line x1="180.0" y1="410" x2="560" y2="640" stroke="#6A1B9A" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#_arrow_data_1)"/><text x="640" y="620" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5A5A5A" text-anchor="middle">all six contexts read and write the same schema</text></svg>