<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740"><defs><marker id="_arrow_neutral_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4A4A4A"/></marker><marker id="_arrow_rest_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#EE0000"/></marker></defs><rect x="0" y="0" width="1200" height="740" fill="#FFFFFF"/><text x="600.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">The two-phase migration — the per-service recipe</text><text x="600.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Phase A de-risks fast; Phase B makes the 'why Quarkus' case with numbers (Review service, measured)</text><rect x="70" y="120" width="320" height="150" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="230.0" y="144" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Phase A — lift onto Quarkus</text><text x="230.0" y="164" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">Spring-compat extensions</text><text x="230.0" y="180" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">spring-web / -di / -data-jpa</text><text x="230.0" y="196" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">suite green, fast</text><rect x="440" y="120" width="320" height="150" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="600.0" y="144" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Phase B — idiomatic Quarkus</text><text x="600.0" y="164" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">Quarkus REST + Panache + CDI</text><text x="600.0" y="180" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">compat shim removed</text><rect x="810" y="120" width="320" height="150" rx="8" ry="8" fill="#FFFFFF" stroke="#EE0000" stroke-width="1.6"/><text x="970.0" y="144" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Phase B — native image</text><text x="970.0" y="164" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">GraalVM Mandrel builder</text><text x="970.0" y="180" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">same code, no rewrite</text><line x1="390" y1="195" x2="440" y2="195" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><text x="415.0" y="189.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">refactor</text><line x1="760" y1="195" x2="810" y2="195" stroke="#EE0000" stroke-width="1.6" marker-end="url(#_arrow_rest_0)"/><text x="785.0" y="189.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">package -Dnative</text><rect x="70" y="330" width="1060" height="320" rx="8" ry="8" fill="#F4F4F4" stroke="#D2D2D2" stroke-width="1"/><text x="100" y="365" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A4A4A" text-anchor="start">Measured startup + RSS  (same Postgres, profile=prod)</text><text x="110" y="405" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#4A4A4A" text-anchor="start">Build</text><text x="640" y="405" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#4A4A4A" text-anchor="start">Startup</text><text x="880" y="405" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#4A4A4A" text-anchor="start">RSS</text><text x="110" y="440" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4A4A4A" text-anchor="start">Phase A — JVM (spring-compat)</text><text x="640" y="440" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4A4A4A" text-anchor="start">1.492 s</text><text x="880" y="440" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4A4A4A" text-anchor="start">~316 MB</text><text x="110" y="480" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4A4A4A" text-anchor="start">Phase B — JVM (idiomatic)</text><text x="640" y="480" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4A4A4A" text-anchor="start">1.43 s</text><text x="880" y="480" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4A4A4A" text-anchor="start">~304 MB</text><text x="110" y="520" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#006E6E" text-anchor="start">Phase B — native image</text><text x="640" y="520" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#006E6E" text-anchor="start">0.048 s</text><text x="880" y="520" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#006E6E" text-anchor="start">~73 MB</text><text x="100" y="620" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#006E6E" text-anchor="start">~30x faster startup, ~4.2x less resident memory, JVM to native — same idiomatic code.</text></svg>