<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" width="1240" height="640"><defs><marker id="_arrow_neutral_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4A4A4A"/></marker><marker id="_arrow_muted_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5A5A5A"/></marker><marker id="_arrow_rest_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#EE0000"/></marker></defs><rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/><text x="620.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">The strangler fig: a proxy in front, one seam out at a time</text><text x="620.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">A Camel proxy routes each path to the monolith or the extracted service — flip the flag when the suite stays green</text><rect x="40" y="180" width="170" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="125.0" y="204" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">client</text><text x="125.0" y="224" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">same API</text><rect x="300" y="180" width="210" height="90" rx="8" ry="8" fill="#FFFFFF" stroke="#EE0000" stroke-width="1.6"/><text x="405.0" y="204" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">strangler proxy</text><text x="405.0" y="224" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">Camel .choice()</text><text x="405.0" y="240" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">routes by path + flag</text><line x1="210" y1="220" x2="300" y2="220" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><rect x="620" y="90" width="240" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.6"/><text x="740.0" y="114" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">monolith</text><text x="740.0" y="134" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">flag OFF -&gt; old module</text><rect x="620" y="280" width="240" height="90" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="740.0" y="304" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">extracted service</text><text x="740.0" y="324" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">flag ON -&gt; Quarkus</text><text x="740.0" y="340" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">owns its data</text><line x1="510" y1="200" x2="620" y2="130" stroke="#5A5A5A" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#_arrow_muted_1)"/><text x="565.0" y="159.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">flag off</text><line x1="510" y1="240" x2="620" y2="320" stroke="#EE0000" stroke-width="1.6" marker-end="url(#_arrow_rest_0)"/><text x="565.0" y="274.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">flag on</text><rect x="40" y="430" width="1160" height="150" rx="8" ry="8" fill="#F4F4F4" stroke="#D2D2D2" stroke-width="1"/><text x="60" y="456" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="bold" fill="#4A4A4A" text-anchor="start">the six extractions, in dependency order</text><rect x="70" y="490" width="170" height="22" rx="11" ry="11" fill="#0066CC"/><text x="155.0" y="505" font-family="Red Hat Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">1. review</text><line x1="240" y1="500" x2="254" y2="500" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><rect x="254" y="490" width="170" height="22" rx="11" ry="11" fill="#0066CC"/><text x="339.0" y="505" font-family="Red Hat Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">2. notification</text><line x1="424" y1="500" x2="438" y2="500" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><rect x="438" y="490" width="170" height="22" rx="11" ry="11" fill="#0066CC"/><text x="523.0" y="505" font-family="Red Hat Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">3. inventory</text><line x1="608" y1="500" x2="622" y2="500" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><rect x="622" y="490" width="170" height="22" rx="11" ry="11" fill="#0066CC"/><text x="707.0" y="505" font-family="Red Hat Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">4. payment</text><line x1="792" y1="500" x2="806" y2="500" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><rect x="806" y="490" width="170" height="22" rx="11" ry="11" fill="#0066CC"/><text x="891.0" y="505" font-family="Red Hat Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">5. shipping</text><line x1="976" y1="500" x2="990" y2="500" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><rect x="990" y="490" width="170" height="22" rx="11" ry="11" fill="#0066CC"/><text x="1075.0" y="505" font-family="Red Hat Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">6. order</text><text x="60" y="560" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5A5A5A" text-anchor="start">each: lift via Spring-compat -&gt; idiomatic Quarkus -&gt; own data -&gt; cut over -&gt; decommission</text></svg>