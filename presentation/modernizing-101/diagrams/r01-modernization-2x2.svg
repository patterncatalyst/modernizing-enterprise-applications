<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660"><rect x="0" y="0" width="1200" height="660" fill="#FFFFFF"/><text x="600.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">Modernize by value and risk — not all at once</text><text x="600.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">The six Rs on a value / change-risk grid; this book lives in the top-right, done incrementally</text><text x="150" y="130" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5A5A5A" text-anchor="middle">HIGH</text><text x="150" y="566" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5A5A5A" text-anchor="middle">LOW</text><text x="110" y="335" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="bold" fill="#4A4A4A" text-anchor="start">business</text><text x="110" y="353" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="bold" fill="#4A4A4A" text-anchor="start">value</text><rect x="210" y="120" width="440" height="215" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="430.0" y="144" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Rehost / Replatform</text><text x="430.0" y="164" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">quick wins — containerize,</text><text x="430.0" y="180" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">lift onto Kubernetes</text><rect x="666" y="120" width="440" height="215" rx="8" ry="8" fill="#FFFFFF" stroke="#EE0000" stroke-width="1.6"/><text x="886.0" y="144" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Refactor / Re-architect</text><text x="886.0" y="164" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">the strangler fig — one seam</text><text x="886.0" y="180" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">at a time  (this book)</text><rect x="210" y="351" width="440" height="215" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="430.0" y="375" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Retain / Encapsulate</text><text x="430.0" y="395" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">leave it running;</text><text x="430.0" y="411" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">wrap it behind an API</text><rect x="666" y="351" width="440" height="215" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="886.0" y="375" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Retire / Replace</text><text x="886.0" y="395" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">sunset it, or buy/rebuild</text><text x="886.0" y="411" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">only if value justifies it</text><text x="430.0" y="600" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5A5A5A" text-anchor="middle">LOW change / risk</text><text x="886.0" y="600" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5A5A5A" text-anchor="middle">HIGH change / risk</text></svg>