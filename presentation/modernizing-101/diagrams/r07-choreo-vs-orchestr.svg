<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 640" width="1260" height="640"><defs><marker id="_arrow_data_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6A1B9A"/></marker><marker id="_arrow_neutral_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4A4A4A"/></marker></defs><rect x="0" y="0" width="1260" height="640" fill="#FFFFFF"/><text x="630.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">Coordinating across services: two saga styles, same checkout</text><text x="630.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Payment extraction is choreographed; shipping extraction is orchestrated with the Camel Saga EIP</text><rect x="40" y="110" width="560" height="480" rx="8" ry="8" fill="#F4F4F4" stroke="#D2D2D2" stroke-width="1"/><text x="60" y="136" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="bold" fill="#4A4A4A" text-anchor="start">Choreographed (payment) — no conductor</text><rect x="220" y="180" width="200" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="320.0" y="220.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">order</text><rect x="220" y="310" width="200" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="320.0" y="350.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">payment</text><rect x="220" y="440" width="200" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="320.0" y="480.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">shipping</text><line x1="320" y1="250" x2="320" y2="310" stroke="#6A1B9A" stroke-width="1.6" marker-end="url(#_arrow_data_0)"/><text x="320.0" y="274.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">order.placed</text><line x1="320" y1="380" x2="320" y2="440" stroke="#6A1B9A" stroke-width="1.6" marker-end="url(#_arrow_data_0)"/><text x="320.0" y="404.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">payment.captured</text><text x="70" y="560" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5A5A5A" text-anchor="start">services react to each other's events</text><rect x="640" y="110" width="580" height="480" rx="8" ry="8" fill="#F4F4F4" stroke="#D2D2D2" stroke-width="1"/><text x="660" y="136" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="bold" fill="#4A4A4A" text-anchor="start">Orchestrated (shipping) — a route conducts</text><rect x="830" y="180" width="210" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#B36B00" stroke-width="1.6"/><text x="935.0" y="204" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">saga orchestrator</text><text x="935.0" y="224" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">Camel Saga EIP</text><rect x="680" y="350" width="160" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="760.0" y="390.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">reserve</text><rect x="870" y="350" width="160" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="950.0" y="390.0" font-family="Ov